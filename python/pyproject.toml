[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "solana-mpp"
version = "0.1.0"
description = "Solana payment method for the Machine Payments Protocol"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "solders>=0.22",
    "solana>=0.35",
    "pydantic>=2",
    "pydantic-settings>=2",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.110"]
flask = ["flask>=3"]
django = ["django>=4.2"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.8",
    "pyright>=1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/solana_mpp", "src/pay_kit"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
strict = ["src/pay_kit"]
reportMissingTypeStubs = false
include = ["src", "tests"]
exclude = ["**/__pycache__"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["solana_mpp", "pay_kit"]
# Line coverage gate is 90%. Branch coverage is follow-up work tracked in
# issue #108.
branch = false
# pay_kit/preflight.py wraps live Solana RPC + Surfnet cheatcodes that cannot
# run inside the offline unit suite; every meaningful path is a network call.
# Its two opt-out knobs are covered separately against a stubbed run/RPC.
omit = ["src/pay_kit/preflight.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true

# `pay server start` configuration for the sessions sidecar.
#
# The PayKit Playground spawns `pay --sandbox server start sessions.yml` to
# host a real Solana payment-channel session endpoint. The playground
# server proxies `/sessions/*` to this binary, so the route paths defined
# here MUST start with `/sessions/`.

network: localnet
rpc: http://localhost:8899

routes:
  - path: /sessions/stream
    method: GET
    description: "Metered streaming endpoint — billed per chunk via session vouchers."
    payment:
      kind: session
      currency: USDC
      cap: "1.00"            # max USDC the client can commit per session
      perEvent: "0.0001"     # cost per metered SSE chunk
      description: "Live token-stream demo"

  - path: /sessions/compute
    method: POST
    description: "Pay-per-call compute job — voucher debited on completion."
    payment:
      kind: session
      currency: USDC
      cap: "0.50"
      perCall: "0.005"
      description: "Inference job (session billed)"

packages:
  - 'packages/*'

# Force transitive `ws` past GHSA-58qx-3vcg-4xpx (uninitialized memory
# disclosure, patched in 8.20.1). Reaches us via
# @solana/kit > @solana/rpc-subscriptions > @solana/rpc-subscriptions-channel-websocket.
overrides:
  ws: '^8.20.1'

# Explicit postinstall-script allowlist: only these packages may run build
# scripts on install. Every other dependency's scripts stay ignored by
# default, so an unexpected native postinstall cannot execute silently.
# esbuild is the only workspace build tool that legitimately needs its
# postinstall (it downloads the platform binary for vite/vitest).
# Lives here, not in package.json's `pnpm` field: pnpm v10 no longer reads
# that field (it warns "the pnpm field ... is no longer read").
onlyBuiltDependencies:
  - esbuild

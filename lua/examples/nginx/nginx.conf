# OpenResty / nginx config gating /report behind a PayKit charge.
#
# A single init_by_lua_block configures the library at master init; the
# state survives every worker via Lua module caching. The access phase
# calls into access.lua, which is a one-liner.
#
# Sensible defaults: with no environment set, configure() boots against
# solana_localnet (the hosted Surfpool clone at https://402.surfnet.dev:8899)
# with the published demo signer as both operator and recipient. Override
# any field through the PAY_KIT_* env vars in production.
#
# Run (requires OpenResty 1.21+ with lua-resty-openssl):
#   cd lua/examples/nginx
#   openresty -p . -c nginx.conf
# Then:
#   curl -i http://127.0.0.1:4570/health     # 200 (unprotected)
#   curl -i http://127.0.0.1:4570/report     # 402 with PAYMENT-REQUIRED + WWW-Authenticate
#   pay curl http://127.0.0.1:4570/report    # 200 with the protected payload

worker_processes  1;
error_log         stderr  info;
daemon            off;
pid               nginx.pid;
events {
  worker_connections 256;
}

http {
  lua_package_path  '../../?.lua;../../?/init.lua;;';
  lua_package_cpath ';;';

  # Cross-worker replay store. Sized for ~70k entries at default LRU.
  lua_shared_dict   pay_kit_replay  10m;

  init_by_lua_block {
    local pay_kit = require('pay_kit')

    -- Zero-config defaults: solana_localnet -> hosted Surfpool RPC,
    -- demo signer as operator + recipient. configure() returns
    -- (ok, err); fail fast on a misconfiguration.
    local ok, err = pay_kit.configure({
      network     = 'solana_localnet',
      accept      = { 'x402', 'mpp' },
      stablecoins = { 'USDC' },
      mpp = {
        realm      = 'PayKit Example (nginx)',
        expires_in = 300,
      },
    })
    if not ok then
      ngx.log(ngx.ERR, 'pay_kit.configure: ', err)
      os.exit(1)
    end

    -- Declare the paid surface up front so the access-phase call is just
    -- a name lookup.
    pay_kit.gate('report', { amount = pay_kit.usd('0.10') })
  }

  server {
    listen 127.0.0.1:4570 reuseport;
    server_name _;

    location = /health {
      content_by_lua_block { ngx.say('ok') }
    }

    location = /report {
      access_by_lua_file access.lua;
      content_by_lua_block {
        ngx.header['content-type'] = 'application/json'
        ngx.say('{"ok":true,"premium":"true"}')
      }
    }
  }
}

# OpenResty / nginx config that gates `/paid` behind an MPP charge
# challenge by loading `access.lua` in the access phase. `/health` is
# unprotected; `/paid` returns 402 with a signed `WWW-Authenticate`
# header when the caller has no `Authorization: Payment ...` credential.
#
# This is the canonical OpenResty / Kong deployment shape: the Lua
# middleware lives in the access phase, the upstream content phase
# only runs after `mpp_charge` returns 200, and the shared dict
# `mpp_replay` carries the consumed-signature replay store across
# nginx worker processes.
#
# Run (requires OpenResty):
#   cd lua/examples/nginx
#   PORT=4570 openresty -p . -c nginx.conf
# Then:
#   curl -i http://127.0.0.1:4570/health
#   curl -i http://127.0.0.1:4570/paid     # 402 with WWW-Authenticate

worker_processes  1;
error_log         stderr  info;
daemon            off;
pid               nginx.pid;
events {
  worker_connections 256;
}

http {
  # Allow the Lua middleware to find the SDK on disk. The two-up `lua/`
  # path lets a checkout of this monorepo run without `luarocks install`.
  lua_package_path  '../../?.lua;../../?/init.lua;;';
  lua_package_cpath ';;';

  # Shared dict used by `mpp.store.shared_dict` (PR B will ship a real
  # adapter; until then `access.lua` builds an in-memory store per worker
  # which is enough for the 402 issuance demo).
  lua_shared_dict   mpp_replay  10m;

  server {
    listen 127.0.0.1:4570 reuseport;
    server_name _;

    # Free, unprotected health endpoint.
    location = /health {
      default_type application/json;
      return 200 '{"ok":true}';
    }

    # Paid endpoint: access phase runs `access.lua`, which either
    # responds 402 with a signed challenge (when no Authorization
    # header is present) or attempts settlement and lets the
    # upstream content phase render the protected payload on 200.
    location = /paid {
      default_type application/json;
      access_by_lua_file access.lua;
      return 200 '{"ok":true,"paid":true,"resource":"protected payload"}';
    }
  }
}

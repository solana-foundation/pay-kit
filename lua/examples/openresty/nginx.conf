# OpenResty / nginx config gating /report behind a PayKit charge.
#
# Single `init_by_lua_block` configures the lib at master init; the
# state survives all workers via Lua module caching. Access phase
# calls into pay-kit-access.lua which is a one-liner.
#
# Run (requires OpenResty 1.21+ with lua-resty-openssl):
#   cd lua/examples/openresty
#   PORT=4570 openresty -p . -c nginx.conf
# Then:
#   curl -i http://127.0.0.1:4570/health
#   curl -i http://127.0.0.1:4570/report     # 402 with PAYMENT-REQUIRED + WWW-Authenticate

worker_processes  1;
error_log         stderr  info;
daemon            off;
pid               nginx.pid;
events {
  worker_connections 256;
}

http {
  lua_package_path  '../../?.lua;../../?/init.lua;;';
  lua_package_cpath ';;';

  # Cross-worker replay store. Sized for ~70k entries at default LRU.
  lua_shared_dict   pay_kit_replay  10m;

  init_by_lua_block {
    local pay_kit = require('pay_kit')
    local signer  = require('pay_kit.signer')

    local ok, err = pay_kit.configure({
      network     = os.getenv('PAY_KIT_NETWORK') or 'solana_localnet',
      accept      = { 'x402', 'mpp' },
      stablecoins = { 'USDC' },
      rpc_url     = os.getenv('PAY_KIT_RPC_URL'),

      operator = {
        recipient = os.getenv('PAY_KIT_OPERATOR_RECIPIENT'),
        signer    = signer.from_env('PAY_KIT_OPERATOR_KEY'),
      },

      mpp = {
        realm                    = 'PayKit Example (OpenResty)',
        challenge_binding_secret = os.getenv('PAY_KIT_MPP_CHALLENGE_BINDING_SECRET')
          or 'demo-secret-do-not-use-in-prod',
        expires_in               = 300,
      },
    })
    if not ok then
      ngx.log(ngx.ERR, 'pay_kit.configure: ', err)
      os.exit(1)
    end

    -- Declare each paid surface up front so the access-phase call is
    -- just a name lookup. Inline / dynamic forms also supported via
    -- `pay_kit.require_payment(opts_or_fn)`.
    pay_kit.gate('report', { amount = pay_kit.usd('0.10') })
  }

  server {
    listen 127.0.0.1:4570 reuseport;
    server_name _;

    location = /health {
      content_by_lua_block { ngx.say('ok') }
    }

    location = /report {
      access_by_lua_file pay-kit-access.lua;
      content_by_lua_block {
        ngx.header['content-type'] = 'application/json'
        ngx.say('{"ok":true,"premium":"true"}')
      }
    }
  }
}

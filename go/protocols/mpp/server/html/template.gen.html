<!doctype html>
    <html lang="en">
      <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="robots" content="noindex" />
        <meta name="color-scheme" content="light dark" />
        <title>Payment Required</title>
        <style>
  *,
  ::after,
  ::before,
  ::backdrop,
  ::file-selector-button {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    border: 0 solid;
    border-color: var(--mppx-border);
  }
  html,
  :host {
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
    tab-size: 4;
    -webkit-tap-highlight-color: transparent;
  }
  h1,
  h2,
  h3,
  h4,
  h5,
  h6 {
    font-size: inherit;
    font-weight: inherit;
  }
  a {
    color: inherit;
    -webkit-text-decoration: inherit;
    text-decoration: inherit;
  }
  b,
  strong {
    font-weight: bolder;
  }
  code,
  kbd,
  samp,
  pre {
    font-family:
      ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New',
      monospace;
    font-size: 1em;
  }
  small {
    font-size: 80%;
  }
  ol,
  ul,
  menu {
    list-style: none;
  }
  img,
  svg,
  video,
  canvas,
  audio,
  iframe,
  embed,
  object {
    display: block;
    vertical-align: middle;
  }
  img,
  video {
    max-width: 100%;
    height: auto;
  }
  button,
  input,
  select,
  optgroup,
  textarea,
  ::file-selector-button {
    font: inherit;
    font-feature-settings: inherit;
    font-variation-settings: inherit;
    letter-spacing: inherit;
    color: inherit;
    border-radius: 0;
    background-color: transparent;
    opacity: 1;
  }
  ::file-selector-button {
    margin-inline-end: 4px;
  }
  ::placeholder {
    opacity: 1;
  }
  @supports (not (-webkit-appearance: -apple-pay-button)) or (contain-intrinsic-size: 1px) {
    ::placeholder {
      color: color-mix(in oklab, currentcolor 50%, transparent);
    }
  }
  textarea {
    resize: vertical;
  }
  ::-webkit-search-decoration {
    -webkit-appearance: none;
  }
  :-moz-ui-invalid {
    box-shadow: none;
  }
  button,
  input:where([type='button'], [type='reset'], [type='submit']),
  ::file-selector-button {
    appearance: button;
  }
  ::-webkit-inner-spin-button,
  ::-webkit-outer-spin-button {
    height: auto;
  }
  [hidden]:where(:not([hidden='until-found'])) {
    display: none !important;
  }
</style>
    <style>
      :root {
        color-scheme: light dark;
        --mppx-font-family: system-ui, -apple-system, sans-serif;
        --mppx-font-size-base: 16px;
        --mppx-radius: 6px;
        --mppx-spacing-unit: 2px;
        --mppx-accent: #171717;
      --mppx-negative: #e5484d;
      --mppx-positive: #30a46c;
      --mppx-background: #ffffff;
      --mppx-foreground: #0a0a0a;
      --mppx-muted: #666666;
      --mppx-surface: #f5f5f5;
      --mppx-border: #e5e5e5;
      }
    @media (prefers-color-scheme: dark) {
      :root {
        --mppx-accent: #ededed;
      --mppx-negative: #e5484d;
      --mppx-positive: #30a46c;
      --mppx-background: #0a0a0a;
      --mppx-foreground: #ededed;
      --mppx-muted: #a1a1a1;
      --mppx-surface: #1a1a1a;
      --mppx-border: #2e2e2e;
      }
    }
      *:focus-visible {
        outline-color: var(--mppx-accent);
        outline-offset: 0.15rem;
        outline-style: solid;
        outline-width: 2px;
      }
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: var(--mppx-background);
        color: var(--mppx-foreground);
        font-family: var(--mppx-font-family);
        font-size: var(--mppx-font-size-base);
      }
      main {
        display: flex;
        flex-direction: column;
        gap: calc(var(--mppx-spacing-unit) * 8);
        margin-left: auto;
        margin-right: auto;
        max-width: clamp(300px, calc(var(--mppx-spacing-unit) * 224), 896px);
        padding: calc(var(--mppx-spacing-unit) * 12) calc(var(--mppx-spacing-unit) * 8) calc(var(--mppx-spacing-unit) * 16);
      }
      .mppx-header {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: calc(var(--mppx-spacing-unit) * 4);
        justify-content: space-between;
        span {
          background: var(--mppx-surface);
          border: 1px solid var(--mppx-border);
          border-radius: calc(var(--mppx-spacing-unit) * 50);
          font-size: 0.75rem;
          font-weight: 500;
          letter-spacing: 0.025em;
          padding: calc(var(--mppx-spacing-unit) * 1) calc(var(--mppx-spacing-unit) * 4);
        }
      }
      .mppx-logo {
        max-height: 1.75rem;
      }
      .mppx-logo--dark {
        @media (prefers-color-scheme: light) {
          display: none;
        }
      }
      .mppx-logo--light {
        @media (prefers-color-scheme: dark) {
          display: none;
        }
      }
      .mppx-summary {
        background: var(--mppx-surface);
        border: 1px solid var(--mppx-border);
        border-radius: var(--mppx-radius);
        display: flex;
        flex-direction: column;
        gap: calc(var(--mppx-spacing-unit) * 3);
        padding: calc(var(--mppx-spacing-unit) * 6) calc(var(--mppx-spacing-unit) * 6);
      }
      .mppx-summary-amount {
        font-size: 2.5rem;
        font-variant-numeric: tabular-nums;
        font-weight: 700;
        line-height: 1.2;
      }
      .mppx-summary-description {
        font-size: 1.25rem;
      }
      .mppx-summary-expires {
        color: var(--mppx-muted);
      }
      .mppx-error {
        color: var(--mppx-negative);
        font-size: 0.95rem;
        margin-top: calc(var(--mppx-spacing-unit) * -1.5);
        text-align: center;
      }
    </style>

<img

            <span>Payment Required</span>
          </header>

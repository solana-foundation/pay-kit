language = "rust"

# Suites and vector intents this SDK claims. Unclaimed ones are shown
# as "unclaimed" in the coverage table; they are never silently skipped.
[capabilities]
vector = ["charge", "x402-exact", "session"]
protocol = true
flow = false

[[unsupported]]
reason = "the Rust x402 server has no option to require a payment-identifier and never validates extensions"
ids = [
  "vector/x402-ext-server-accepts-valid-id",
  "vector/x402-ext-server-rejects-required-missing-id",
]

[[known_failing]]
id = "vector/charge-asset-over-currency-precedence"
reason = "Rust ChargeRequest has no top-level asset twin; the MPP charge request defines only currency, so the field is ignored"
tracking = "FINDINGS.md#charge-precedence-twins-not-in-spec"

[[known_failing]]
id = "vector/charge-payto-over-recipient-precedence"
reason = "Rust ChargeRequest has no top-level payTo twin; the MPP charge request defines only recipient, so the field is ignored"
tracking = "FINDINGS.md#charge-precedence-twins-not-in-spec"

[[known_failing]]
id = "vector/charge-spl-field-omitted-defaults"
reason = "vector omits decimals and tokenProgram; Rust follows the spec (decimals required for a mint, token program fetched from the mint and rejected if the lookup fails) and refuses offline"
tracking = "FINDINGS.md#charge-default-vectors-contradict-spec"

[[known_failing]]
id = "vector/charge-token2022-default-program-by-currency"
reason = "vector omits tokenProgram and expects a currency-based default; Rust fetches the mint owner as the spec requires and refuses when the lookup fails"
tracking = "FINDINGS.md#charge-default-vectors-contradict-spec"

[[known_failing]]
id = "vector/charge-split-ata-memo-envelope-accept"
reason = "Rust client refuses ataCreationRequired without a server fee payer unless allow_payer_funded_ata_creation is set; the spec says the client MUST include the ATA creation"
tracking = "FINDINGS.md#rust-refuses-payer-funded-split-ata"

[[known_failing]]
id = "vector/x402-exact-v1-build-devnet"
reason = "offer carries no decimals, so the Rust client reads the mint over RPC to build transferChecked; the vector provides no mint fixture"
tracking = "FINDINGS.md#x402-build-vectors-need-mint-decimals"

[[known_failing]]
id = "vector/x402-exact-v1-build-mainnet-network-name"
reason = "offer carries no decimals, so the Rust client reads the mint over RPC to build transferChecked; the vector provides no mint fixture"
tracking = "FINDINGS.md#x402-build-vectors-need-mint-decimals"

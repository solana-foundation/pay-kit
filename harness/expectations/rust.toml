# ── x402 batch-settlement (SVM) ──

[[unsupported]]
reason = "the Rust kit has no CloseAuthorization encoder: it refuses every cooperative close (x402/protocol/schemes/batch_settlement/verify.rs check_no_cooperative_close), so no public API produces the close digest"
ids = [
  "vector/batch-close-authorization-digest-binds-network",
  "vector/batch-close-authorization-digest-binds-watermark",
  "vector/batch-close-authorization-digest-frozen",
]

[[unsupported]]
reason = "the Rust kit exposes no receiver-binding memo encoder (RECEIVER_BINDING_MEMO_PREFIX is private to x402/client/batch_settlement/payment.rs)"
ids = [
  "vector/batch-receiver-binding-memo-frozen",
]

[[known_failing]]
ids = [
  "vector/batch-build-deposit-open",
  "vector/batch-build-terms-payment-flow-authorization",
  "vector/batch-verify-open-accept",
  "vector/batch-verify-open-foreign-binding-reject",
  "vector/batch-verify-open-grace-period-mismatch-reject",
  "vector/batch-verify-open-missing-binding-memo-reject",
]
reason = "the client opens a client-mode channel without the receiver-binding memo, and the server admits exactly one memo in an open, so it accepts an unbound open and refuses the spec's two-memo open (\"An open suffix also carries exactly one binding Memo from section 3.\")"
tracking = "FINDINGS.md#batch-open-binding-memo"


  "vector/subscription-build-spec-request",
]
reason = "the client needs the kit's own methodDetails extensions (amount, recipient, planIdNumeric, planBump, expectedPeriodHours, expectedCreatedAt) and refuses a spec-shaped challenge (rust/crates/kit/src/mpp/protocol/intents/subscription.rs:176, rust/crates/kit/src/mpp/client/subscription.rs:266); the case records the kit divergence"
tracking = "FINDINGS.md#subscription-rust-client-kit-extensions"

[[known_failing]]
ids = [
  "vector/subscription-build-amount-leading-zero-reject",
  "vector/subscription-build-zero-amount-reject",
  "vector/subscription-build-period-count-leading-zero-reject",
  "vector/subscription-period-count-leading-zero-reject",
  "vector/subscription-period-count-sign-reject",
  "vector/subscription-build-token-program-not-spl-reject",
  "vector/subscription-build-no-decimals-reject",
]
reason = "the request's amount / periodCount formats, tokenProgram and decimals are never validated: u64::from_str accepts \"010000000\", \"0\", \"030\", \"+30\" (rust/crates/kit/src/mpp/protocol/intents/subscription.rs:201-212), any tokenProgram is used (rust/crates/kit/src/mpp/client/subscription.rs:224) and decimals is optional (rust/crates/kit/src/mpp/protocol/intents/subscription.rs:322); the cases record the kit divergence"
tracking = "FINDINGS.md#subscription-rust-request-format"


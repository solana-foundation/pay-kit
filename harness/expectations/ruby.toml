language = "ruby"

# Suites and vector intents this SDK claims. Unclaimed ones are shown
# as "unclaimed" in the coverage table; they are never silently skipped.
[capabilities]
vector = ["charge", "x402-exact"]
protocol = true
flow = false
# Offline cross-verification: this SDK verifies every other SDK's saved builds
# (`pkc run --cross --require`); cells are cross/<case>/<client>/<server>.
cross = true
# Whether the testee drives the SDK at the clock a vector pins; claims no session intent, so no clock-pinned case runs.
# Cross-checked against the testee `capabilities` op.
honours_clock = false

[[unsupported]]
reason = "ruby SDK is server-only: build-transaction has no client builder"
ids = [
  "vector/charge-sol-native-build",
  "vector/charge-spl-missing-decimals-reject",
  "vector/charge-spl-token-program-from-mint-owner",
  "vector/charge-splits-consume-amount-reject",
  "vector/charge-token-program-lookup-missing-mint-reject",
  "vector/charge-token-program-unexpected-owner-reject",
  "vector/charge-token2022-program-from-mint-owner",
]


[[unsupported]]
reason = "ruby SDK is server-only: x402 build-transaction has no client builder"
ids = [
  "vector/x402-exact-v1-build-devnet",
  "vector/x402-exact-v1-build-mainnet-network-name",
  "vector/x402-exact-v2-build",
  "vector/x402-exact-v2-build-default-producer",
  "vector/x402-ext-echo-payment-identifier",
  "vector/x402-ext-echo-payment-identifier-pinned-id",
  "vector/x402-ext-omit-when-none-advertised",
  "vector/x402-ext-preserve-unknown-verbatim",
]

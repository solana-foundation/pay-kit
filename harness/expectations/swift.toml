language = "swift"

# Suites and vector intents this SDK claims. Unclaimed ones are shown
# as "unclaimed" in the coverage table; they are never silently skipped.
[capabilities]
vector = ["charge", "x402-exact", "session"]
protocol = false
flow = false
# Whether the testee drives the SDK at the clock a vector pins; no session voucher verifier, so no clock-pinned case runs (all listed unsupported).
# Cross-checked against the testee `capabilities` op.
honours_clock = false

[[unsupported]]
reason = "swift session wire types (SessionTypes.swift) model the superseded draft; the SDK has no parser for the final session wire contract"
ids = [
  "vector/session-wire-action-close-frozen",
  "vector/session-wire-action-open-draft-slot-echo-reject",
  "vector/session-wire-action-open-frozen",
  "vector/session-wire-action-unknown-tag-reject",
  "vector/session-wire-action-voucher-frozen",
  "vector/session-wire-action-voucher-legacy-inner-data-reject",
  "vector/session-wire-request-new-channel-frozen",
  "vector/session-wire-request-resume-frozen",
  "vector/session-wire-request-superseded-draft-reject",
]

[[unsupported]]
reason = "swift is a client-only SDK and does not implement verify-transaction"
ids = [
  "vector/charge-compute-price-over-cap-reject",
  "vector/charge-feepayer-as-authority-reject",
  "vector/charge-split-duplicate-memo-accept",
  "vector/charge-split-duplicate-memo-reuse-reject",
  "vector/charge-split-duplicate-recipient-sol-accept",
  "vector/charge-split-duplicate-recipient-sol-reuse-reject",
  "vector/charge-split-duplicate-recipient-spl-accept",
  "vector/charge-split-duplicate-recipient-spl-reuse-reject",
  "vector/charge-verify-wrong-amount-reject",
  "vector/charge-verify-wrong-mint-reject",
  "vector/charge-verify-wrong-recipient-reject",
  "vector/charge-split-ata-memo-envelope-accept",
  "vector/charge-transferchecked-decimals-match-accept",
  "vector/charge-transferchecked-decimals-mismatch-reject",
  "vector/session-voucher-expired-at-now",
  "vector/session-voucher-never-expires-with-window",
  "vector/session-voucher-window-at-boundary",
  "vector/session-voucher-window-one-above",
  "vector/session-voucher-window-one-below",
]

[[unsupported]]
reason = "swift is a client-only SDK and does not implement x402 verify-transaction"
ids = [
  "vector/x402-exact-unknown-version-reject",
  "vector/x402-exact-v1-verify-accept-devnet",
  "vector/x402-exact-v1-verify-accept-mainnet",
  "vector/x402-exact-v1-verify-reject-unknown-version",
  "vector/x402-exact-v1-verify-reject-wrong-network",
  "vector/x402-exact-v2-verify-accept",
  "vector/x402-ext-server-accepts-valid-id",
  "vector/x402-ext-server-rejects-required-missing-id",
  "vector/x402-exact-v2-verify-wrong-network-reject",
  "vector/x402-exact-verify-accepted-amount-lie-reject",
  "vector/x402-exact-verify-accepted-asset-lie-reject",
  "vector/x402-exact-verify-accepted-payto-lie-reject",
  "vector/x402-exact-verify-fee-payer-authority-reject",
  "vector/x402-exact-verify-fee-payer-in-accounts-reject",
  "vector/x402-exact-verify-memo-match-accept",
  "vector/x402-exact-verify-memo-mismatch-reject",
  "vector/x402-exact-verify-overpayment-accept",
  "vector/x402-exact-verify-two-transfers-reject",
  "vector/x402-exact-verify-underpayment-reject",
  "vector/x402-exact-verify-zero-transfers-reject",
]

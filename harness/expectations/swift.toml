language = "swift"

# Suites and vector intents this SDK claims. Unclaimed ones are shown
# as "unclaimed" in the coverage table; they are never silently skipped.
[capabilities]
vector = ["charge", "x402-exact", "session"]
protocol = false
flow = false
# Interop roles (pkc run --tier interop), <protocol>:<scheme>:<role>; cases are interop/<scenario>/<client>/<server>.
interop = ["mpp:charge:client", "x402:exact:client", "x402:upto:client"]
# Whether the testee drives the SDK at the clock a vector pins; no session voucher verifier, so no clock-pinned case runs (all listed unsupported).
# Cross-checked against the testee `capabilities` op.
honours_clock = false

[[unsupported]]
reason = "swift session wire types (SessionTypes.swift) model the superseded draft; the SDK has no parser for the final session wire contract"
ids = [
  "vector/session-wire-action-close-frozen",
  "vector/session-wire-action-open-draft-slot-echo-reject",
  "vector/session-wire-action-open-frozen",
  "vector/session-wire-action-unknown-tag-reject",
  "vector/session-wire-action-voucher-frozen",
  "vector/session-wire-action-voucher-legacy-inner-data-reject",
  "vector/session-wire-request-new-channel-frozen",
  "vector/session-wire-request-resume-frozen",
  "vector/session-wire-request-superseded-draft-reject",
]


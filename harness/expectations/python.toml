language = "python"

# Suites and vector intents this SDK claims. Unclaimed ones are shown
# as "unclaimed" in the coverage table; they are never silently skipped.
[capabilities]
vector = ["charge", "x402-exact", "session"]
protocol = true
flow = false
# Offline cross-verification: this SDK verifies every other SDK's saved builds
# (`pkc run --cross --require`); cells are cross/<case>/<client>/<server>.
cross = true
# Interop roles (pkc run --tier interop), <protocol>:<scheme>:<role>; cases are interop/<scenario>/<client>/<server>.
interop = ["x402:exact:client", "x402:exact:server", "x402:upto:client", "x402:upto:server", "mpp:charge:server", "mpp:session:client", "mpp:session:server"]
# Whether the testee drives the SDK at the clock a vector pins; the runner drives the session voucher verifier at sessionVoucherVerify.nowSeconds.
# Cross-checked against the testee `capabilities` op.
honours_clock = true


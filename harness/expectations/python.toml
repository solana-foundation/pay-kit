language = "python"

# Suites and vector intents this SDK claims. Unclaimed ones are shown
# as "unclaimed" in the coverage table; they are never silently skipped.
[capabilities]
vector = ["charge", "x402-exact", "session"]
protocol = true
flow = false
# Offline cross-verification: this SDK verifies every other SDK's saved builds
# (`pkc run --cross --require`); cells are cross/<case>/<client>/<server>.
cross = true
# Interop roles (pkc run --tier interop), <protocol>:<scheme>:<role>; cases are interop/<scenario>/<client>/<server>.
interop = ["x402:exact:client", "x402:exact:server", "x402:upto:client", "x402:upto:server", "mpp:charge:server", "mpp:session:client", "mpp:session:server"]
# Whether the testee drives the SDK at the clock a vector pins; the runner drives the session voucher verifier at sessionVoucherVerify.nowSeconds.
# Cross-checked against the testee `capabilities` op.
honours_clock = true

[[unsupported]]
reason = "unsupported-mode: canonical-bytes"
ids = [
  "vector/x402-wire-transaction-versions-golden",
  "vector/x402-wire-transaction-versions-v1-only-golden",
]

[[unsupported]]
reason = "the runner's session verify path drives only the SDK's voucher verifier (input.sessionVoucherVerify); it has no path to the session server's open checks (input.sessionOpenVerify, input.sessionServerVerify)"
pattern = "vector/session-open-*"

# draft-solana-session-00 server, client build and strict wire vectors
# (rust/crates/conformance/src/cases/session_server.rs).

[[unsupported]]
reason = "the runner's session verify path drives only the SDK's voucher verifier (input.sessionVoucherVerify); it has no path to a session server's voucher, topUp or close processing over stored channel state (input.sessionServerVerify)"
pattern = "vector/session-voucher-verify-*"

[[unsupported]]
reason = "the runner's session verify path drives only the SDK's voucher verifier (input.sessionVoucherVerify); it has no path to a session server's voucher, topUp or close processing over stored channel state (input.sessionServerVerify)"
pattern = "vector/session-topup-*"

[[unsupported]]
reason = "the runner's session verify path drives only the SDK's voucher verifier (input.sessionVoucherVerify); it has no path to a session server's voucher, topUp or close processing over stored channel state (input.sessionServerVerify)"
pattern = "vector/session-close-*"

[[unsupported]]
reason = "the runner's session verify path drives only the SDK's voucher verifier (input.sessionVoucherVerify); it has no path to a session server's use processing over stored channel state (input.sessionServerVerify). The SDK's process_use charges before serving; it has no authenticate-then-charge-metered path (draft-solana-session-00 Debit Processing, cost known only after generation)"
pattern = "vector/session-use-*"

[[unsupported]]
reason = "the runner has no path to the SDK's session client open builder (input.sessionOpenBuild)"
pattern = "vector/session-build-*"

language = "go"

# Suites and vector intents this SDK claims. Unclaimed ones are shown
# as "unclaimed" in the coverage table; they are never silently skipped.
[capabilities]
vector = ["charge", "x402-exact", "session"]
protocol = true
flow = false
# Offline cross-verification: this SDK verifies every other SDK's saved builds
# (`pkc run --cross --require`); cells are cross/<case>/<client>/<server>.
cross = true
# Whether the testee drives the SDK at the clock a vector pins; the runner drives the session voucher verifier at sessionVoucherVerify.nowSeconds.
# Cross-checked against the testee `capabilities` op.
honours_clock = true

[[unsupported]]
reason = "Go session wire types are on the superseded draft, not mpp-specs e702dd8: intents.OpenPayload carries recentSlot instead of openSlot and SignedVoucher nests the voucher under data instead of voucher (go/protocols/mpp/intents/session.go)"
ids = [
  "vector/session-wire-action-close-frozen",
  "vector/session-wire-action-open-draft-slot-echo-reject",
  "vector/session-wire-action-open-frozen",
  "vector/session-wire-action-unknown-tag-reject",
  "vector/session-wire-action-voucher-frozen",
  "vector/session-wire-action-voucher-legacy-inner-data-reject",
  "vector/session-wire-request-new-channel-frozen",
  "vector/session-wire-request-resume-frozen",
  "vector/session-wire-request-superseded-draft-reject",
]

[[known_failing]]
id = "vector/x402-exact-verify-extra-required-signer-reject"
reason = "the x402 exact verifier accepts a third required signer (scheme_exact_svm.md §2.1.4); go/protocols/x402/verify.go:81 never checks the header's signer set"
tracking = "FINDINGS.md#x402-extra-required-signer-accepted"

[[known_failing]]
id = "vector/charge-build-sol-token-program-reject"
reason = "the client builds a SOL charge whose challenge carries tokenProgram (go/protocols/mpp/client/charge.go:92)"
tracking = "FINDINGS.md#charge-client-sol-token-program-ignored"

[[known_failing]]
id = "vector/charge-build-fee-payer-without-key-reject"
reason = "feePayer=true without feePayerKey falls back to a client-paid transaction (go/protocols/mpp/client/charge.go:87)"
tracking = "FINDINGS.md#charge-client-fee-payer-without-key"

[[known_failing]]

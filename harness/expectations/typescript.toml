language = "typescript"

# Suites and vector intents this SDK claims. Unclaimed ones are shown
# as "unclaimed" in the coverage table; they are never silently skipped.
[capabilities]
vector = [
  "charge",
  "x402-exact",
  "session",
  "x402-upto",
  "x402-batch-settlement",
  "subscription",
]
protocol = true
flow = true
# Offline cross-verification: this SDK verifies every other SDK's saved builds
# (`pkc run --cross --require`); cells are cross/<case>/<client>/<server>.
cross = true
# Interop roles (pkc run --tier interop), <protocol>:<scheme>:<role>; cases are interop/<scenario>/<client>/<server>.
interop = ["mpp:charge:client", "mpp:charge:server", "x402:exact:client", "x402:exact:server", "x402:upto:server"]
# Whether the testee drives the SDK at the clock a vector pins; the runner drives the session voucher verifier at sessionVoucherVerify.nowSeconds.
# Cross-checked against the testee `capabilities` op.
honours_clock = true

[[unsupported]]
reason = "flow driver port does not implement the upstream `http.payment_request` client capability"
ids = [
  "flow/cross_origin_redirect_before_402_rejected",
  "flow/plain_payment_request",
  "flow/same_origin_payment_request",
  "flow/same_origin_post_payment_request",
]

[[unsupported]]
reason = "@solana/mpp's session server (createSessionServer, typescript/packages/mpp/src/server/Session.ts) takes no accepted transaction-version set, so a server configured with sessionOpenVerify.server.transactionVersions other than [0] cannot be expressed"
ids = [
  "vector/session-open-legacy-reject",
  "vector/session-open-v0-with-v1-advertised-accept",
  "vector/session-open-v1-advertised-accept",
  "vector/session-open-v1-compute-budget-instruction-reject",
  "vector/session-open-v1-missing-compute-unit-limit-reject",
  "vector/session-open-v1-priority-fee-over-cap-reject",
]

[[known_failing]]
id = "vector/session-open-v1-not-advertised-reject"
reason = "@solana/mpp's session open verifier (verifyOpenTx, typescript/packages/mpp/src/server/session/on-chain.ts) has no version admission: a version-1 open for a server accepting [0] throws while decoding (`message.instructions is not iterable`) instead of `transaction version 1 is not accepted` (unsupported-version)"
tracking = "FINDINGS.md#txv1-ts-mpp-session-no-version-admission"

# Transaction versions (SIMD-0385; mpp-specs-txv1, x402-txv1).
[[unsupported]]
reason = "@solana/mpp buildChargeTransaction takes no highest signable transaction version (input.signerMaxTransactionVersion); the @solana/pay-kit x402 client does (maxTransactionVersion)"
ids = [
  "vector/charge-build-signer-v0-picks-v0",
  "vector/charge-build-no-buildable-version-reject",
]

[[known_failing]]
ids = [
  "vector/charge-wire-transaction-versions-both-golden",
  "vector/charge-wire-transaction-versions-v1-only-golden",
  "vector/charge-wire-transaction-versions-legacy-reject",
  "vector/charge-wire-transaction-versions-unknown-reject",
  "vector/charge-wire-transaction-versions-string-entry-reject",
  "vector/charge-wire-transaction-versions-not-array-reject",
  "vector/session-wire-transaction-versions-both-golden",
  "vector/session-wire-transaction-versions-v1-only-golden",
  "vector/session-wire-transaction-versions-v0-golden",
  "vector/session-wire-transaction-versions-legacy-reject",
  "vector/session-wire-transaction-versions-unknown-reject",
  "vector/session-wire-transaction-versions-string-entry-reject",
]
reason = "@solana/mpp's charge and session request schemas (typescript/packages/mpp/src/Methods.ts) have no methodDetails.transactionVersions: zod strips the field, so the goldens lose it and the legacy/unknown/string/not-array rejects parse (mpp-specs-txv1: \"Servers MUST accept every version they list\")"
tracking = "FINDINGS.md#txv1-ts-mpp-no-transaction-versions"


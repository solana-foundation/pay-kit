language = "typescript"

# Suites and vector intents this SDK claims. Unclaimed ones are shown
# as "unclaimed" in the coverage table; they are never silently skipped.
[capabilities]
vector = ["charge", "x402-exact", "session"]
protocol = true
flow = true

[[unsupported]]
reason = "flow driver port does not implement the upstream `http.payment_request` client capability"
ids = [
  "flow/cross_origin_redirect_before_402_rejected",
  "flow/plain_payment_request",
  "flow/same_origin_payment_request",
  "flow/same_origin_post_payment_request",
]

[[unsupported]]
reason = "@solana/pay-kit speaks x402 v2 only: its client answers only the PAYMENT-REQUIRED header and its server registers only the v2 exact facilitator"
ids = [
  "vector/x402-exact-v1-build-devnet",
  "vector/x402-exact-v1-build-mainnet-network-name",
  "vector/x402-exact-v1-verify-accept-devnet",
  "vector/x402-exact-v1-verify-accept-mainnet",
  "vector/x402-exact-v1-verify-reject-wrong-network",
]

[[unsupported]]
reason = "@solana/pay-kit generates the payment-identifier id itself and has no option to supply the caller-chosen id these vectors pin"
ids = [
  "vector/x402-ext-echo-payment-identifier-pinned-id",
  "vector/x402-ext-preserve-unknown-verbatim",
]

[[known_failing]]
id = "vector/x402-exact-v2-verify-wrong-network-reject"
reason = "pay-kit never compares the credential accepted to the route; the network lie is caught by the facilitator as wrong-network"
tracking = "FINDINGS.md#ts-x402-accepted-not-bound"

[[known_failing]]
id = "vector/x402-exact-verify-accepted-amount-lie-reject"
reason = "pay-kit never compares the credential accepted to the route; the lie is caught only by the transaction amount check"
tracking = "FINDINGS.md#ts-x402-accepted-not-bound"

[[known_failing]]
id = "vector/x402-exact-verify-accepted-asset-lie-reject"
reason = "pay-kit never compares the credential accepted to the route; the lie is caught only by the transaction mint check"
tracking = "FINDINGS.md#ts-x402-accepted-not-bound"

[[known_failing]]
id = "vector/x402-exact-verify-accepted-payto-lie-reject"
reason = "pay-kit never compares the credential accepted to the route; the lie is caught only by the transaction recipient check"
tracking = "FINDINGS.md#ts-x402-accepted-not-bound"

[[known_failing]]
id = "vector/x402-exact-verify-fee-payer-in-accounts-reject"
reason = "the vendored @x402/svm 2.26.0 facilitator checks the fee payer only as transfer authority and accepts it as a signer account of a Memo instruction (§2.1.1)"
tracking = "FINDINGS.md#ts-x402-fee-payer-in-accounts"

[[known_failing]]
id = "vector/x402-exact-verify-overpayment-accept"
reason = "the vendored @x402/svm 2.26.0 facilitator requires transfer amount == requirement and rejects overpayment (RULINGS S5)"
tracking = "FINDINGS.md#x402-overpayment-rejected"

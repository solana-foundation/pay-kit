language = "typescript"

# Suites and vector intents this SDK claims. Unclaimed ones are shown
# as "unclaimed" in the coverage table; they are never silently skipped.
[capabilities]
vector = ["charge", "x402-exact", "session", "x402-batch-settlement"]
protocol = true
flow = true
# Offline cross-verification: this SDK verifies every other SDK's saved builds
# (`pkc run --cross --require`); cells are cross/<case>/<client>/<server>.
cross = true
# Interop roles (pkc run --tier interop), <protocol>:<scheme>:<role>; cases are interop/<scenario>/<client>/<server>.
interop = ["mpp:charge:client", "mpp:charge:server", "x402:exact:client", "x402:exact:server"]
# Whether the testee drives the SDK at the clock a vector pins; the runner drives the session voucher verifier at sessionVoucherVerify.nowSeconds.
# Cross-checked against the testee `capabilities` op.
honours_clock = true

[[unsupported]]
reason = "flow driver port does not implement the upstream `http.payment_request` client capability"
ids = [
  "flow/cross_origin_redirect_before_402_rejected",
  "flow/plain_payment_request",
  "flow/same_origin_payment_request",
  "flow/same_origin_post_payment_request",
]

[[unsupported]]
reason = "@solana/pay-kit speaks x402 v2 only: its client answers only the PAYMENT-REQUIRED header and its server registers only the v2 exact facilitator"
ids = [
  "vector/x402-exact-v1-build-devnet",
  "vector/x402-exact-v1-build-mainnet-network-name",
  "vector/x402-exact-v1-verify-accept-devnet",
  "vector/x402-exact-v1-verify-accept-mainnet",
  "vector/x402-exact-v1-verify-reject-wrong-network",
]

[[unsupported]]
reason = "@solana/pay-kit speaks x402 v2 only, so its verifier cannot check other SDKs' v1 X-PAYMENT builds"
pattern = "cross/x402-exact-v1-build-*/*/typescript"

[[unsupported]]
reason = "@solana/pay-kit generates the payment-identifier id itself and has no option to supply the caller-chosen id these vectors pin"

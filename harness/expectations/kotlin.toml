language = "kotlin"

# Suites and vector intents this SDK claims. Unclaimed ones are shown
# as "unclaimed" in the coverage table; they are never silently skipped.
[capabilities]
vector = ["session"]
protocol = false
flow = false
# Interop roles (pkc run --tier interop), <protocol>:<scheme>:<role>; cases are interop/<scenario>/<client>/<server>.
interop = ["mpp:charge:client", "x402:exact:client", "x402:upto:client"]
# Whether the testee drives the SDK at the clock a vector pins; no session voucher verifier, so no clock-pinned case runs (all listed unsupported).
# Cross-checked against the testee `capabilities` op.
honours_clock = false

[[unsupported]]
reason = "kotlin conformance runner only implements canonical-bytes session vectors"
ids = [
  "vector/session-voucher-expired-at-now",
  "vector/session-voucher-never-expires-with-window",
  "vector/session-voucher-window-at-boundary",
  "vector/session-voucher-window-one-above",
  "vector/session-voucher-window-one-below",
]

[[unsupported]]
reason = "kotlin conformance runner only supports the session voucherPreimage canonical-bytes vector"
ids = [
  "vector/session-wire-action-close-frozen",
  "vector/session-wire-action-open-draft-slot-echo-reject",
  "vector/session-wire-action-open-frozen",
  "vector/session-wire-action-unknown-tag-reject",
  "vector/session-wire-action-voucher-frozen",
  "vector/session-wire-action-voucher-legacy-inner-data-reject",
  "vector/session-wire-request-new-channel-frozen",
  "vector/session-wire-request-resume-frozen",
  "vector/session-wire-request-superseded-draft-reject",
]

[[known_failing]]
ids = [
  "interop/charge-client-wrong-network/kotlin/rust",
]
reason = "the client submits a credential for a challenge naming another cluster (draft-solana-charge-00: \"Clients MUST reject challenges whose network does not match their configured cluster\")"
tracking = "FINDINGS.md#charge-client-network-not-checked"

[[known_failing]]
ids = [
  "interop/charge-client-over-asking-price/kotlin/rust",
]
reason = "the client pays a challenge whose amount was multiplied by 10000 after the server bound it; nothing checks the amount against what it was asked to pay (core: \"Clients MUST verify before authorizing payment\")"
tracking = "FINDINGS.md#charge-client-request-not-verified"

[[known_failing]]
ids = [
  "interop/charge-client-mis-signed-challenge/kotlin/rust",
]
reason = "the client pays a challenge whose recipient was replaced after the server bound its id (core: \"Clients MUST verify before authorizing payment ... Recipient/address is expected\")"
tracking = "FINDINGS.md#charge-client-request-not-verified"

[[known_failing]]
ids = [
  "interop/x402-exact-client-wrong-network/kotlin/rust",
]
reason = "the x402 client pays a requirement for solana mainnet while configured for the devnet CAIP-2 network"
tracking = "FINDINGS.md#x402-client-network-not-checked"

[package]
name = "mpp-harness-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
solana-pay-kit = { path = "../../rust/crates/kit", features = ["mpp", "client"] }
# Pin to the 4.0 line (matches the kit build): 4.1+ pulls solana-transaction 4.x
# which would clash with the 3.x txns the kit API uses.
solana-rpc-client = { version = "=4.0.0", default-features = false }
solana-signature = "3.1"
solana-transaction = "3"
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"

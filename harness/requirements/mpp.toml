id = "MPP-89a6d0c5d7"
doc = "specs/methods/solana/draft-solana-session-00.md"
text = "Once a channel is opened, vouchers for that channel MUST verify under the channel's authorizedSigner."
required = true

[[requirement]]
id = "MPP-89f2059960"
doc = "specs/methods/solana/draft-solana-session-00.md"
text = "Action: \"open\" MUST NOT carry an initial voucher."
required = true

[[requirement]]
id = "MPP-8c63a2fb5d"
doc = "specs/methods/solana/draft-solana-session-00.md"
text = "For client, the server MUST verify the voucher signature and channel binding."
required = true

[[requirement]]
id = "MPP-8ea927661c"
doc = "specs/methods/solana/draft-solana-session-00.md"
text = "| amount | u64 | Amount to add in base units; MUST be non-zero |"
required = true

[[requirement]]
id = "MPP-8ebbf6e151"
doc = "specs/methods/solana/draft-solana-session-00.md"
text = "Equal or lower amounts MUST be rejected for metered voucher acceptance unless they are exact idempotent replays handled per \"Concurrency and Idempotency\"."
required = true

[[requirement]]
id = "MPP-994af38957"
doc = "specs/methods/solana/draft-solana-session-00.md"
text = "Clients and servers MUST derive the expected channelId from the channel program ID and the seed components above and MUST verify that the open transaction creates and funds exactly that PDA."
required = true

[[requirement]]
id = "MPP-9edde7b556"
doc = "specs/methods/solana/draft-solana-session-00.md"
text = "| type | string | REQUIRED | The string \"proof\" |"
required = true

[[requirement]]
id = "MPP-a1180cd750"
doc = "specs/methods/solana/draft-solana-session-00.md"
text = "A voucher at or below settled MUST equal the server's acceptedCumulative, authenticates close only, and MUST NOT be submitted as a settlement update."
required = true

[[requirement]]
id = "MPP-a3aff47c7c"
doc = "specs/methods/solana/draft-solana-session-00.md"
text = "Servers MUST stop accepting new service vouchers once closureStartedAt is set."
required = true

[[requirement]]
id = "MPP-a3d2da92ea"
doc = "specs/methods/solana/draft-solana-session-00.md"
text = "MUST be present when currency is a mint address."
required = true

[[requirement]]
id = "MPP-a4620e1d52"
doc = "specs/methods/solana/draft-solana-session-00.md"
text = "Servers that sponsor or submit open transactions MUST treat the decoded transaction contents as the committed request."
required = true

[[requirement]]
id = "MPP-a5edb594a1"
doc = "specs/methods/solana/draft-solana-session-00.md"
text = "| transaction | string | REQUIRED | Base64-encoded (standard alphabet, padded) signed or partially signed transaction |"
required = true

[[requirement]]
id = "MPP-a9cb73c5b3"
doc = "specs/methods/solana/draft-solana-session-00.md"
text = "| distributionSplits | array | OPTIONAL | Splits preimage (see the challenge's methodDetails.distributionSplits); MUST byte-match the splits proposed in the 402 challenge |"
required = true

[[requirement]]
id = "MPP-a9eb047d07"
doc = "specs/methods/solana/draft-solana-session-00.md"
text = "| salt | string | REQUIRED | Decimal u64 PDA disambiguator |"
required = true

[[requirement]]
id = "MPP-aa166e34b4"
doc = "specs/methods/solana/draft-solana-session-00.md"
text = "| authorizedSigner | string | REQUIRED | Base58 public key bound into the PDA seeds as the voucher signer; MAY equal payer or a delegated signer |"
required = true

[[requirement]]
id = "MPP-abf416b62c"
doc = "specs/methods/solana/draft-solana-session-00.md"
text = "Clients MUST verify the methodDetails.channelProgram in the challenge matches a known, audited program before depositing funds."
required = true

[[requirement]]
id = "MPP-ae84beeba3"
doc = "specs/methods/solana/draft-solana-session-00.md"
text = "Voucher submissions with cumulativeAmount <= acceptedCumulative and no matching cached idempotent response MUST be rejected and MUST NOT reduce channel state."
required = true

[[requirement]]
id = "MPP-b23323ead0"
doc = "specs/methods/solana/draft-solana-session-00.md"
text = "| challengeId | string | REQUIRED | Session challenge ID signed as sessionChallengeId |"
required = true

[[requirement]]
id = "MPP-b5cf9fcdaa"
doc = "specs/methods/solana/draft-solana-session-00.md"
text = "If the challenge supplied tokenProgram, the decoded token program MUST match it; otherwise it MUST be a supported token program for the mint."
required = true

[[requirement]]
id = "MPP-bb80675c8e"
doc = "specs/methods/solana/draft-solana-session-00.md"
text = "There is no default; the challenge MUST state the cluster explicitly."
required = true

[[requirement]]
id = "MPP-bcea8a5303"
doc = "specs/methods/solana/draft-solana-session-00.md"
text = "| authentication | object | Conditionally REQUIRED | Reusable proof; REQUIRED for operator and MUST be absent for client |"
required = true

[[requirement]]
id = "MPP-bf87a688ef"
doc = "specs/methods/solana/draft-solana-session-00.md"
text = "The server MUST set the 402 challenge currency only to an allow-listed mint and MUST reject any open whose decoded mint is not on the list."
required = true

[[requirement]]
id = "MPP-c108029161"
doc = "specs/methods/solana/draft-solana-session-00.md"
text = "Servers MUST reject Action: \"open\" credentials when the challenge, HTTP payload, decoded transaction, derived PDA, escrow ATA, token program, or confirmed on-chain state disagree."
required = true

[[requirement]]
id = "MPP-c20fb92f4d"
doc = "specs/methods/solana/draft-solana-session-00.md"
text = "The client MUST NOT include this field when the challenge omits idleTimeoutOptionsSeconds."
required = true

[[requirement]]
id = "MPP-c74d298862"
doc = "specs/methods/solana/draft-solana-session-00.md"
text = "| voucher | object | Conditionally REQUIRED | REQUIRED for client and MUST be absent for operator; authenticates close and MAY advance settlement (see {{voucher-format}}) |"
required = true

[[requirement]]
id = "MPP-cb6b8e2000"
doc = "specs/methods/solana/draft-solana-session-00.md"
text = "topUp is callable only while status == Open and MUST NOT clear closureStartedAt."
required = true

[[requirement]]
id = "MPP-d0a49deec1"
doc = "specs/methods/solana/draft-solana-session-00.md"
text = "if feePayer is true, the fee payer MUST equal feePayerKey;"
required = true

[[requirement]]
id = "MPP-d142f89f1c"
doc = "specs/methods/solana/draft-solana-session-00.md"
text = "Servers MUST reject POST /channel/open payloads with depositAmount < minimumDeposit."
required = true

[[requirement]]
id = "MPP-d235eadc2e"
doc = "specs/methods/solana/draft-solana-session-00.md"
text = "The server MUST obtain it from the selected network, and the client MUST use it as the transaction message's recent blockhash."
required = true

[[requirement]]
id = "MPP-d26228ea73"
doc = "specs/methods/solana/draft-solana-session-00.md"
text = "| cumulativeAmount | string | REQUIRED | Total authorized spend (base units) |"
required = true

[[requirement]]
id = "MPP-d5da84fe70"
doc = "specs/methods/solana/draft-solana-session-00.md"
text = "When true, feePayerKey MUST also be present."
required = true

[[requirement]]
id = "MPP-d7767fee2b"
doc = "specs/methods/solana/draft-solana-session-00.md"
text = "| signature | string | REQUIRED | Base58 encoding of the 64-byte Ed25519 signature |"
required = true

[[requirement]]
id = "MPP-dfaa074bfa"
doc = "specs/methods/solana/draft-solana-session-00.md"
text = "| transaction | string | REQUIRED | Base64-encoded signed topUp transaction |"
required = true

[[requirement]]
id = "MPP-e436a4d7d5"
doc = "specs/methods/solana/draft-solana-session-00.md"
text = "A client-selected value MUST exactly match an offered value."
required = true

[[requirement]]
id = "MPP-e4dc36f3bd"
doc = "specs/methods/solana/draft-solana-session-00.md"
text = "| deposit | u64 | Initial deposit in base units; MUST be non-zero |"
required = true

[[requirement]]
id = "MPP-ea7a6777e6"
doc = "specs/methods/solana/draft-solana-session-00.md"
text = "When a server rejects a client-selected idleTimeoutSeconds that was not offered in the challenge, it MUST use the verification-failed problem type."
required = true

[[requirement]]
id = "MPP-ebbc4c1186"
doc = "specs/methods/solana/draft-solana-session-00.md"
text = "open MUST reject an authorizedSigner that is not a curve point, since a non-curve value could never produce a verifiable voucher signature."
required = true

[[requirement]]
id = "MPP-ec0236515c"
doc = "specs/methods/solana/draft-solana-session-00.md"
text = "| depositAmount | string | REQUIRED | Initial deposit in base units; MUST equal the decoded open deposit and satisfy depositAmount >= minimumDeposit (when the challenge sets one) |"
required = true

[[requirement]]
id = "MPP-ecdf5de619"
doc = "specs/methods/solana/draft-solana-session-00.md"
text = "Clients MUST verify this matches their expected program for that cluster before depositing funds."
required = true

[[requirement]]
id = "MPP-eebad15185"
doc = "specs/methods/solana/draft-solana-session-00.md"
text = "Verifiers that read the open accounts by fixed index MUST account for the rentPayer account at index 1 (payer=0, rentPayer=1, payee=2, mint=3, authorizedSigner=4, channel=5, with every account after payer shifted by +1) and MUST verify that accounts[1] equals the operator / fee-payer key."
required = true

[[requirement]]
id = "MPP-f8ce7faac8"
doc = "specs/methods/solana/draft-solana-session-00.md"
text = "| payer | string | REQUIRED | Base58 Ed25519 public key that produced the proof |"
required = true

[[requirement]]
id = "MPP-ff8313704f"
doc = "specs/methods/solana/draft-solana-session-00.md"
text = "Servers MUST reject new voucher acceptance on channels with a pending forced close unless the voucher is being used only to drive settleAndSeal."
required = true

[[requirement]]
id = "MPP-ff870e0a38"
doc = "specs/methods/solana/draft-solana-session-00.md"
text = "Clients SHOULD set openSlot to the challenge's methodDetails.recentSlot and MUST use the challenged recentBlockhash in the transaction."
required = true

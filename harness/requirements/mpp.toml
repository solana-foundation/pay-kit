repo = "mpp-specs"
commit = "782abaeb651164d78d8a87ca2646d28251968326"
files = [
  "specs/core/*",
  "specs/intents/draft-payment-intent-charge-*",
  "specs/methods/solana/draft-solana-charge-*",
  # Not in the original phase-1 scope list; added because the session vectors
  # need requirement ids to map to.
  "specs/methods/solana/draft-solana-session-*",
]

# Requirements the vectors cover. id = prefix + sha256(normalised text)[:10];
# the id changes with the text, which is how `pkc req-lint` detects drift.
# Cases map ids through `requirements` in the registry (rust/crates/conformance).
# `required = true`: `pkc req-lint` fails if no case maps the id any more.

[[requirement]]
id = "MPP-048617f9d7"
doc = "specs/methods/solana/draft-solana-charge-00.md"
text = "Servers MUST verify that the transaction contains only the expected instructions: transfer instruction(s) matching the challenge parameters, ATA creation (idempotent), and optionally compute budget instructions."
required = true

[[requirement]]
id = "MPP-197d674f50"
doc = "specs/methods/solana/draft-solana-charge-00.md"
text = "When the client is the transaction fee payer (feePayer is false or omitted), clients MAY include ATA creation instructions only for split recipients, and MUST include one for each split whose entry sets ataCreationRequired: true."
required = true

[[requirement]]
id = "MPP-1a2e7c737e"
doc = "specs/methods/solana/draft-solana-charge-00.md"
text = "Any unexpected instructions MUST cause rejection."
required = true

[[requirement]]
id = "MPP-4a77950278"
doc = "specs/methods/solana/draft-solana-charge-00.md"
text = "A single transfer instruction MUST NOT satisfy more than one required payment leg, even if multiple legs share the same recipient."
required = true

[[requirement]]
id = "MPP-4acddd43ce"
doc = "specs/methods/solana/draft-solana-session-00.md"

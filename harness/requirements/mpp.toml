repo = "mpp-specs"
commit = "782abaeb651164d78d8a87ca2646d28251968326"
files = [
  "specs/core/*",
  "specs/intents/draft-payment-intent-charge-*",
  "specs/intents/draft-payment-intent-subscription-*",
  "specs/methods/solana/draft-solana-charge-*",
  # Not in the original phase-1 scope list; added because the session vectors
  # need requirement ids to map to.
  "specs/methods/solana/draft-solana-session-*",
]

# Requirements the vectors cover. id = prefix + sha256(normalised text)[:10];
# the id changes with the text, which is how `pkc req-lint` detects drift.
# Cases map ids through `requirements` in the registry (rust/crates/conformance).
# `required = true`: `pkc req-lint` fails if no case maps the id any more.

[[requirement]]

doc = "specs/schemes/upto/scheme_upto_svm.md"
text = "MUST use only discriminator 2 (SetComputeUnitLimit, exactly 5 data bytes) or discriminator 3 (SetComputeUnitPrice, exactly 9 data bytes);"
required = true

[[requirement]]

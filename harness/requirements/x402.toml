required = true

[[requirement]]
id = "X402-233dcf8a3e"
doc = "specs/schemes/upto/scheme_upto_svm.md"
text = "MUST set a compute-unit price no greater than 5000000 microlamports per compute unit (5 lamports per compute unit)."
required = true

[[requirement]]
id = "X402-2cb22aa0de"
doc = "specs/schemes/upto/scheme_upto_svm.md"
text = "The channel distribution for upto MUST NOT assign any portion of the settled amount away from payTo."
required = true

[[requirement]]
id = "X402-3b5914a7c5"
doc = "specs/schemes/upto/scheme_upto_svm.md"
text = "The verifier MUST enforce the Phase 3 openTransaction acceptance policy so the client-signed transaction cannot debit feePayer beyond fees and the intended channel/escrow rent."
required = true

[[requirement]]
id = "X402-443a167ea1"
doc = "specs/schemes/upto/scheme_upto_svm.md"
text = "A sponsor MAY apply a stricter local policy for compute-unit limit, compute-unit price, and required-signature count (operator-configurable caps), but MUST NOT admit a compute-unit limit above 400000 or a compute-unit price above 5000000 microlamports."
required = true

[[requirement]]
id = "X402-4504985ded"
doc = "specs/schemes/upto/scheme_upto.md"
text = "The authorization MUST cryptographically bind the recipient address."
required = true

[[requirement]]
id = "X402-4c364688fc"
doc = "specs/schemes/upto/scheme_upto_svm.md"
text = "type is per-settle and not part of the client authorization; presence on the client payload MUST fail with invalid_upto_svm_payload_type."
required = true


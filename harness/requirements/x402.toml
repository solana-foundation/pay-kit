required = true

[[requirement]]
id = "X402-7cd3ca69a6"
doc = "specs/schemes/upto/scheme_upto_svm.md"
text = "A sponsor MAY apply a stricter local policy, including rejecting all optional instructions, but MUST NOT admit instructions outside this allowlist or relax the absolute compute-budget ceilings above."
required = true

[[requirement]]
id = "X402-865b05c15d"
doc = "specs/schemes/upto/scheme_upto_svm.md"

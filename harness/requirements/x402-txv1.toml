# SVM transaction-version negotiation (x402-foundation/x402 PR 3473, merged,
# with the TransactionConfigMask wording from PR 3474), pinned at the
# solana-foundation/x402 branch feat/svm-client-transaction-v1 that carries
# it alongside the client-built version-1 implementation. id = "X402TX-" + sha256(normalised text)[:10]. `required = true`:
# `pkc req-lint` fails if no case maps the id.

[[requirement]]
id = "X402TX-703c03cfb5"
doc = "specs/schemes/upto/scheme_upto_svm.md"
text = "In a version-1 transaction the same caps apply to the message config values instead (see [Transaction versions](#transaction-versions)): computeUnitLimit (bit 2) MUST be set and MUST NOT exceed 400000, loadedAccountsDataSizeLimit (bit 3) MUST be set, and priorityFee (bits 0 and 1, total lamports) MUST satisfy priorityFee 1000000 <= 5000000 computeUnitLimit, evaluated without overflow."
required = true

[[requirement]]
id = "X402TX-125d312b26"
doc = "specs/schemes/upto/scheme_upto_svm.md"
text = "A version-1 transaction carries its compute budget in the message config and MUST NOT contain this prefix."
required = true

[[requirement]]
id = "X402TX-2909c4b4ec"
doc = "specs/schemes/exact/scheme_exact_svm.md"
text = "It MUST fail with unsupported_transaction_version when the intersection is empty."
required = true

[[requirement]]
id = "X402TX-4de59a1f27"
doc = "specs/schemes/upto/scheme_upto_svm.md"
text = "The message version MUST be one advertised in extra.transactionVersions (0 when the field is absent; see [Transaction versions](#transaction-versions)), and the message MUST NOT contain Address Lookup Table lookups."
required = true

[[requirement]]
id = "X402TX-5267172b18"
doc = "specs/schemes/upto/scheme_upto_svm.md"
text = "The facilitator MUST reject a message whose version is outside the set it accepts, before inspecting any instruction, with unsupported_transaction_version."
required = true

[[requirement]]
id = "X402TX-61c735c7a9"
doc = "specs/schemes/exact/scheme_exact_svm.md"
text = "The client MUST intersect the advertised versions ([0] when the field is absent) with the versions it and its signer support, then build the highest version in that intersection."
required = true

[[requirement]]
id = "X402TX-f9bcc1a14a"
doc = "specs/schemes/exact/scheme_exact_svm.md"
text = "(The cost model still reserves 32 KiB of loaded account data for scheduling, but the transaction's own budget is 0.) A transaction that leaves bit 2 or bit 3 unset therefore cannot execute its instructions, so a client-built version-1 transaction MUST set both."
required = true

[[requirement]]
id = "X402TX-77742f428c"
doc = "specs/schemes/exact/scheme_exact_svm.md"
text = "They are never advertised in extra.transactionVersions and clients MUST NOT build them."
required = true

[[requirement]]
id = "X402TX-915632f040"
doc = "specs/schemes/exact/scheme_exact_svm.md"
text = "A version-1 transaction that contains a Compute Budget instruction MUST be rejected (an x402 sponsor rule; the runtime treats such instructions as no-ops)."
required = true

[[requirement]]
id = "X402TX-d444d01b9e"
doc = "specs/schemes/upto/scheme_upto_svm.md"
text = "Its message version MUST be one advertised in extra.transactionVersions (see [Transaction versions](#transaction-versions)). |"
required = true

[[requirement]]
id = "X402TX-dc7b0f3305"
doc = "specs/schemes/exact/scheme_exact_svm.md"
text = "A legacy or version-0 transaction MUST NOT exceed 1232 serialized bytes; a version-1 transaction MUST NOT exceed 4096 serialized bytes."
required = true

[[requirement]]
id = "X402TX-4750df8921"
doc = "specs/schemes/batch-settlement/scheme_batch_settlement_svm.md"
text = "Its message version MUST be one advertised in extra.transactionVersions. |"
required = true

[[requirement]]
id = "X402TX-f39a33ff74"
doc = "specs/schemes/batch-settlement/scheme_batch_settlement_svm.md"
text = "The facilitator advertises the versions it accepts as extra.transactionVersions in /supported, and the server MUST copy that value into PaymentRequirements.extra.transactionVersions."
required = true

[[requirement]]
id = "X402TX-10b3fe2ef3"
doc = "specs/schemes/exact/scheme_exact_svm.md"
text = "Its message version MUST be one the requirements advertise in extra.transactionVersions, or version 0 when that field is absent (see §1.5)."
required = true

[[requirement]]
id = "X402TX-24efe57db3"
doc = "specs/schemes/exact/scheme_exact_svm.md"
text = "The sponsor MUST reject a message whose version is outside the set it accepts, before inspecting any instruction, with unsupported_transaction_version."
required = true

[[requirement]]
id = "X402TX-655bb4a79a"
doc = "specs/schemes/exact/scheme_exact_svm.md"
text = "The legacy/version-0 Compute Budget price and the version-1 total priority fee MUST each be no greater than maxPriorityFeeMicroLamports (default 5 lamports/CU) on this path, using the normalization in §1.5 for version 1."
required = true

[[requirement]]
id = "X402TX-516a2d7b57"
doc = "specs/schemes/exact/scheme_exact_svm.md"
text = "A matching transfer MAY exceed PaymentRequirements.amount (overpayment is tolerated to accommodate smart wallets with internal fee rounding); it MUST NOT be less."
required = true

[[requirement]]
id = "X402TX-9b240d95a0"
doc = "specs/schemes/exact/scheme_exact_svm.md"
text = "The transaction MUST NOT require any signatures beyond the client and the sponsor (feePayer)."
required = true

[[requirement]]
id = "X402TX-bc031b7add"
doc = "specs/schemes/exact/scheme_exact_svm.md"
text = "The fee payer / sponsor MUST NOT be the authority on any observed transfer (self-spend protection)."
required = true

[[requirement]]
id = "X402TX-4c2fd60e66"
doc = "specs/schemes/exact/scheme_exact_svm.md"
text = "For a single-payee charge, a version-1 transaction MUST contain 1 to 5 instructions in this order:"
required = true

[[requirement]]
id = "X402TX-dd5384e0fe"
doc = "specs/schemes/exact/scheme_exact_svm.md"
text = "Fee payer isolation (§2.1.1): the fee payer MUST NOT appear in any instruction's accounts or as a program ID, after ALT resolution (§2.1.2)."
required = true

[[requirement]]
id = "X402TX-997feeb51d"
doc = "specs/schemes/exact/scheme_exact_svm.md"
text = "In a version-1 transaction the same caps apply to the message config values instead (§1.5): computeUnitLimit (bit 2) MUST be set and MUST NOT exceed the configured maximum, loadedAccountsDataSizeLimit (bit 3) MUST be set, and priorityFee (bits 0 and 1, total lamports) MUST satisfy priorityFee 1000000 <= capMicroLamports computeUnitLimit, where capMicroLamports is the price cap of the accepting path, evaluated without overflow as specified in §1.5."
required = true

[[requirement]]
id = "X402TX-ee90546220"
doc = "specs/schemes/exact/scheme_exact_svm.md"
text = "Across all top-level instructions and the full CPI trace, exactly one transfer MUST match the requirements (correct mint, correct destination ATA, amount >= required)."
required = true

[[requirement]]
id = "X402TX-f9c2b66234"
doc = "specs/schemes/exact/scheme_exact_svm.md"
text = "Match exactly one transfer (§1.4): across top-level and inner instructions, exactly one TransferChecked MUST match the required mint, destination ATA (derived for both token programs), and amount (>= required)."
required = true

[[requirement]]
id = "X402TX-4cd70365fd"
doc = "specs/schemes/exact/scheme_exact_svm.md"
text = "As an x402 sponsor rule, a client-built version-1 transaction MUST NOT contain them, and the sponsor MUST reject one that does."
required = true

[[requirement]]
id = "X402TX-74fb884aa9"
doc = "specs/schemes/exact/scheme_exact_svm.md"
text = "The sponsor MUST evaluate both sides of the inequality with arbitrary-precision integers (or at least 128-bit unsigned integers), so that an oversized priorityFee cannot wrap and pass the check."
required = true

[[requirement]]
id = "X402TX-927d17b62e"
doc = "specs/schemes/exact/scheme_exact_svm.md"
text = "A client or server MUST treat a field containing any non-integer entry (a string, null, or \"legacy\") or any integer other than 0 or 1 as invalid and fail closed with unsupported_transaction_version."
required = true

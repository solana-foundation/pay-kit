[package]
name = "solana-pay-core"
version = "0.1.0"
edition = "2021"
description = "Shared Solana primitives for the pay-kit crates (MPP + x402)"
license = "MIT"
repository = "https://github.com/solana-foundation/pay-kit"

[features]
# Background batched settlement worker (tokio actor): mpsc accumulator, size +
# linger-timer flush, sign with the operator, broadcast, background confirm.
# Shared by the mpp session and x402 settlement paths.
worker = ["dep:tokio", "dep:solana-rpc-client", "dep:solana-signature", "dep:tracing", "dep:async-trait"]
# Test/demo harness for the worker (open real channels, fund via cheatcodes,
# drive + observe packing). Shared by the x402/mpp tests and the pay bench.
testkit = ["worker", "dep:reqwest"]
# Reusable OpenTelemetry init (console + OTLP traces/metrics). Shared by the
# pay-kit crates and pay's binaries so everything lands in one collector.
otel = [
    "dep:tracing",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-appender-tracing",
    "dep:opentelemetry-semantic-conventions",
    "dep:tracing-opentelemetry",
    "dep:tracing-subscriber",
]

[dependencies]
# Signing — solana-keychain with sdk-v3 (matches mpp/x402 pins)
solana-keychain = { git = "https://github.com/solana-foundation/solana-keychain", rev = "d788028edbe02a94ef5eee7585d0230ad771296e", default-features = false, features = ["memory", "sdk-v3"] }

# Force five8_core's `std` feature ON: it gates `impl Error for DecodeError`,
# which solana-keypair/solana-signature rely on. Without it, building this crate
# in isolation (not via whole-workspace feature unification) fails to compile.
five8_core = { version = "=0.1.2", features = ["std"] }

# Solana — atomic crates only
solana-hash = { version = "3.1", default-features = false }
solana-instruction = { version = "3.1", default-features = false }
solana-message = { version = "3", default-features = false }
solana-pubkey = { version = "3.0", default-features = false }
solana-transaction = { version = "3", default-features = false }
solana-address = { version = "2", features = ["borsh", "curve25519"] }

# Settlement worker (feature `worker`) — optional.
tokio = { version = "1", features = ["rt", "sync", "time", "macros"], optional = true }
solana-rpc-client = { version = "4", default-features = false, optional = true }
solana-signature = { version = "3", default-features = false, optional = true }
tracing = { version = "0.1", optional = true }
async-trait = { version = "0.1", optional = true }

# Payment-channels program client (generated)
payment_channels_client = { package = "payment-channels-client", path = "../programs/payment-channels" }

# Randomness (channel salt)
getrandom = "0.3"

# Serialization / hashing
borsh = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
bs58 = "0.5"
base64 = "0.22"
bincode = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Voucher signature verification
ed25519-dalek = { version = "2", default-features = false, features = ["alloc"] }

# Errors
thiserror = "2"

# Test/demo harness (feature `testkit`) — surfnet cheatcode HTTP.
reqwest = { version = "0.12", features = ["json"], optional = true }

# OpenTelemetry (feature `otel`). Versions match the pay workspace so the
# collector view is consistent across repos.
opentelemetry = { version = "0.31", optional = true }
opentelemetry_sdk = { version = "0.31", features = ["logs"], optional = true }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "metrics", "logs"], optional = true }
opentelemetry-appender-tracing = { version = "0.31", optional = true }
opentelemetry-semantic-conventions = { version = "0.31", optional = true }
tracing-opentelemetry = { version = "0.32", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

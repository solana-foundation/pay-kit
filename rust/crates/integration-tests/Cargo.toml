[package]
name = "paykit-integration-tests"
version = "0.1.0"
edition = "2021"
description = "On-chain (surfpool/litesvm) integration tests for solana-pay-kit (not published)"
license = "MIT"
publish = false

# This crate holds only integration tests; no library/binary surface. Keeping
# the surfpool (git) + litesvm (patched) test deps out of the published
# `solana-pay-kit` crate is what lets `cargo publish` resolve cleanly.
[lib]
path = "src/lib.rs"

[features]
# Mirror the kit features the tests gate on, forwarding to solana-pay-kit.
testkit = ["solana-pay-kit/testkit"]
otel = ["solana-pay-kit/otel"]
confidential = ["solana-pay-kit/confidential"]
worker = ["solana-pay-kit/worker"]

[dependencies]
solana-pay-kit = { path = "../kit", features = ["mpp", "x402", "server", "client"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
serial_test = "3"
serde_json = "1"
bytemuck = "1.25"
spl-record = { version = "0.4.0", features = ["no-entrypoint"] }
surfpool-sdk = { git = "https://github.com/solana-foundation/surfpool", rev = "30242a4fe3b87557f3d6f1629f548e2515718242" }
# litesvm 0.16 is the first release that executes Transaction V1 and reads
# the compute budget from its message config.
litesvm = "0.16"
# Atomic solana crates the integration tests import directly.
solana-address = { version = "2", features = ["borsh", "curve25519"] }
solana-instruction = { version = "3.1", default-features = false }
solana-message = { version = "~4.4", default-features = false }
solana-pubkey = { version = "3.0", default-features = false }
solana-signature = { version = "3.1", default-features = false, features = ["default", "verify"] }
solana-system-interface = { version = "2.0", default-features = false }
solana-transaction = { version = "~4.1", default-features = false }
solana-rpc-client = { version = "4.1", default-features = false }
# Confidential-transfer integration test (gated `#![cfg(feature = "confidential")]`).
solana-zk-sdk = "7.0.1"
solana-zk-elgamal-proof-interface = "0.1.2"
spl-token-2022 = { version = "=11.0.0", default-features = false, features = ["zk-ops"] }
spl-token-confidential-transfer-proof-extraction = "0.6"
solana-zk-sdk-pod = "0.1.1"
spl-associated-token-account = { version = "8.0.0", features = ["no-entrypoint"] }

[[test]]
name = "charge_integration"
path = "tests/charge_integration.rs"

[[test]]
name = "settlement_onchain"
path = "tests/settlement_onchain.rs"
required-features = ["testkit"]

[[test]]
name = "confidential_integration"
path = "tests/confidential_integration.rs"
required-features = ["confidential", "worker"]

[package]
name = "solana-pay-kit"
version = "0.1.0"
edition = "2021"
description = "Solana payment SDK: MPP + x402 unified behind feature flags"
license = "MIT"
repository = "https://github.com/solana-foundation/pay-kit"
# The SDK guide lives at the workspace README (rust/README.md); reuse it as the
# published crate README so crates.io renders the same guide.
readme = "../../README.md"

[features]
default = ["mpp", "x402"]
mpp = ["dep:solana-mpp"]
x402 = ["dep:solana-x402"]
server = ["solana-mpp?/server", "solana-x402?/server"]
# Client-side selection (kit::select) needs serde_json to decode MPP method
# details; pull it in here so subset builds without `client` don't pay for it.
client = ["solana-mpp?/client", "solana-x402?/client", "dep:serde_json"]
# The unified axum gate dispatches both protocols, so it needs both servers.
axum = ["mpp", "x402", "server", "solana-mpp?/axum", "dep:axum", "dep:tracing"]
gcp_kms = ["solana-mpp?/gcp_kms"]
# Passthroughs so umbrella consumers can enable the mpp sub-features they need.
confidential = ["solana-mpp?/confidential"]
settlement = ["solana-mpp?/settlement"]
otel = ["solana-mpp?/otel"]
testkit = ["solana-mpp?/testkit"]

[dependencies]
solana-mpp = { path = "../mpp", optional = true }
solana-x402 = { path = "../x402", optional = true }
axum = { version = "0.8", optional = true, default-features = false }
tracing = { version = "0.1", optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
serde_json = "1"
ed25519-dalek = "2"

[[example]]
name = "axum_quickstart"
required-features = ["axum"]

[[example]]
name = "axum_upto"
required-features = ["axum"]

[[example]]
name = "axum_batch"
required-features = ["axum"]

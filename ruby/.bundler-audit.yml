# Documented bundler-audit exceptions. Each entry needs a reason and a removal
# trigger (constitution exception discipline).
#
# CVE-2026-38969 — WEBrick (<= 1.9.2) re-parses trailers. webrick is declared in
# solana-pay-kit.gemspec as ONE of the available Rack server backends (alongside
# puma, which is the recommended production server); the SDK itself never
# `require`s "webrick" directly. No patched webrick (> 1.9.2) has shipped yet, so
# this is an accepted, tracked risk. REMOVE this entry and bump the lockfile once
# a fixed webrick is released; if webrick is not actually needed as a production
# backend, drop it from the gemspec runtime deps instead (puma covers serving).
ignore:
  - CVE-2026-38969

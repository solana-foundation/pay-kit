name: Build pkc
description: >-
  Build the pay-kit conformance driver (`pkc`, rust/crates/conformance) with a
  shared cargo cache and put it on PATH. `features: interop` links surfpool for
  `pkc run --tier interop` (and builds the Rust harness bins in the same
  target directory, so they share the cached dependencies).

inputs:
  features:
    description: Cargo features for pkc (`interop` for the interop tier).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
    # One cache per (OS, feature set), shared by every job that builds pkc.
    # rust/Cargo.lock is not committed, so rust-cache keys on the manifests
    # and rotates the cache when they change (a fixed actions/cache key
    # never updates once written).
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: rust
        shared-key: pkc-${{ inputs.features || 'offline' }}
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - name: Build pkc
      shell: bash
      working-directory: rust
      env:
        FEATURES: ${{ inputs.features }}
      run: |
        if [ -n "$FEATURES" ]; then
          cargo build -q -p paykit-conformance --bin pkc --features "$FEATURES"
        else
          cargo build -q -p paykit-conformance --bin pkc
        fi
        mkdir -p "$RUNNER_TEMP/pkc-bin"
        ln -sf "$GITHUB_WORKSPACE/rust/target/debug/pkc" "$RUNNER_TEMP/pkc-bin/pkc"
        echo "$RUNNER_TEMP/pkc-bin" >> "$GITHUB_PATH"

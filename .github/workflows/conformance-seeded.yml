name: Conformance (seeded, nightly)

# Fill the vector corpus with a fresh mutation seed (`pkc fill --seed`: other
# memo nonces and mutation magnitudes, same verdicts) and run every SDK against
# it. A testee that memorised the committed bytes passes the committed corpus
# and fails here. Reported, never gating: the job always succeeds and the
# results are uploaded (DESIGN.md §6.5, PLAN phase 2b task 8). Swift and
# Kotlin need their own runners (macOS, JVM) and run only in their PR legs.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: "Mutation seed (default: the run number)"
        required: false

permissions:
  contents: read

jobs:
  seeded:
    name: Seeded offline conformance (reported, not gating)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-harness
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ruby
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - name: Install SDK dependencies
        run: |
          (cd python && uv sync --extra dev)
          (cd php && composer install --no-interaction --no-progress)
          sudo apt-get update
          sudo apt-get install -y luajit libluajit-5.1-dev luarocks libsodium-dev libssl-dev
          cd lua && mkdir -p lua_modules
          for rock in luasocket luasodium lua-resty-openssl lua-cjson; do
            luarocks --lua-version=5.1 install --tree lua_modules "$rock"
          done
          luarocks --lua-version=5.1 install --tree lua_modules luasec OPENSSL_DIR=/usr
      - uses: ./.github/actions/setup-pkc
        with:
          cache-key: pkc-seeded
      - name: Run every SDK against a seeded corpus
        continue-on-error: true
        env:
          SEED: ${{ inputs.seed || github.run_number }}
        run: pkc run --sdk typescript,rust,go,python,ruby,php,lua --tier offline --seed "$SEED"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: seeded-conformance-results
          path: harness/results/
          if-no-files-found: ignore

name: MPP charge matrix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mpp-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Validate and plan charge coverage
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      build_matrix: ${{ steps.matrix.outputs.build_matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: harness/pnpm-lock.yaml
      - name: Install planner dependencies
        working-directory: harness
        run: pnpm install --frozen-lockfile
      # No SDK builds or language toolchains before the cheap coverage checks.
      - name: Test matrix coverage
        working-directory: harness
        run: >-
          pnpm exec vitest run
          test/ci-matrix.test.ts test/artifacts.test.ts test/build-adapters.test.ts
          test/conformance-runners.test.ts test/adapter-identity.test.ts
          test/replay.test.ts test/guards.test.ts test/canonical-codes.test.ts
      - name: Emit exact shards
        id: matrix
        working-directory: harness
        run: pnpm exec tsx emit-ci-matrix.ts

  build-node:
    name: Build portable MPP SDK once
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - name: Install TypeScript workspace
        working-directory: typescript
        run: pnpm install --frozen-lockfile
      - name: Build @solana/mpp
        working-directory: typescript
        run: pnpm --filter @solana/mpp build
      - name: Install harness against built MPP SDK
        working-directory: harness
        run: pnpm install --frozen-lockfile
      - name: Test charge client GC regression
        working-directory: harness
        run: pnpm exec vitest run test/charge-client-gc.test.ts
      - uses: actions/upload-artifact@v7
        with:
          name: mpp-dist
          path: typescript/packages/mpp/dist
          if-no-files-found: error

  build-native:
    name: "Build adapters once (${{ matrix.platform }})"
    needs: [plan, build-node]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        if: contains(matrix.toolchains, 'rust')
      - uses: actions/cache@v5
        if: contains(matrix.toolchains, 'rust')
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-${{ runner.arch }}-mpp-adapters-${{ hashFiles('rust/**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-mpp-adapters-
      - uses: actions/setup-go@v6
        if: contains(matrix.toolchains, 'go')
        with:
          go-version-file: go/go.mod
          cache-dependency-path: |
            go/go.sum
            harness/go-client/go.sum
            harness/go-server/go.sum
      - uses: actions/setup-java@v5
        if: contains(matrix.toolchains, 'kotlin')
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        if: contains(matrix.toolchains, 'kotlin')
        with:
          gradle-version: "9.5.1"
      # Swift uses the hosted macOS toolchain, matching swift.yml.
      - uses: ./.github/actions/setup-harness-leg
      - name: Assert build platform
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
        run: node -e 'if (`${process.platform}-${process.arch}` !== process.env.EXPECTED_PLATFORM) throw new Error("Native build runner platform mismatch")'
      - name: Build selected adapters
        working-directory: harness
        env:
          BUILD_CLIENTS: ${{ matrix.clients }}
          BUILD_SERVERS: ${{ matrix.servers }}
        run: node --import tsx build-adapters.ts --clients "$BUILD_CLIENTS" --servers "$BUILD_SERVERS" --out "$RUNNER_TEMP/native"
      # Tar retains executable modes and symlinks, unlike a raw artifact upload.
      - name: Archive native adapters
        run: tar -czf "$RUNNER_TEMP/adapters.tar.gz" -C "$RUNNER_TEMP/native" .
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.nativeArtifact }}
          path: ${{ runner.temp }}/adapters.tar.gz
          if-no-files-found: error

  charge:
    name: "${{ matrix.id }} (${{ matrix.caseCount }} cases)"
    needs: [plan, build-node, build-native]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        if: contains(matrix.toolchains, 'kotlin')
        with:
          distribution: temurin
          java-version: "17"
          java-package: jre
      - uses: actions/setup-python@v5
        if: contains(matrix.toolchains, 'python')
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        if: contains(matrix.toolchains, 'python')
      - uses: ruby/setup-ruby@v1
        if: contains(matrix.toolchains, 'ruby')
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ruby
      - uses: shivammathur/setup-php@v2
        if: contains(matrix.toolchains, 'php')
        with:
          php-version: "8.3"
          extensions: sodium
      # Interpreted SDK dependencies remain per leg; they are not compiled adapters.
      - name: Install Lua native dependencies (Linux)
        if: contains(matrix.toolchains, 'lua') && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit libluajit-5.1-dev luarocks libsodium-dev libssl-dev
      - name: Install Lua native dependencies (macOS)
        if: contains(matrix.toolchains, 'lua') && runner.os == 'macOS'
        run: brew install luajit luarocks libsodium openssl@3
      - name: Install Lua runtime rocks
        if: contains(matrix.toolchains, 'lua')
        working-directory: lua
        shell: bash
        run: |
          set -euo pipefail
          args=()
          ssl=/usr
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            args+=(--lua-dir="$(brew --prefix luajit)")
            ssl="$(brew --prefix openssl@3)"
            export PKG_CONFIG_PATH="$(brew --prefix libsodium)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
            export CPATH="$(brew --prefix libsodium)/include:${CPATH:-}"
            export LIBRARY_PATH="$(brew --prefix libsodium)/lib:${LIBRARY_PATH:-}"
          fi
          for rock in luasocket luasodium luasec lua-resty-openssl lua-cjson; do
            luarocks --lua-version=5.1 "${args[@]}" install --tree lua_modules "$rock" OPENSSL_DIR="$ssl"
          done
      - uses: ./.github/actions/setup-harness-leg
        with:
          native-artifact: ${{ matrix.nativeArtifact }}
      - name: Assert runtime platform
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
        run: node -e 'if (`${process.platform}-${process.arch}` !== process.env.EXPECTED_PLATFORM) throw new Error("Native runtime runner platform mismatch")'
      - name: Install Python SDK
        if: contains(matrix.toolchains, 'python')
        working-directory: python
        run: uv sync
      - name: Install PHP SDK
        if: contains(matrix.toolchains, 'php')
        working-directory: php
        run: composer install --no-interaction --no-progress
      - name: Run exact charge shard
        working-directory: harness
        env: ${{ matrix.env }}
        run: pnpm exec vitest run test/e2e.test.ts --testTimeout 180000

  complete:
    name: MPP charge coverage
    if: always()
    needs: [plan, build-node, build-native, charge]
    runs-on: ubuntu-latest
    steps:
      - name: Require every planned shard to pass
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          NODE_RESULT: ${{ needs.build-node.result }}
          NATIVE_RESULT: ${{ needs.build-native.result }}
          CHARGE_RESULT: ${{ needs.charge.result }}
        run: |
          test "$PLAN_RESULT" = success
          test "$NODE_RESULT" = success
          test "$NATIVE_RESULT" = success
          test "$CHARGE_RESULT" = success

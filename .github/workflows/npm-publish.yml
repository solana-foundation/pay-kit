name: Publish to npm (TypeScript SDK)

on:
  workflow_dispatch:
    inputs:
      package:
        # @solana/pay-kit is the go-forward package. @solana/mpp is deprecated
        # and retained here only for its final release; do not publish it after
        # that.
        description: 'Package to publish (mpp is deprecated, final release only)'
        required: true
        default: pay-kit
        type: choice
        options:
          - pay-kit
          - mpp
          - all
      publish-to-npm:
        description: 'Publish to npm registry'
        required: true
        default: true
        type: boolean
      create-github-release:
        description: 'Create GitHub release'
        required: true
        default: true
        type: boolean

# Least privilege at the workflow level: read-only. The release-gate fan-out
# (every SDK's test/build job, run via the reusable release-gate.yml) inherits
# this default and gets no write token. contents: write and id-token: write are
# granted explicitly on the individual publish jobs below, and nowhere else.
permissions:
  contents: read

# Prevent concurrent publishes
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # Guard the publish workflow's own hardening: fail early if the top-level
  # permissions ever regain a write grant or a tag/release step loses its
  # publish-success gate. This is the release-integrity self-check.
  guards:
    name: Publish workflow guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Assert least-privilege permissions and publish-success gating
        run: |
          scripts/check-publish-workflow-guards.sh \
            .github/workflows/npm-publish.yml \
            .github/workflows/pypi-publish.yml

  # Full release gate: core CI + cross-language harness + on-chain legs +
  # every SDK matrix (see release-gate.yml). Publishing must never gate on
  # a single workflow's view of the commit.
  gate:
    name: Release gate
    needs: [guards]
    uses: ./.github/workflows/release-gate.yml
    secrets: inherit

  # Deprecated: @solana/mpp is superseded by @solana/pay-kit. This job is kept
  # only to cut the final @solana/mpp release (which carries the #211 TOCTOU
  # fix); remove it once that release is out and `npm deprecate` has run.
  publish:
    name: Publish @solana/mpp (deprecated)
    runs-on: ubuntu-latest
    needs: [gate]
    if: ${{ github.event.inputs.package == 'mpp' || github.event.inputs.package == 'all' }}
    # Protected environment gate (add required reviewers in repo settings),
    # mirroring the pypi-publish job. Publishing uses npm OIDC trusted
    # publishing: id-token:write below plus NPM_CONFIG_PROVENANCE authenticates
    # via the OIDC exchange, so no NPM_TOKEN is stored. This requires a trusted
    # publisher configured for @solana/mpp on npmjs.org and npm CLI >= 11.5.
    environment: npm
    # Write scope lives only on the publish job: contents: write for the git
    # tag + GitHub Release, id-token: write for npm OIDC trusted publishing.
    permissions:
      contents: write
      id-token: write
    env:
      NPM_CONFIG_PROVENANCE: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          package_json_file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml

      - name: Install dependencies
        run: cd typescript && pnpm install --frozen-lockfile

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./typescript/packages/mpp/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"

      - name: Guard - refuse to republish an existing version
        if: ${{ github.event.inputs.publish-to-npm == 'true' }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if npm view "@solana/mpp@${VERSION}" version >/dev/null 2>&1; then
            echo "FAIL: @solana/mpp@${VERSION} is already published to npm; refusing to republish."
            exit 1
          fi
          echo "Version ${VERSION} is not yet on npm; proceeding."

      - name: Check if prerelease
        id: prerelease
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [[ "$VERSION" == *"-rc."* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "npm_tag=rc" >> $GITHUB_OUTPUT
            echo "Release-candidate version detected, using 'rc' npm tag"
          elif [[ "$VERSION" == *"-"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "npm_tag=beta" >> $GITHUB_OUTPUT
            echo "Pre-release version detected, using 'beta' npm tag"
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "npm_tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Build
        run: cd typescript && pnpm build

      - name: Pack tarball
        run: |
          mkdir -p .npm-pack
          # @solana/mpp is deprecated in favor of @solana/pay-kit, so ship the
          # package's own deprecation README rather than the root pay-kit one.
          pnpm --dir typescript/packages/mpp pack --pack-destination "$(pwd)/.npm-pack"
          TARBALL=$(find .npm-pack -maxdepth 1 -name '*.tgz' -print -quit)

          if [ -z "$TARBALL" ]; then
            echo "FAIL: no tarball produced in .npm-pack"
            ls -la .npm-pack/ || true
            exit 1
          fi

          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"
          echo ""
          echo "Packed tarball:"
          ls -la .npm-pack/

      - name: "Guard - Fail if tarball contains workspace: protocol"
        run: |
          tar -xzf "$TARBALL" package/package.json -O > /tmp/pkg.json

          if grep -q '"workspace:' /tmp/pkg.json; then
            echo "FAIL: ${TARBALL} contains workspace: dependencies!"
            grep '"workspace:' /tmp/pkg.json || true
            exit 1
          fi

          echo "All tarballs are clean (no workspace: dependencies)"

      - name: Guard - Fail if tarball missing dist/ artifacts
        run: |
          CONTENTS=$(tar -tzf "$TARBALL")

          if ! echo "$CONTENTS" | grep -q "package/dist/index.js"; then
            echo "FAIL: ${TARBALL} is missing dist/index.js!"
            echo "Contents:"
            echo "$CONTENTS" | head -30
            exit 1
          fi

          if ! echo "$CONTENTS" | grep -q "package/dist/index.d.ts"; then
            echo "FAIL: ${TARBALL} is missing dist/index.d.ts!"
            exit 1
          fi

          echo "dist/index.js and dist/index.d.ts present"

      - name: Publish to npm
        id: publish
        if: ${{ github.event.inputs.publish-to-npm == 'true' }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NPM_TAG="${{ steps.prerelease.outputs.npm_tag }}"

          if [ -f "$TARBALL" ]; then
            echo "Publishing ${TARBALL} with tag '${NPM_TAG}'..."
            npm publish "$TARBALL" --access public --tag "$NPM_TAG"
            echo "Published successfully"
          else
            echo "Tarball not found: ${TARBALL}"
            echo "Available tarballs:"
            ls -la .npm-pack/ || true
            exit 1
          fi

      # Tag + Release only after a real, successful publish. Gating on the input
      # alone let a dry run (publish-to-npm=false) tag and release a version that
      # was never published; requiring steps.publish.outcome == 'success' closes
      # that (the publish step is skipped on a dry run, so outcome != success).
      - name: Create and push tag
        if: ${{ steps.publish.outcome == 'success' && github.event.inputs.publish-to-npm == 'true' }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping"
          else
            git tag "$TAG"
            echo "Created tag $TAG"
          fi
          git push origin "$TAG" 2>/dev/null || echo "Tag already pushed"

      - name: Create GitHub Release
        if: ${{ steps.publish.outcome == 'success' && github.event.inputs.publish-to-npm == 'true' && github.event.inputs.create-github-release == 'true' }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tagName = `v${{ steps.version.outputs.version }}`;
            const version = `${{ steps.version.outputs.version }}`;
            const releaseName = `@solana/mpp v${version}`;
            const isPrerelease = '${{ steps.prerelease.outputs.is_prerelease }}' === 'true';

            const body = `## @solana/mpp v${version}

            > **Deprecated.** \`@solana/mpp\` is superseded by [\`@solana/pay-kit\`](https://www.npmjs.com/package/@solana/pay-kit). This is a final maintenance release; new work lands in \`@solana/pay-kit\`.

            ### Migrate

            \`\`\`bash
            pnpm remove @solana/mpp && pnpm add @solana/pay-kit
            \`\`\`

            [npm](https://www.npmjs.com/package/@solana/mpp/v/${version})
            `;

            // Check if release already exists
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tagName,
              });
              console.log(`Release ${tagName} already exists, skipping`);
              return;
            } catch (e) {
              if (e.status !== 404) throw e;
            }

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tagName,
              name: releaseName,
              body: body.trim(),
              draft: false,
              prerelease: isPrerelease,
            });

            console.log(`Created release: ${releaseName}`);

      - name: Publish summary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NPM_TAG="${{ steps.prerelease.outputs.npm_tag }}"

          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## Published

          **Version**: \`${VERSION}\`
          **Package**: \`@solana/mpp\`
          **Tag**: \`v${VERSION}\`
          **npm tag**: \`${NPM_TAG}\`

          EOF

          if [ "${{ github.event.inputs.publish-to-npm }}" == "true" ]; then
            echo "Published to npm: https://www.npmjs.com/package/%40solana%2Fmpp/v/${VERSION}" >> $GITHUB_STEP_SUMMARY
          else
            echo "Skipped npm publish (dry run)" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ github.event.inputs.create-github-release }}" == "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "GitHub release created: https://github.com/${{ github.repository }}/releases/tag/v${VERSION}" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Skipped GitHub release creation" >> $GITHUB_STEP_SUMMARY
          fi

  publish-pay-kit:
    name: Publish @solana/pay-kit
    runs-on: ubuntu-latest
    needs: [gate]
    if: ${{ github.event.inputs.package == 'pay-kit' || github.event.inputs.package == 'all' }}
    # Protected environment gate + npm OIDC trusted publishing (see the mpp
    # publish job). Requires a trusted publisher for @solana/pay-kit on npmjs.org.
    environment: npm
    # Write scope lives only on the publish job (see the mpp job above).
    permissions:
      contents: write
      id-token: write
    env:
      NPM_CONFIG_PROVENANCE: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          package_json_file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml

      # The vendored @x402 tarballs are committed under typescript/.x402-vendor,
      # so a plain frozen install resolves them — no submodule checkout needed.
      - name: Install dependencies
        run: cd typescript && pnpm install --frozen-lockfile

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./typescript/packages/pay-kit/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"

      - name: Guard - refuse to republish an existing version
        if: ${{ github.event.inputs.publish-to-npm == 'true' }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if npm view "@solana/pay-kit@${VERSION}" version >/dev/null 2>&1; then
            echo "FAIL: @solana/pay-kit@${VERSION} is already published to npm; refusing to republish."
            exit 1
          fi
          echo "Version ${VERSION} is not yet on npm; proceeding."

      - name: Check if prerelease
        id: prerelease
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [[ "$VERSION" == *"-rc."* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "npm_tag=rc" >> $GITHUB_OUTPUT
            echo "Release-candidate version detected, using 'rc' npm tag"
          elif [[ "$VERSION" == *"-"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "npm_tag=beta" >> $GITHUB_OUTPUT
            echo "Pre-release version detected, using 'beta' npm tag"
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "npm_tag=latest" >> $GITHUB_OUTPUT
          fi

      # Builds @solana/mpp (tsc) + @solana/pay-kit (tsup, which bundles the
      # vendored @x402/* + zod AND @solana/mpp into pay-kit's dist, so pay-kit
      # publishes standalone with no @solana/mpp dependency / publish ordering).
      - name: Build
        run: cd typescript && pnpm build

      - name: Pack tarball
        run: |
          mkdir -p .npm-pack
          cp README.md typescript/packages/pay-kit/README.md
          pnpm --dir typescript/packages/pay-kit pack --pack-destination "$(pwd)/.npm-pack"
          TARBALL=$(find .npm-pack -maxdepth 1 -name 'solana-pay-kit-*.tgz' -print -quit)

          if [ -z "$TARBALL" ]; then
            echo "FAIL: no pay-kit tarball produced in .npm-pack"
            ls -la .npm-pack/ || true
            exit 1
          fi

          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"
          echo ""
          echo "Packed tarball:"
          ls -la .npm-pack/
          rm -f typescript/packages/pay-kit/README.md

      - name: "Guard - Fail if published runtime deps are unresolvable"
        run: |
          tar -xzf "$TARBALL" package/package.json -O > /tmp/paykit-pkg.json
          node -e '
            const p = require("/tmp/paykit-pkg.json");
            const bad = [];
            for (const field of ["dependencies", "peerDependencies"]) {
              for (const [k, v] of Object.entries(p[field] || {})) {
                if (/^(workspace|file|link):/.test(String(v))) bad.push(field + "." + k + "=" + v);
              }
            }
            if (bad.length) {
              console.error("FAIL: published runtime deps reference local paths:\n" + bad.join("\n"));
              process.exit(1);
            }
            if (Object.keys(p.dependencies || {}).some(n => n.startsWith("@x402/"))) {
              console.error("FAIL: @x402/* leaked into dependencies (must be bundled)");
              process.exit(1);
            }
            const allDeps = { ...(p.dependencies || {}), ...(p.peerDependencies || {}) };
            if ("@solana/mpp" in allDeps) {
              console.error("FAIL: @solana/mpp leaked into deps/peerDeps (must be bundled via tsup noExternal so pay-kit publishes standalone)");
              process.exit(1);
            }
            console.log("Runtime deps clean (no workspace:/file:/link:, no @x402/*, no @solana/mpp)");
          '

      - name: Guard - Fail if tarball missing dist/ artifacts
        run: |
          CONTENTS=$(tar -tzf "$TARBALL")
          for f in package/dist/index.js package/dist/index.d.ts package/dist/client/index.js; do
            if ! echo "$CONTENTS" | grep -q "$f"; then
              echo "FAIL: ${TARBALL} is missing $f!"
              echo "$CONTENTS" | head -30
              exit 1
            fi
          done
          echo "dist artifacts present"

      - name: Publish to npm
        id: publish
        if: ${{ github.event.inputs.publish-to-npm == 'true' }}
        run: |
          NPM_TAG="${{ steps.prerelease.outputs.npm_tag }}"
          if [ -f "$TARBALL" ]; then
            echo "Publishing ${TARBALL} with tag '${NPM_TAG}'..."
            npm publish "$TARBALL" --access public --tag "$NPM_TAG"
            echo "Published successfully"
          else
            echo "Tarball not found: ${TARBALL}"
            ls -la .npm-pack/ || true
            exit 1
          fi

      # Tag + Release only after a real, successful publish (see the mpp job).
      - name: Create and push tag
        if: ${{ steps.publish.outcome == 'success' && github.event.inputs.publish-to-npm == 'true' }}
        run: |
          TAG="pay-kit-v${{ steps.version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping"
          else
            git tag "$TAG"
            echo "Created tag $TAG"
          fi
          git push origin "$TAG" 2>/dev/null || echo "Tag already pushed"

      - name: Create GitHub Release
        if: ${{ steps.publish.outcome == 'success' && github.event.inputs.publish-to-npm == 'true' && github.event.inputs.create-github-release == 'true' }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const version = `${{ steps.version.outputs.version }}`;
            const tagName = `pay-kit-v${version}`;
            const releaseName = `@solana/pay-kit v${version}`;
            const isPrerelease = '${{ steps.prerelease.outputs.is_prerelease }}' === 'true';

            const body = `## @solana/pay-kit v${version}

            ### Installation

            \`\`\`bash
            pnpm add @solana/pay-kit
            \`\`\`

            [npm](https://www.npmjs.com/package/@solana/pay-kit/v/${version})
            `;

            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tagName,
              });
              console.log(`Release ${tagName} already exists, skipping`);
              return;
            } catch (e) {
              if (e.status !== 404) throw e;
            }

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tagName,
              name: releaseName,
              body: body.trim(),
              draft: false,
              prerelease: isPrerelease,
            });

            console.log(`Created release: ${releaseName}`);

      - name: Publish summary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NPM_TAG="${{ steps.prerelease.outputs.npm_tag }}"

          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## Published

          **Version**: \`${VERSION}\`
          **Package**: \`@solana/pay-kit\`
          **Tag**: \`pay-kit-v${VERSION}\`
          **npm tag**: \`${NPM_TAG}\`

          EOF

          if [ "${{ github.event.inputs.publish-to-npm }}" == "true" ]; then
            echo "Published to npm: https://www.npmjs.com/package/%40solana%2Fpay-kit/v/${VERSION}" >> $GITHUB_STEP_SUMMARY
          else
            echo "Skipped npm publish (dry run)" >> $GITHUB_STEP_SUMMARY
          fi

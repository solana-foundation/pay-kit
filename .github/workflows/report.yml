name: Report

# Posts the coverage comment once both the TypeScript and the Rust workflow
# of a PR head have completed (whichever finishes second triggers the post).

on:
  workflow_run:
    workflows: [TypeScript, Rust]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

defaults:
  run:
    working-directory: .

jobs:
  report:
    name: coverage
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The two runs of this head commit; post only when both are done.
      - name: Find the TypeScript and Rust runs
        id: runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          run_of() {
            gh run list -R "$REPO" --commit "$SHA" --workflow "$1" --json databaseId,status \
              -q 'map(select(.status == "completed")) | .[0].databaseId // empty'
          }
          ts=$(run_of typescript.yml)
          rust=$(run_of rust.yml)
          echo "ts=$ts" >> "$GITHUB_OUTPUT"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          if [ -n "$ts" ] && [ -n "$rust" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/download-artifact@v7
        if: steps.runs.outputs.ready == 'true'
        with:
          name: ts-coverage
          path: ts-cov
          run-id: ${{ steps.runs.outputs.ts }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      - uses: actions/download-artifact@v7
        if: steps.runs.outputs.ready == 'true'
        with:
          name: rust-coverage
          path: rust-cov
          run-id: ${{ steps.runs.outputs.rust }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # Fetch the reusable action
      - uses: actions/checkout@v5
        if: steps.runs.outputs.ready == 'true'
        with:
          repository: solana-foundation/surfpool
          # Pinned to a commit, not a branch. This workflow broke because it
          # followed `feat/sdk`, which surfpool renamed to `feat/sdk-report`;
          # following the new branch would leave the same failure mode in place,
          # and a moving ref in another repository is also an unreviewed input to
          # our CI. e0204c21 is the head of `feat/sdk-report` as of 2026-09-05.
          # Bump deliberately when that branch advances.
          ref: e0204c21c59e225fab81075a91ffc8d9c0b20d02
          sparse-checkout: .github/actions
          path: _surfpool

      - name: Get PR number
        if: steps.runs.outputs.ready == 'true'
        id: pr
        run: |
          PR=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}" --jq '.pull_requests[0].number' 2>/dev/null || true)
          echo "number=$PR" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The surfpool HTML report helper was removed upstream in surfpool 1.4
      # (and charge_integration.rs, which hosted it, is retired), so the
      # comment carries coverage only.
      - name: Post test report
        if: steps.runs.outputs.ready == 'true' && steps.pr.outputs.number != ''
        uses: ./_surfpool/.github/actions/test-report
        with:
          ts-coverage-json: ts-cov/coverage-summary.json
          rust-coverage-json: rust-cov/coverage.json
          report-path: surfpool-report.html
          pages-path: pr/${{ steps.pr.outputs.number }}

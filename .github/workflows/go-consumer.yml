name: Go consumer guard

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "go/**"
  workflow_call:

jobs:
  consumer-guard:
    name: Downstream module consumer guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Verify downstream consumers resolve the pinned upstream solana-go
        working-directory: go
        env:
          GOCACHE: /tmp/go-build-cache
        run: ./scripts/check_module_consumer.sh

name: PR verification router

# GitHub path filters inspect only a bounded PR diff. Classify the complete
# three-dot diff ourselves so an unrecognized source change fails closed into
# the full SDK matrix instead of silently skipping a relevant verifier.
on:
  pull_request:

permissions:
  contents: read

jobs:
  classify:
    name: Classify verification surfaces
    runs-on: ubuntu-latest
    outputs:
      typescript: ${{ steps.select.outputs.typescript }}
      rust: ${{ steps.select.outputs.rust }}
      go: ${{ steps.select.outputs.go }}
      python: ${{ steps.select.outputs.python }}
      ruby: ${{ steps.select.outputs.ruby }}
      lua: ${{ steps.select.outputs.lua }}
      php: ${{ steps.select.outputs.php }}
      swift: ${{ steps.select.outputs.swift }}
      kotlin: ${{ steps.select.outputs.kotlin }}
      harness: ${{ steps.select.outputs.harness }}
      docs_only: ${{ steps.select.outputs.docs_only }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # The router and its tests live on the base branch. The synthetic
          # merge SHA contains both those files and the PR's source changes.
          ref: ${{ github.sha }}
          # A PR merge commit has both base and head parents. Preserve them so
          # the router can diff the checked-out base parent directly. The event
          # payload's base SHA can be stale when the base branch advances while
          # a PR run is queued.
          fetch-depth: 2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Test path classifier
        run: |
          node scripts/select-pr-workflows_test.mjs
          node scripts/verify-routed-sdk-gate_test.mjs
      - id: select
        name: Select SDK workflows
        run: |
          set -o pipefail
          if ! git rev-parse --verify HEAD^1 >/dev/null; then
            echo "::error::PR verification router requires a synthetic merge commit with a base parent"
            exit 1
          fi
          git diff --no-renames --name-only HEAD^1 HEAD | \
            node scripts/select-pr-workflows.mjs --github-output "$GITHUB_OUTPUT"

  go:
    needs: classify
    if: ${{ needs.classify.outputs.go == 'true' }}
    uses: ./.github/workflows/go.yml
    secrets: inherit

  core:
    needs: classify
    if: ${{ needs.classify.outputs.typescript == 'true' || needs.classify.outputs.rust == 'true' || needs.classify.outputs.harness == 'true' }}
    uses: ./.github/workflows/ci.yml
    with:
      run_typescript: ${{ needs.classify.outputs.typescript == 'true' }}
      run_rust: ${{ needs.classify.outputs.rust == 'true' }}
      run_harness: ${{ needs.classify.outputs.harness == 'true' }}
    secrets: inherit

  go_consumer:
    needs: classify
    if: ${{ needs.classify.outputs.go == 'true' }}
    uses: ./.github/workflows/go-consumer.yml
    secrets: inherit

  python:
    needs: classify
    if: ${{ needs.classify.outputs.python == 'true' }}
    uses: ./.github/workflows/python.yml
    secrets: inherit

  ruby:
    needs: classify
    if: ${{ needs.classify.outputs.ruby == 'true' }}
    uses: ./.github/workflows/ruby.yml
    secrets: inherit

  lua:
    needs: classify
    if: ${{ needs.classify.outputs.lua == 'true' }}
    uses: ./.github/workflows/lua.yml
    secrets: inherit

  php:
    needs: classify
    if: ${{ needs.classify.outputs.php == 'true' }}
    uses: ./.github/workflows/php.yml
    secrets: inherit

  swift:
    needs: classify
    if: ${{ needs.classify.outputs.swift == 'true' }}
    uses: ./.github/workflows/swift.yml
    secrets: inherit

  kotlin:
    needs: classify
    if: ${{ needs.classify.outputs.kotlin == 'true' }}
    uses: ./.github/workflows/kotlin.yml
    secrets: inherit

  harness:
    needs: classify
    if: ${{ needs.classify.outputs.harness == 'true' }}
    uses: ./.github/workflows/harness.yml
    secrets: inherit

  routed_sdk_gate:
    name: Routed SDK gate
    if: ${{ always() }}
    needs: [classify, core, go, go_consumer, python, ruby, lua, php, swift, kotlin, harness]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Require every selected workflow to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/verify-routed-sdk-gate.mjs

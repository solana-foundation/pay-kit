name: Swift

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  # Path filter: a PR that touches none of these skips the jobs below
  # (skipped jobs satisfy required checks); pushes and calls run them all.
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'swift/**'
              - '.github/**'

  test-swift:
    name: test
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run tests with coverage
        # The Swift package manifest lives at the repo root (so SPM can consume
        # this monorepo by URL); sources are under swift/.
        run: swift test --enable-code-coverage
      - name: Upload Swift coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swift-coverage
          path: .build/debug/codecov/
          if-no-files-found: ignore

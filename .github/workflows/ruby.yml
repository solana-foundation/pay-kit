name: Ruby

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  # Path filter: a PR that touches none of these skips the jobs below
  # (skipped jobs satisfy required checks); pushes and calls run them all.
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'ruby/**'
              - '.github/**'

  test-ruby:
    name: test
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ruby
      - name: Validate gemspec
        working-directory: ruby
        run: bundle exec ruby -e "Gem::Specification.load('solana-pay-kit.gemspec').validate"
      - name: Lint
        working-directory: ruby
        run: bundle exec standardrb
      - name: Audit dependencies
        working-directory: ruby
        run: bundle exec bundle-audit check --update
      - name: Run tests with coverage
        working-directory: ruby
        env:
          SURFPOOL_REPORT: "1"
        run: COVERAGE=1 bundle exec ruby -Itest test/run.rb
      - name: Upload Ruby coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ruby-coverage
          path: ruby/coverage/.resultset.json
      - name: Upload Ruby surfpool report data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surfpool-reports-ruby
          path: ruby/target/surfpool-reports/
          if-no-files-found: ignore

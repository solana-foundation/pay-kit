name: Ruby

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test-ruby:
    name: Ruby tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ruby
      - name: Validate gemspec
        working-directory: ruby
        run: bundle exec ruby -e "Gem::Specification.load('solana-pay-kit.gemspec').validate"
      - name: Lint
        working-directory: ruby
        run: bundle exec standardrb
      - name: Audit dependencies
        working-directory: ruby
        run: bundle exec bundle-audit check --update
      - name: Run tests with coverage
        working-directory: ruby
        env:
          SURFPOOL_REPORT: "1"
        run: COVERAGE=1 bundle exec ruby -Itest test/run.rb
      - name: Upload Ruby coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ruby-coverage
          path: ruby/coverage/.resultset.json
      - name: Upload Ruby surfpool report data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surfpool-reports-ruby
          path: ruby/target/surfpool-reports/
          if-no-files-found: ignore

  interop-pay-kit-server:
    name: "Interop: PayKit dual-protocol server"
    needs: test-ruby
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ruby
      - name: Install TypeScript workspace
        working-directory: typescript
        run: pnpm install --frozen-lockfile
      - name: Build TypeScript package
        working-directory: typescript
        run: pnpm --filter @solana/mpp build
      - name: Install interop harness
        working-directory: harness
        run: pnpm install --frozen-lockfile
      - name: Typecheck interop harness
        working-directory: harness
        run: pnpm typecheck
      # PayKit interop proof: drives the harness's MPP charge matrix
      # against the dual-protocol adapter binary. x402 cross-language
      # interop coverage is deferred to a follow-up; the harness's
      # ts-x402 and rust-x402 clients carry field-name asymmetries
      # against this server's spine output (amount vs maxAmountRequired,
      # payload.transaction wire shape) that need a cross-SDK audit
      # beyond this PR. The dual-protocol adapter still BOOTS in x402
      # mode (proven by test/pay_kit/harness_adapter_test.rb in the
      # Ruby gem test suite).
      - name: Run PayKit interop smoke (mpp charge)
        working-directory: harness
        env:
          MPP_INTEROP_CLIENTS: typescript
          MPP_INTEROP_SERVERS: ""
          PAY_KIT_INTEROP_SERVERS: ruby-pay-kit-server
        run: pnpm exec vitest run test/e2e.test.ts --testNamePattern "ruby-pay-kit-server" --testTimeout 180000

name: Ruby

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test-ruby:
    name: Ruby tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ruby
      - name: Validate gemspec
        working-directory: ruby
        run: bundle exec ruby -e "Gem::Specification.load('solana-pay-kit.gemspec').validate"
      - name: Lint
        working-directory: ruby
        run: bundle exec standardrb
      - name: Audit dependencies
        working-directory: ruby
        run: bundle exec bundle-audit check --update
      - name: Run tests with coverage
        working-directory: ruby
        env:
          SURFPOOL_REPORT: "1"
        run: COVERAGE=1 bundle exec ruby -Itest test/run.rb
      - name: Upload Ruby coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ruby-coverage
          path: ruby/coverage/.resultset.json
      - name: Upload Ruby surfpool report data
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: surfpool-reports-ruby
          path: ruby/target/surfpool-reports/
          if-no-files-found: ignore

  harness-ruby:
    name: "Harness: Ruby PayKit server (dual protocol)"
    needs: test-ruby
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ruby
      # The dual-protocol smoke launches the Rust x402 client. Compile it before
      # the harness's 120-second adapter-output deadline, as the other Rust
      # client legs do.
      - uses: ./.github/actions/setup-harness
        with:
          cargo-bins: "paykit-harness-bins:x402_harness_client"
          cargo-cache-key: ruby
      # IO-cap regression tests for the hand-rolled Ruby harness HTTP server
      # (harness/ruby-server/server.rb): a header value / count past the cap
      # returns 431 and an oversized declared body returns 413. Run from ruby/
      # so the spawned server resolves the SDK via bundler, exactly as the file
      # header documents. Reverting the caps in server.rb flips this red.
      - name: Run Ruby harness server IO-cap tests
        working-directory: ruby
        run: bundle exec ruby ../harness/ruby-server/test_server_io_caps.rb
      # Cross-SDK conformance vectors for Ruby: the Ruby exact verifier must
      # execute the x402 exact-reject fund-safety vectors, mirroring the python
      # leg. The conformance runner (harness/runners/ruby.json) launches
      # `bundle exec ruby exe/conformance` from ruby/ against the bundler
      # environment set up above.
      - name: Run Ruby cross-SDK conformance vectors
        working-directory: harness
        env:
          MPP_CONFORMANCE_LANGUAGES: ruby
        run: pnpm exec vitest run test/conformance.test.ts
      # NOTE: the Ruby mpp-PROTOCOL conformance leg is intentionally deferred (not
      # wired) pending verification on ruby 3.3. The local probe (ruby 4.0.5)
      # crashed the runner on the challenge.id unicode case (a US-ASCII/UTF-8 stdin
      # encoding mismatch in protocol_runner.rb), and an independent second-model
      # run had ruby conforming, so the observed divergences were environment-
      # contaminated. Fix the runner's stdin UTF-8 encoding, confirm the real
      # ruby-3.3 matrix, then wire it like the other SDK legs:
      #   MPP_CONFORMANCE_LANGUAGES=ruby vitest run test/protocol-conformance.test.ts
      # and add the corresponding KNOWN_RUNNER_DIVERGENCES[ruby] entry.
      # Dual-protocol proof: one e2e run drives MPP charge scenarios
      # (typescript client) and x402 exact (rust-x402 client) against
      # the same ruby adapter binary. The harness's harnessEnv exposes
      # X402_HARNESS_* shadows alongside MPP_HARNESS_* (same surfpool,
      # same funded keypairs) and stamps every scenario with
      # PAY_KIT_HARNESS_PROTOCOL so the dual-protocol adapter binds the
      # right protocol per scenario without relying on env namespace
      # probing. ts-x402 is intentionally excluded - it is a wire-only
      # fixture whose payload omits the on-chain transaction, so it can
      # only pair against the matching wire-only ts-x402 server, not a
      # real settle server.
      - name: Run harness smoke (mpp charge + x402 exact)
        working-directory: harness
        env:
          MPP_HARNESS_CLIENTS: typescript
          MPP_HARNESS_SERVERS: ruby,typescript
          MPP_HARNESS_INTENTS: charge,x402-exact
          X402_HARNESS_CLIENTS: rust-x402
          X402_HARNESS_SERVERS: ""
        # The ruby dual-protocol server is exercised via the "ruby" title filter
        # (the matrix also enables the typescript / x402 servers this leg does not
        # build). assert-run-count pins the ruby-server pair count so a rename of
        # the pair title silently running zero ruby tests fails loud.
        run: |
          pnpm exec vitest run test/e2e.test.ts --testNamePattern "ruby" --testTimeout 180000 --reporter=default --reporter=json --outputFile=vitest-report.json
          node scripts/assert-run-count.mjs --report vitest-report.json --exact 17

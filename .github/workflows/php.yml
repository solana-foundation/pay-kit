name: PHP

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  # Cancel a pull-request run when a newer push supersedes it. Measured over
  # the last 810 pull-request runs, 119 of them kept running after a newer
  # push had already started, for 11.2 hours of runner time spent on commits
  # nobody was waiting on.
  #
  # Non-pull-request runs get a group of their own, keyed on run_id, rather
  # than sharing one keyed on the ref. A shared group would queue them against
  # each other, and a concurrency group only holds one pending run: a third
  # push landing while the first is still running evicts the second, which
  # would then report no result at all for that commit. `cancel-in-progress`
  # being false does not prevent that, it only protects the running run.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which parts of the tree this pull request touches. Every other job in
  # this workflow gates on these outputs for pull_request events; pushes to
  # main and workflow_call runs are never filtered. A harness leg's filter
  # lists every language that participates in the leg, not just the server
  # language, so a cross-SDK change still runs the pairs it can break (#261).
  # Any change under .github/ invalidates every filter.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      php: ${{ steps.filter.outputs.php }}
      harness: ${{ steps.filter.outputs.harness }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            php:
              - 'php/**'
              - '.github/**'
            harness:
              - 'php/**'
              - 'harness/**'
              - 'typescript/**'
              - 'rust/**'
              - 'package.json'
              - '.node-version'
              - '.github/**'

  test-php:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.php == 'true'
    name: PHP tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: pcov
      - name: Install dependencies
        working-directory: php
        run: composer install --no-interaction --no-progress
      - name: Validate composer.json
        working-directory: php
        run: composer validate --strict
      - name: Audit composer dependencies
        working-directory: php
        run: composer audit --no-dev
      - name: Run PHP linter
        working-directory: php
        run: composer run lint
      - name: Run tests with coverage
        working-directory: php
        run: |
          mkdir -p build/coverage
          composer run test:coverage
      - name: Upload PHP coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: php-coverage
          path: php/build/coverage/clover.xml

  harness-php:
    name: PHP harness
    needs: [changes, test-php]
    if: ${{ !cancelled() && needs.changes.result == 'success' && (github.event_name != 'pull_request' || needs.changes.outputs.harness == 'true') && (needs['test-php'].result == 'success' || needs['test-php'].result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - uses: ./.github/actions/setup-harness
        with:
          cargo-bins: "paykit-harness-bins:mpp_harness_client,x402_harness_client"
          cargo-cache-key: php
      - name: Install PHP harness dependencies
        working-directory: php
        run: composer install --no-interaction --no-progress
      - name: Run PHP server harness smoke
        working-directory: harness
        run: pnpm exec vitest run test/e2e.test.ts --testNamePattern "typescript client pays php server"
        env:
          MPP_HARNESS_CLIENTS: typescript
          MPP_HARNESS_SERVERS: php
          MPP_HARNESS_SCENARIOS: charge-basic,charge-split-ata,charge-network-mismatch,charge-cross-route-replay
      - name: Run Rust client PHP server harness smoke
        working-directory: harness
        run: pnpm exec vitest run test/e2e.test.ts --testNamePattern "rust client pays php server"
        env:
          MPP_HARNESS_CLIENTS: rust
          MPP_HARNESS_SERVERS: php
          MPP_HARNESS_SCENARIOS: charge-basic,charge-split-ata

      # Dual-protocol proof: one e2e run drives MPP charge scenarios
      # (typescript client) and x402 exact (rust-x402 client) against
      # the same PHP adapter binary. Mirrors the lua + ruby harness
      # steps.
      - name: Run PayKit harness smoke (mpp charge + x402 exact)
        working-directory: harness
        env:
          MPP_HARNESS_CLIENTS: typescript
          MPP_HARNESS_SERVERS: php,typescript
          MPP_HARNESS_INTENTS: charge,x402-exact
          X402_HARNESS_CLIENTS: rust-x402
          X402_HARNESS_SERVERS: ""
        run: pnpm exec vitest run test/e2e.test.ts --testNamePattern "php server" --testTimeout 180000

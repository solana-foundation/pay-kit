name: PHP

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test-php:
    name: PHP tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: pcov
      - name: Install dependencies
        working-directory: php
        run: composer install --no-interaction --no-progress
      - name: Validate composer.json
        working-directory: php
        run: composer validate --strict
      - name: Audit composer dependencies
        working-directory: php
        run: composer audit --no-dev
      - name: Run PHP linter
        working-directory: php
        run: composer run lint
      - name: Run tests with coverage
        working-directory: php
        run: |
          mkdir -p build/coverage
          composer run test:coverage
      - name: Upload PHP coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: php-coverage
          path: php/build/coverage/clover.xml

  interop-php:
    name: PHP interop
    needs: test-php
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-php-interop-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-php-interop-
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - name: Install TypeScript workspace
        working-directory: typescript
        run: pnpm install --frozen-lockfile
      - name: Build TypeScript package
        working-directory: typescript
        run: pnpm --filter @solana/mpp build
      - name: Build Rust interop client
        working-directory: rust
        run: cargo build -p solana-mpp --bin interop_client
      - name: Build Rust x402 interop client
        working-directory: rust
        run: cargo build -p solana-x402 --bin interop_client
      - name: Install interop harness
        working-directory: harness
        run: pnpm install --frozen-lockfile
      - name: Install PHP interop dependencies
        working-directory: php
        run: composer install --no-interaction --no-progress
      - name: Typecheck interop harness
        working-directory: harness
        run: pnpm typecheck
      - name: Run PHP server interop smoke
        working-directory: harness
        run: pnpm exec vitest run test/e2e.test.ts --testNamePattern "typescript client pays php server"
        env:
          MPP_INTEROP_CLIENTS: typescript
          MPP_INTEROP_SERVERS: php
          MPP_INTEROP_SCENARIOS: charge-basic,charge-split-ata,charge-network-mismatch,charge-cross-route-replay
      - name: Run Rust client PHP server interop smoke
        working-directory: harness
        run: pnpm exec vitest run test/e2e.test.ts --testNamePattern "rust client pays php server"
        env:
          MPP_INTEROP_CLIENTS: rust
          MPP_INTEROP_SERVERS: php
          MPP_INTEROP_SCENARIOS: charge-basic,charge-split-ata

      # Dual-protocol proof: one e2e run drives MPP charge scenarios
      # (typescript client) and x402 exact (rust-x402 client) against
      # the same PHP adapter binary. Mirrors the lua + ruby interop
      # steps.
      - name: Run PayKit interop smoke (mpp charge + x402 exact)
        working-directory: harness
        env:
          MPP_INTEROP_CLIENTS: typescript
          MPP_INTEROP_SERVERS: php,typescript
          MPP_INTEROP_INTENTS: charge,x402-exact
          X402_INTEROP_CLIENTS: rust-x402
          X402_INTEROP_SERVERS: ""
        run: pnpm exec vitest run test/e2e.test.ts --testNamePattern "php server" --testTimeout 180000

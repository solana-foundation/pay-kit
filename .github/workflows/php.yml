name: PHP

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test-php:
    name: PHP tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.3"
          coverage: pcov
      - name: Install dependencies
        working-directory: php
        run: composer install --no-interaction --no-progress
      - name: Validate composer.json
        working-directory: php
        run: composer validate --strict
      - name: Audit composer dependencies
        working-directory: php
        run: composer audit --no-dev
      - name: Run PHP linter
        working-directory: php
        run: composer run lint
      - name: Run tests with coverage
        working-directory: php
        run: |
          mkdir -p build/coverage
          composer run test:coverage
      - name: Upload PHP coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: php-coverage
          path: php/build/coverage/clover.xml

  harness-php:
    name: PHP harness
    needs: test-php
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.3"
      - uses: ./.github/actions/setup-harness
        with:
          cargo-bins: "paykit-harness-bins:mpp_harness_client,x402_harness_client"
          cargo-cache-key: php
      - name: Install PHP harness dependencies
        working-directory: php
        run: composer install --no-interaction --no-progress
      # Cross-SDK conformance vectors for PHP: the PHP exact verifier must execute
      # the x402 exact-reject fund-safety vectors, mirroring the python leg. The
      # conformance runner (harness/runners/php.json) launches
      # `php conformance/runner.php` from php/ against the composer autoloader
      # installed above.
      - name: Run PHP cross-SDK conformance vectors
        working-directory: harness
        env:
          MPP_CONFORMANCE_LANGUAGES: php
        run: pnpm exec vitest run test/conformance.test.ts
      # Cross-SDK mpp-PROTOCOL conformance through the real PHP protocol codec.
      # PHP conforms fully today (no KNOWN_RUNNER_DIVERGENCES[php] entry), so ANY
      # divergence here is a real regression, not a tracked gap.
      - name: Run PHP protocol conformance (canonical challenge/receipt vectors)
        working-directory: harness
        env:
          MPP_CONFORMANCE_LANGUAGES: php
        run: pnpm exec vitest run test/protocol-conformance.test.ts
      # Selection is by the MPP_HARNESS_* env selectors (client, server, and the
      # scenario allowlist) alone; assert-run-count pins the executed pair count
      # so a title rename or selector typo that runs zero payment tests fails loud.
      - name: Run PHP server harness smoke
        working-directory: harness
        run: |
          pnpm exec vitest run test/e2e.test.ts --reporter=default --reporter=json --outputFile=vitest-report.json
          node scripts/assert-run-count.mjs --report vitest-report.json --exact 2
        env:
          MPP_HARNESS_CLIENTS: typescript
          MPP_HARNESS_SERVERS: php
          MPP_HARNESS_SCENARIOS: charge-basic,charge-split-ata,charge-network-mismatch,charge-cross-route-replay
      - name: Run Rust client PHP server harness smoke
        working-directory: harness
        run: |
          pnpm exec vitest run test/e2e.test.ts --reporter=default --reporter=json --outputFile=vitest-report.json
          node scripts/assert-run-count.mjs --report vitest-report.json --exact 2
        env:
          MPP_HARNESS_CLIENTS: rust
          MPP_HARNESS_SERVERS: php
          MPP_HARNESS_SCENARIOS: charge-basic,charge-split-ata

      # Dual-protocol proof: one e2e run drives MPP charge scenarios
      # (typescript client) and x402 exact (rust-x402 client) against
      # the same PHP adapter binary. Mirrors the lua + ruby harness
      # steps.
      - name: Run PayKit harness smoke (mpp charge + x402 exact)
        working-directory: harness
        env:
          MPP_HARNESS_CLIENTS: typescript
          MPP_HARNESS_SERVERS: php,typescript
          MPP_HARNESS_INTENTS: charge,x402-exact
          X402_HARNESS_CLIENTS: rust-x402
          X402_HARNESS_SERVERS: ""
        # The php server is exercised via the "php server" title filter (the
        # matrix also enables the typescript / x402 servers this leg does not
        # build); assert-run-count pins the php-server pair count.
        run: |
          pnpm exec vitest run test/e2e.test.ts --testNamePattern "php server" --testTimeout 180000 --reporter=default --reporter=json --outputFile=vitest-report.json
          node scripts/assert-run-count.mjs --report vitest-report.json --exact 10

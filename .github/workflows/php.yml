name: PHP

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test-php:
    name: PHP tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: pcov
      - name: Install dependencies
        working-directory: php
        run: composer install --no-interaction --no-progress
      - name: Validate composer.json
        working-directory: php
        run: composer validate --strict
      - name: Audit composer dependencies
        working-directory: php
        run: composer audit --no-dev
      - name: Run PHP linter
        working-directory: php
        run: composer run lint
      - name: Run tests with coverage
        working-directory: php
        run: |
          mkdir -p build/coverage
          composer run test:coverage
      - name: Upload PHP coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: php-coverage
          path: php/build/coverage/clover.xml

  harness-php:
    name: PHP harness
    needs: test-php
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - uses: ./.github/actions/setup-harness
        with:
          cargo-bins: "paykit-harness-bins:mpp_harness_client,x402_harness_client"
          cargo-cache-key: php
      - name: Install PHP harness dependencies
        working-directory: php
        run: composer install --no-interaction --no-progress
      - name: Run PHP server harness smoke
        working-directory: harness
        run: pnpm exec vitest run test/e2e.test.ts --testNamePattern "typescript client pays php server"
        env:
          MPP_HARNESS_CLIENTS: typescript
          MPP_HARNESS_SERVERS: php
          MPP_HARNESS_SCENARIOS: charge-basic,charge-split-ata,charge-network-mismatch,charge-cross-route-replay
      - name: Run Rust client PHP server harness smoke
        working-directory: harness
        run: pnpm exec vitest run test/e2e.test.ts --testNamePattern "rust client pays php server"
        env:
          MPP_HARNESS_CLIENTS: rust
          MPP_HARNESS_SERVERS: php
          MPP_HARNESS_SCENARIOS: charge-basic,charge-split-ata

      # Dual-protocol proof: one e2e run drives MPP charge scenarios
      # (typescript client) and x402 exact (rust-x402 client) against
      # the same PHP adapter binary. Mirrors the lua + ruby harness
      # steps.
      - name: Run PayKit harness smoke (mpp charge + x402 exact)
        working-directory: harness
        env:
          MPP_HARNESS_CLIENTS: typescript
          MPP_HARNESS_SERVERS: php,typescript
          MPP_HARNESS_INTENTS: charge,x402-exact
          X402_HARNESS_CLIENTS: rust-x402
          X402_HARNESS_SERVERS: ""
        run: pnpm exec vitest run test/e2e.test.ts --testNamePattern "php server" --testTimeout 180000

  # x402 upto: PHP PayKit server (channel open + voucher settle + distribute)
  # against the Rust upto client. Mirrors harness-kotlin-x402-upto / python
  # focused upto legs. Needs payment-channels .so on embedded surfnet.
  # x402-upto-basic only — zero-actual stays on rust-x402-upto (serverIds pin).
  harness-php-x402-upto:
    name: "Harness: PHP x402 upto server (rust client)"
    needs: test-php
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: gmp
      - uses: ./.github/actions/setup-harness
        with:
          cargo-bins: "paykit-harness-bins:x402_harness_upto_client,x402_harness_upto_server"
          cargo-cache-key: php-x402-upto
      - name: Install PHP harness dependencies
        working-directory: php
        run: composer install --no-interaction --no-progress
      - name: Build payment channels program
        id: payment-channels
        uses: ./.github/actions/build-payment-channels
      - name: Run rust-x402-upto client to PHP x402 upto server
        working-directory: harness
        env:
          MPP_HARNESS_CLIENTS: ""
          MPP_HARNESS_SERVERS: ""
          MPP_HARNESS_INTENTS: x402-upto
          MPP_HARNESS_SCENARIOS: x402-upto-basic
          X402_HARNESS_CLIENTS: rust-x402-upto
          X402_HARNESS_SERVERS: php-x402-upto
          PAYMENT_CHANNELS_PROGRAM_SO: ${{ steps.payment-channels.outputs.program-so }}
          PAYMENT_CHANNELS_PROGRAM_ID: CHNLxYvVA28MJP9PrFuDXccuoGXAx7jBacfLEkahyGsX
          SURFPOOL_DATASOURCE_RPC_URL: ${{ secrets.SURFPOOL_DATASOURCE_RPC_URL }}
        run: pnpm exec vitest run test/e2e.test.ts --testTimeout 180000

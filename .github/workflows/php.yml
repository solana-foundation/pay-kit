name: PHP

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  # Path filter: a PR that touches none of these skips the jobs below
  # (skipped jobs satisfy required checks); pushes and calls run them all.
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'php/**'
              - '.github/**'

  test-php:
    name: test
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: pcov
      - name: Install dependencies
        working-directory: php
        run: composer install --no-interaction --no-progress
      - name: Validate composer.json
        working-directory: php
        run: composer validate --strict
      - name: Audit composer dependencies
        working-directory: php
        run: composer audit --no-dev
      - name: Run PHP linter
        working-directory: php
        run: composer run lint
      - name: Run tests with coverage
        working-directory: php
        run: |
          mkdir -p build/coverage
          composer run test:coverage
      - name: Upload PHP coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: php-coverage
          path: php/build/coverage/clover.xml

name: Python

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test-python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python SDK
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint with ruff
        working-directory: python
        run: ruff check src tests
      - name: Type check with pyright
        working-directory: python
        run: pyright
      - name: Run tests with coverage
        working-directory: python
        # Coverage gate: line coverage at 90%. Branch coverage gate is follow-up work, tracked in #108.
        run: |
          pytest \
            --cov=solana_mpp \
            --cov-report=term-missing \
            --cov-report=json:coverage.json \
            --cov-fail-under=90 \
            --ignore=tests/test_server_html.py
      - name: Upload Python coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage
          path: python/coverage.json

  interop-python:
    name: Python interop matrix
    runs-on: ubuntu-latest
    needs: test-python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-python-interop-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-python-interop-
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - name: Install Python SDK
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # Critical order: install + build the TypeScript workspace BEFORE
      # installing the interop harness. harness has
      # ``"@solana/mpp": "file:../typescript/packages/mpp"`` which
      # pnpm copies into node_modules at install time. If the typescript
      # package has no dist/ at that moment, the TS interop client crashes
      # with ``Cannot find module '@solana/mpp/dist/client/index.js''`` on
      # boot and the harness reports "Adapter exited before signaling
      # readiness/result (code 1)". html-assets.gen.ts is committed in
      # the repo so no separate build-html step is needed.
      - name: Install TypeScript workspace
        working-directory: typescript
        run: pnpm install --frozen-lockfile
      - name: Build TypeScript package
        working-directory: typescript
        run: pnpm --filter @solana/mpp build
      - name: Build Rust interop adapters
        working-directory: rust
        run: cargo build -p solana-mpp --bin interop_client --bin interop_server
      - name: Install interop harness
        working-directory: harness
        run: pnpm install --frozen-lockfile
      - name: Focused TS-to-Python interop
        working-directory: harness
        env:
          MPP_INTEROP_CLIENTS: typescript
          MPP_INTEROP_SERVERS: python
        run: pnpm exec vitest run test/e2e.test.ts
      - name: Focused Rust-to-Python interop
        working-directory: harness
        env:
          MPP_INTEROP_CLIENTS: rust
          MPP_INTEROP_SERVERS: python
        run: pnpm exec vitest run test/e2e.test.ts

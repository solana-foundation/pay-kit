name: Python

permissions:
  contents: read

on:
  push:
    branches: [main]
  workflow_call:

jobs:
  test-python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          # uv owns the frozen dependency cache; a pip cache is absent after uv sync.
          cache-dependency-glob: python/uv.lock
          enable-cache: true
      - name: Verify uv.lock is up to date
        working-directory: python
        run: uv lock --check
      - name: Install Python SDK (frozen)
        working-directory: python
        # Install from the committed uv.lock (not a floating `pip install -e`) so
        # the release-gating Python CI is reproducible like every other SDK gate.
        # Framework extras bring fastapi/flask/django so the solana_pay_kit shim
        # tests import and pyright can resolve them; dev brings ruff, pyright, pytest.
        run: uv sync --frozen --extra dev --extra fastapi --extra flask --extra django
      - name: Lint with ruff
        working-directory: python
        run: uv run ruff check src tests
      - name: Type check with pyright
        working-directory: python
        # Point pyright at the frozen venv interpreter the extras were installed
        # into; it does not reliably auto-detect the active env on the runner.
        run: uv run pyright --pythonpath "$(uv run python -c 'import sys; print(sys.executable)')"
      - name: Run tests with coverage
        working-directory: python
        # Coverage gate: line coverage at 90% over solana_pay_kit (the MPP wire layer
        # now lives under solana_pay_kit/protocols/mpp). preflight.py is omitted in
        # pyproject (live-RPC paths). Branch coverage gate is follow-up work,
        # tracked in #108.
        run: |
          uv run pytest \
            --cov=solana_pay_kit \
            --cov-report=term-missing \
            --cov-report=json:coverage.json \
            --cov-fail-under=90 \
            --ignore=tests/test_server_html.py
      - name: Upload Python coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-coverage
          path: python/coverage.json

  harness-python:
    name: Python harness matrix
    runs-on: ubuntu-latest
    needs: test-python
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          # uv owns the frozen dependency cache; a pip cache is absent after uv sync.
          cache-dependency-glob: python/uv.lock
          enable-cache: true
      - name: Verify uv.lock is up to date
        working-directory: python
        run: uv lock --check
      - name: Install Python SDK (frozen)
        working-directory: python
        # Frozen install from the committed uv.lock, matching every other SDK gate.
        run: uv sync --frozen --extra dev
      - uses: ./.github/actions/setup-harness
        with:
          cargo-bins: "paykit-harness-bins:mpp_harness_client,mpp_harness_server,x402_harness_client,x402_harness_server,x402_harness_upto_client,x402_harness_upto_server"
          cargo-cache-key: python
      # x402 upto settles on the canonical payment-channels program; the upto
      # e2e deploys this localnet SBF artifact onto the embedded surfnet. Mirrors
      # the harness-go job in .github/workflows/go.yml.
      - name: Checkout payment channels program
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: Moonsong-Labs/solana-payment-channels
          ref: 0c07d5751c8972abf6a219570a3f39a72f46f879
          path: _payment-channels
          fetch-depth: 1
      # Pinned Agave release, fetched as a tarball and checksum-verified —
      # `curl https://release.anza.xyz/stable/install | sh` executed whatever
      # script and toolchain the mutable "stable" channel served that day.
      # Bump AGAVE_VERSION + AGAVE_SHA256 together to take upgrades.
      - name: Install Anza CLI
        run: |
          AGAVE_VERSION="v4.1.1"
          AGAVE_SHA256="a5c8e74b8ffa9ce906872b812849057c7fb21cf036ba08f219eb335e20fa4fb3"
          curl -sSfL -o /tmp/solana-release.tar.bz2 \
            "https://github.com/anza-xyz/agave/releases/download/${AGAVE_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          echo "${AGAVE_SHA256}  /tmp/solana-release.tar.bz2" | sha256sum -c -
          mkdir -p "$HOME/.local/share/solana/install"
          tar -xjf /tmp/solana-release.tar.bz2 -C "$HOME/.local/share/solana/install"
          echo "$HOME/.local/share/solana/install/solana-release/bin" >> "$GITHUB_PATH"
      - name: Patch payment channels treasury owner
        working-directory: _payment-channels
        run: |
          program_id="CHNLxYvVA28MJP9PrFuDXccuoGXAx7jBacfLEkahyGsX"
          lib_file="program/payment_channels/src/lib.rs"
          sentinel_file="program/payment_channels/src/constants.rs"
          sentinel_prefix="    0xb0, 0x41, 0xd9, 0xd3, 0x37, 0xb7, 0x21, 0xbe, 0x57, 0x89, 0x4e, 0xb6, 0x9c, 0x3b, 0x68, 0x09,"
          sentinel_suffix="    0xa5, 0x3a, 0x0e, 0x2b, 0x6a, 0x23, 0x99, 0xfc, 0x7d, 0x5b, 0x7e, 0xda, 0x8c, 0xac, 0x89, 0xaa,"
          # The pinned upstream ref already declares our canonical program id, so
          # only the localnet treasury-owner sentinel needs patching. Guard the id
          # assumption so a future ref bump that changes it fails loudly here.
          if ! grep -Fq "declare_id!(\"$program_id\")" "$lib_file"; then
            echo "::error::payment-channels no longer declares $program_id; revisit this patch"
            exit 1
          fi
          perl -0pi -e 's/const TREASURY_OWNER_SENTINEL: \[u8; 32\] = \[\n.*?\n\];/const TREASURY_OWNER_SENTINEL: [u8; 32] = [\n    0xb0, 0x41, 0xd9, 0xd3, 0x37, 0xb7, 0x21, 0xbe, 0x57, 0x89, 0x4e, 0xb6, 0x9c, 0x3b, 0x68, 0x09,\n    0xa5, 0x3a, 0x0e, 0x2b, 0x6a, 0x23, 0x99, 0xfc, 0x7d, 0x5b, 0x7e, 0xda, 0x8c, 0xac, 0x89, 0xaa,\n];/s' "$sentinel_file"
          if ! grep -Fq "$sentinel_prefix" "$sentinel_file" || ! grep -Fq "$sentinel_suffix" "$sentinel_file"; then
            echo "::error::payment-channels treasury sentinel patch did not apply"
            exit 1
          fi
      - name: Build payment channels program
        working-directory: _payment-channels/program/payment_channels
        run: cargo build-sbf --tools-version v1.52 --arch v1
      # Sync the uv environment the conformance runner (runners/python.json:
      # ``uv run python conformance_runner.py``) executes in, so the cross-SDK
      # vectors - including the canonical 50-byte session voucher preimage - run
      # without a per-vector cold install.
      - name: Sync Python uv environment
        working-directory: python
        run: uv sync --frozen --extra dev
      # Cross-SDK conformance vectors for Python: charge, x402-exact, and the
      # session voucher-preimage byte-vector (runners/python.json declares the
      # session intent). Pins the Python session wire bytes against the frozen
      # cross-SDK vector rather than only the charge path.
      - name: Run Python cross-SDK conformance vectors
        working-directory: harness
        env:
          MPP_CONFORMANCE_LANGUAGES: python
        run: pnpm exec vitest run test/conformance.test.ts
      # Cross-SDK mpp-PROTOCOL conformance through the real Python protocol codec.
      # Known Python divergences (empty-realm / empty-intent not rejected) are
      # tracked in KNOWN_RUNNER_DIVERGENCES[python]; a RED is a NEW divergence.
      - name: Run Python protocol conformance (canonical challenge/receipt vectors)
        working-directory: harness
        env:
          MPP_CONFORMANCE_LANGUAGES: python
        run: pnpm exec vitest run test/protocol-conformance.test.ts
      - name: Focused Python session harness
        working-directory: harness
        # The session close settles on-chain (settle_and_finalize + distribute on
        # the payment-channels program), so it deploys the same localnet SBF
        # artifact built above onto the embedded surfnet — without it the session
        # never lands a real settlement. The same run also exercises the Tier-2
        # confirmation-gating fault guards (a settle broadcast that never
        # confirms, and one stuck at `processed`): both must leave the channel
        # un-finalized with settledSignature unset. They are not pair-titled, so
        # --exact 1 is unchanged.
        env:
          MPP_HARNESS_INTENTS: session
          MPP_HARNESS_SCENARIOS: session-basic
          MPP_HARNESS_CLIENTS: python-session
          MPP_HARNESS_SERVERS: python
          PAYMENT_CHANNELS_PROGRAM_SO: ../_payment-channels/target/deploy/payment_channels.so
          PAYMENT_CHANNELS_PROGRAM_ID: CHNLxYvVA28MJP9PrFuDXccuoGXAx7jBacfLEkahyGsX
          SURFPOOL_DATASOURCE_RPC_URL: ${{ secrets.SURFPOOL_DATASOURCE_RPC_URL }}
        run: |
          # Gate self-activation: same subject rule as the harness.yml python
          # leg — the python session settle path (and this marker fixture) land
          # with the mpp session-state leaf; pre-hardening the settle tx is
          # rejected on-chain (0x104), so the leg waits on its subject.
          if [ ! -f python-session-client/test_main.py ]; then
            echo "::notice title=Python session gate pending::the python session settle hardening is not in this tree yet; the leg activates when the mpp session-state leaf lands."
            exit 0
          fi
          pnpm exec vitest run test/e2e.test.ts --testTimeout 180000 --reporter=default --reporter=json --outputFile=vitest-report.json
          node scripts/assert-run-count.mjs --report vitest-report.json --exact 1
      - name: Focused Python session fault-injection (missing-ATA, known-red)
        working-directory: harness
        # RED-EXPECTED, non-blocking. Pins the missing-ATA-creation finding: the
        # SDK session close builds [ed25519, settle, distribute] and, unlike the
        # x402-upto settle path, omits the idempotent payee-ATA creation. A close
        # to a recipient with no ATA returns 200 + settledSignature yet delivers
        # nothing on-chain (recipient stays 0, no ATA created). Gated behind
        # MPP_HARNESS_SESSION_RED_FAULTS so it never contaminates the green
        # must-pass leg above; continue-on-error surfaces it as a non-blocking red
        # annotation until the session close creates the payee ATA or rejects
        # clearly.
        continue-on-error: true
        env:
          MPP_HARNESS_INTENTS: session
          MPP_HARNESS_SCENARIOS: session-basic
          MPP_HARNESS_CLIENTS: python-session
          MPP_HARNESS_SERVERS: python
          MPP_HARNESS_SESSION_RED_FAULTS: "1"
          PAYMENT_CHANNELS_PROGRAM_SO: ../_payment-channels/target/deploy/payment_channels.so
          PAYMENT_CHANNELS_PROGRAM_ID: CHNLxYvVA28MJP9PrFuDXccuoGXAx7jBacfLEkahyGsX
          SURFPOOL_DATASOURCE_RPC_URL: ${{ secrets.SURFPOOL_DATASOURCE_RPC_URL }}
        run: pnpm exec vitest run test/e2e.test.ts -t "no ATA" --testTimeout 180000
      - name: Focused TS-to-Python harness
        working-directory: harness
        env:
          MPP_HARNESS_CLIENTS: typescript
          MPP_HARNESS_SERVERS: python
        run: |
          pnpm exec vitest run test/e2e.test.ts --reporter=default --reporter=json --outputFile=vitest-report.json
          node scripts/assert-run-count.mjs --report vitest-report.json --exact 8
      - name: Focused Rust-to-Python harness
        working-directory: harness
        env:
          MPP_HARNESS_CLIENTS: rust
          MPP_HARNESS_SERVERS: python
        run: |
          pnpm exec vitest run test/e2e.test.ts --reporter=default --reporter=json --outputFile=vitest-report.json
          node scripts/assert-run-count.mjs --report vitest-report.json --exact 5
      # x402 exact: drive the Python solana_pay_kit x402 client (a real signed v0
      # VersionedTransaction) against the full-settling rust and python x402
      # servers. test/e2e.test.ts self-hosts surfnet and threads the funded
      # client keypair into X402_HARNESS_CLIENT_SECRET_KEY. The matrix pairs
      # every active client x active server, so the MPP_HARNESS_* selectors are
      # also set to keep the default charge-enabled adapters (typescript, php,
      # go) out of this x402 run. ts-x402 is excluded: its stub server expects a
      # payload.challengeId and never broadcasts a real transaction, so it
      # cannot settle a genuine signed tx (same reason rust-x402 skips it). The
      # x402 client adapter imports solana_pay_kit from python/src on sys.path (no
      # extra install beyond the frozen SDK above).
      - name: Focused python-x402 -> rust/python x402 servers
        working-directory: harness
        env:
          MPP_HARNESS_INTENTS: x402-exact
          MPP_HARNESS_SCENARIOS: x402-exact-basic
          MPP_HARNESS_CLIENTS: python-x402
          MPP_HARNESS_SERVERS: rust-x402,python
          X402_HARNESS_CLIENTS: python-x402
          X402_HARNESS_SERVERS: rust-x402,python
        run: |
          pnpm exec vitest run test/e2e.test.ts --testTimeout 180000 --reporter=default --reporter=json --outputFile=vitest-report.json
          node scripts/assert-run-count.mjs --report vitest-report.json --exact 2
      # x402 upto: drive the Python solana_pay_kit upto client + PayKit upto server
      # (channel open + voucher settle on the embedded surfnet) against the Rust
      # upto reference. x402-upto-basic runs every active client x server; the
      # zero-actual scenario is pinned to rust-x402-upto (serverIds in
      # intents/x402-upto.ts), so the fail-closed PayKit python/go servers are
      # excluded from it. Requires the payment-channels .so built above.
      - name: Focused python-x402-upto -> rust/python upto servers
        working-directory: harness
        env:
          MPP_HARNESS_INTENTS: x402-upto
          MPP_HARNESS_SCENARIOS: x402-upto-basic,x402-upto-zero-actual
          MPP_HARNESS_CLIENTS: python-x402-upto,rust-x402-upto
          MPP_HARNESS_SERVERS: python-x402-upto,rust-x402-upto
          X402_HARNESS_CLIENTS: python-x402-upto,rust-x402-upto
          X402_HARNESS_SERVERS: python-x402-upto,rust-x402-upto
          PAYMENT_CHANNELS_PROGRAM_SO: ../_payment-channels/target/deploy/payment_channels.so
          PAYMENT_CHANNELS_PROGRAM_ID: CHNLxYvVA28MJP9PrFuDXccuoGXAx7jBacfLEkahyGsX
          SURFPOOL_DATASOURCE_RPC_URL: ${{ secrets.SURFPOOL_DATASOURCE_RPC_URL }}
        run: |
          pnpm exec vitest run test/e2e.test.ts --testTimeout 180000 --reporter=default --reporter=json --outputFile=vitest-report.json
          node scripts/assert-run-count.mjs --report vitest-report.json --exact 6

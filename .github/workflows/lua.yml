name: Lua

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  # Cancel a pull-request run when a newer push supersedes it. Measured over
  # the last 810 pull-request runs, 119 of them kept running after a newer
  # push had already started, for 11.2 hours of runner time spent on commits
  # nobody was waiting on.
  #
  # Non-pull-request runs get a group of their own, keyed on run_id, rather
  # than sharing one keyed on the ref. A shared group would queue them against
  # each other, and a concurrency group only holds one pending run: a third
  # push landing while the first is still running evicts the second, which
  # would then report no result at all for that commit. `cancel-in-progress`
  # being false does not prevent that, it only protects the running run.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-lua:
    name: Lua tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install LuaJIT 2.1, LuaRocks, libsodium, openssl
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit libluajit-5.1-dev luarocks libsodium-dev libssl-dev
          luajit -v
          luarocks --version

      - name: Cache rocks tree
        id: cache-rocks
        uses: actions/cache@v4
        with:
          path: lua/lua_modules
          # Keep the dev toolchain separate from the runtime-only harness
          # cache: the latter does not contain luacheck or luacov.
          key: ${{ runner.os }}-luarocks-dev-v4-${{ hashFiles('lua/pay-kit-dev-1.rockspec', 'lua/.luacov', 'lua/.luacheckrc') }}
          restore-keys: ${{ runner.os }}-luarocks-dev-v4-

      - name: Install dev rocks (luacheck + luacov + cluacov + luasocket + luasodium + luasec + lua-resty-openssl + cjson)
        if: steps.cache-rocks.outputs.cache-hit != 'true'
        working-directory: lua
        run: |
          mkdir -p lua_modules
          luarocks --lua-version=5.1 init --lua-versions 5.1 || true
          luarocks --lua-version=5.1 install --tree lua_modules luacheck
          luarocks --lua-version=5.1 install --tree lua_modules luacov
          # LuaCov swaps its pure-Lua line hook for cluacov's C hook when the
          # rock is present. The hook fires on every executed line and cannot
          # be avoided (a debug hook is what stops LuaJIT from running compiled
          # traces in the first place), so moving the per-line work out of Lua
          # is where the wall-clock goes. Same stats, same report.
          luarocks --lua-version=5.1 install --tree lua_modules cluacov
          luarocks --lua-version=5.1 install --tree lua_modules luasocket
          luarocks --lua-version=5.1 install --tree lua_modules luasodium
          luarocks --lua-version=5.1 install --tree lua_modules luasec OPENSSL_DIR=/usr
          luarocks --lua-version=5.1 install --tree lua_modules lua-resty-openssl
          luarocks --lua-version=5.1 install --tree lua_modules lua-cjson

      - name: Validate rockspecs
        working-directory: lua
        run: |
          luarocks --lua-version=5.1 lint pay-kit-dev-1.rockspec
          luarocks --lua-version=5.1 lint kong-plugin-pay-kit-dev-1.rockspec
          luarocks --lua-version=5.1 lint apisix-plugin-pay-kit-dev-1.rockspec

      - name: Lint
        working-directory: lua
        run: |
          eval "$(luarocks --lua-version=5.1 --tree lua_modules path)"
          luacheck pay_kit/ plugins/ tests/

      - name: Run tests with coverage
        working-directory: lua
        env:
          SURFPOOL_REPORT: "1"
        run: |
          rm -f ../luacov.stats.out ../luacov.report.out
          eval "$(luarocks --lua-version=5.1 --tree lua_modules path)"
          luajit -lluacov tests/run.lua
          luacov
          ./scripts/check_coverage.sh ../luacov.report.out 90

      # This second run exercises the suite on the JIT path, which is the one
      # downstream users actually run. luacov's line hook stops LuaJIT from
      # running compiled traces, so a regression that only shows up with the
      # trace compiler on would otherwise never surface.
      - name: Run the suite on the JIT path, without coverage
        working-directory: lua
        run: |
          eval "$(luarocks --lua-version=5.1 --tree lua_modules path)"
          luajit tests/run.lua

      - name: Upload Lua coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lua-coverage
          path: luacov.report.out

      - name: Upload Lua surfpool report data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surfpool-reports-lua
          path: lua/target/surfpool-reports/
          if-no-files-found: ignore

  harness-lua:
    name: Lua harness focused matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install LuaJIT 2.1, LuaRocks, libsodium, openssl
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit libluajit-5.1-dev luarocks libsodium-dev libssl-dev
          luajit -v

      - name: Cache rocks tree
        id: cache-rocks
        uses: actions/cache@v4
        with:
          path: lua/lua_modules
          key: ${{ runner.os }}-luarocks-runtime-v3-${{ hashFiles('lua/pay-kit-dev-1.rockspec', 'lua/.luacov', 'lua/.luacheckrc') }}
          restore-keys: ${{ runner.os }}-luarocks-runtime-v3-

      - name: Install runtime rocks
        if: steps.cache-rocks.outputs.cache-hit != 'true'
        working-directory: lua
        run: |
          mkdir -p lua_modules
          luarocks --lua-version=5.1 init --lua-versions 5.1 || true
          luarocks --lua-version=5.1 install --tree lua_modules luasocket
          luarocks --lua-version=5.1 install --tree lua_modules luasodium
          luarocks --lua-version=5.1 install --tree lua_modules luasec OPENSSL_DIR=/usr
          luarocks --lua-version=5.1 install --tree lua_modules lua-resty-openssl
          luarocks --lua-version=5.1 install --tree lua_modules lua-cjson

      - uses: ./.github/actions/setup-harness
        with:
          cargo-bins: "paykit-harness-bins:mpp_harness_client"
          cargo-cache-key: lua

      - name: TS-to-Lua focused matrix
        working-directory: harness
        env:
          MPP_HARNESS_CLIENTS: typescript
          MPP_HARNESS_SERVERS: lua
          MPP_HARNESS_SCENARIOS: charge-basic,charge-split-ata,charge-network-mismatch,charge-cross-route-replay
        run: pnpm exec vitest run test/e2e.test.ts --testNamePattern "typescript client pays lua server"

      - name: Rust-to-Lua focused matrix
        working-directory: harness
        env:
          MPP_HARNESS_CLIENTS: rust
          MPP_HARNESS_SERVERS: lua
          MPP_HARNESS_SCENARIOS: charge-basic,charge-split-ata
        run: pnpm exec vitest run test/e2e.test.ts --testNamePattern "rust client pays lua server"

      # Dual-protocol proof: one e2e run drives MPP charge scenarios
      # (typescript client) and x402 exact (rust-x402 client) against
      # the same Lua adapter binary. Mirrors the ruby workflow's
      # harness-ruby step. The dual-protocol Lua adapter at
      # harness/lua-server/server.lua reads either MPP_HARNESS_* or
      # X402_HARNESS_* env (or the PAY_KIT_HARNESS_PROTOCOL hint that
      # the matrix stamps when both namespaces are populated against
      # the same surfpool fixtures) and routes through resty.pay_kit.
      - name: Run PayKit harness smoke (mpp charge + x402 exact)
        working-directory: harness
        env:
          MPP_HARNESS_CLIENTS: typescript
          MPP_HARNESS_SERVERS: lua,typescript
          MPP_HARNESS_INTENTS: charge,x402-exact
          X402_HARNESS_CLIENTS: rust-x402
          X402_HARNESS_SERVERS: ""
        run: pnpm exec vitest run test/e2e.test.ts --testNamePattern "lua" --testTimeout 180000

name: Lua

permissions:
  contents: read

on:
  push:
    branches: [main]
  workflow_call:

jobs:
  test-lua:
    name: Lua tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install LuaJIT 2.1, LuaRocks, libsodium, openssl
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit libluajit-5.1-dev luarocks libsodium-dev libssl-dev
          luajit -v
          luarocks --version

      - name: Cache rocks tree
        id: cache-rocks
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: lua/lua_modules
          key: ${{ runner.os }}-luarocks-dev-v3-${{ hashFiles('lua/pay-kit-dev-1.rockspec', 'lua/.luacov', 'lua/.luacheckrc') }}
          restore-keys: ${{ runner.os }}-luarocks-dev-v3-

      - name: Install dev rocks (luacheck + luacov + luasocket + luasodium + luasec + lua-resty-openssl + cjson)
        if: steps.cache-rocks.outputs.cache-hit != 'true'
        working-directory: lua
        run: |
          mkdir -p lua_modules
          luarocks --lua-version=5.1 init --lua-versions 5.1 || true
          luarocks --lua-version=5.1 install --tree lua_modules luacheck
          luarocks --lua-version=5.1 install --tree lua_modules luacov
          luarocks --lua-version=5.1 install --tree lua_modules luasocket
          luarocks --lua-version=5.1 install --tree lua_modules luasodium
          luarocks --lua-version=5.1 install --tree lua_modules luasec OPENSSL_DIR=/usr
          luarocks --lua-version=5.1 install --tree lua_modules lua-resty-openssl
          luarocks --lua-version=5.1 install --tree lua_modules lua-cjson

      - name: Validate rockspecs
        working-directory: lua
        run: |
          luarocks --lua-version=5.1 lint pay-kit-dev-1.rockspec
          luarocks --lua-version=5.1 lint kong-plugin-pay-kit-dev-1.rockspec
          luarocks --lua-version=5.1 lint apisix-plugin-pay-kit-dev-1.rockspec

      - name: Lint
        working-directory: lua
        run: |
          eval "$(luarocks --lua-version=5.1 --tree lua_modules path)"
          luacheck pay_kit/ plugins/ tests/

      - name: Run tests with coverage
        working-directory: lua
        env:
          SURFPOOL_REPORT: "1"
        run: |
          rm -f ../luacov.stats.out ../luacov.report.out
          eval "$(luarocks --lua-version=5.1 --tree lua_modules path)"
          luajit -lluacov tests/run.lua
          luacov
          ./scripts/check_coverage.sh ../luacov.report.out 90

      # Codex PR #103 P3: the coverage gate excludes pay_kit/solana/ata
      # because luacov disables LuaJIT trace recording and the on-curve check
      # becomes ~100x slower under coverage. Run the suite a second time
      # WITHOUT luacov so the protocol-critical ATA fixture spec
      # (`ata.derive matches the Ruby reference for the USDC Token-2022 ATA`)
      # is actually exercised. test_helper.lua skips it when luacov is loaded.
      - name: Run protocol-critical ATA fixture suite without coverage
        working-directory: lua
        run: |
          eval "$(luarocks --lua-version=5.1 --tree lua_modules path)"
          luajit tests/run.lua

      - name: Upload Lua coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lua-coverage
          path: luacov.report.out

      - name: Upload Lua surfpool report data
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: surfpool-reports-lua
          path: lua/target/surfpool-reports/
          if-no-files-found: ignore

  harness-lua:
    name: Lua harness focused matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install LuaJIT 2.1, LuaRocks, libsodium, openssl
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit libluajit-5.1-dev luarocks libsodium-dev libssl-dev
          luajit -v

      - name: Cache rocks tree
        id: cache-rocks
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: lua/lua_modules
          key: ${{ runner.os }}-luarocks-runtime-v3-${{ hashFiles('lua/pay-kit-dev-1.rockspec', 'lua/.luacov', 'lua/.luacheckrc') }}
          restore-keys: ${{ runner.os }}-luarocks-runtime-v3-

      - name: Install runtime rocks
        if: steps.cache-rocks.outputs.cache-hit != 'true'
        working-directory: lua
        run: |
          mkdir -p lua_modules
          luarocks --lua-version=5.1 init --lua-versions 5.1 || true
          luarocks --lua-version=5.1 install --tree lua_modules luasocket
          luarocks --lua-version=5.1 install --tree lua_modules luasodium
          luarocks --lua-version=5.1 install --tree lua_modules luasec OPENSSL_DIR=/usr
          luarocks --lua-version=5.1 install --tree lua_modules lua-resty-openssl
          luarocks --lua-version=5.1 install --tree lua_modules lua-cjson

      - uses: ./.github/actions/setup-harness
        with:
          # The dual-protocol smoke below also runs the Rust x402 client.
          cargo-bins: "paykit-harness-bins:mpp_harness_client,x402_harness_client"
          cargo-cache-key: lua

      # Cross-SDK conformance vectors for Lua: the server-only Lua exact verifier
      # in pay_kit.protocols.x402 must execute the x402 exact-reject fund-safety
      # vectors, mirroring the python leg. The conformance runner
      # (harness/runners/lua.json) launches `luajit cmd/conformance/main.lua` from
      # lua/, so export the luarocks tree first (as the lua harness adapter does)
      # so the spawned runner resolves luasodium / lua-cjson from lua_modules.
      - name: Run Lua cross-SDK conformance vectors
        working-directory: harness
        env:
          MPP_CONFORMANCE_LANGUAGES: lua
        run: |
          eval "$(cd ../lua && luarocks --lua-version=5.1 --tree lua_modules path)"
          pnpm exec vitest run test/conformance.test.ts
      # Cross-SDK mpp-PROTOCOL conformance through the real Lua protocol codec.
      # Known Lua divergence (uppercase-method not rejected) is tracked in
      # KNOWN_RUNNER_DIVERGENCES[lua]; a RED is a NEW divergence.
      - name: Run Lua protocol conformance (canonical challenge/receipt vectors)
        working-directory: harness
        env:
          MPP_CONFORMANCE_LANGUAGES: lua
        run: |
          eval "$(cd ../lua && luarocks --lua-version=5.1 --tree lua_modules path)"
          pnpm exec vitest run test/protocol-conformance.test.ts

      # Selection is by the MPP_HARNESS_* env selectors (client, server, and the
      # scenario allowlist) alone; assert-run-count pins the executed pair count
      # so a title rename or selector typo that runs zero payment tests fails loud.
      - name: TS-to-Lua focused matrix
        working-directory: harness
        env:
          MPP_HARNESS_CLIENTS: typescript
          MPP_HARNESS_SERVERS: lua
          MPP_HARNESS_SCENARIOS: charge-basic,charge-split-ata,charge-network-mismatch,charge-cross-route-replay
        run: |
          pnpm exec vitest run test/e2e.test.ts --reporter=default --reporter=json --outputFile=vitest-report.json
          node scripts/assert-run-count.mjs --report vitest-report.json --exact 2

      - name: Rust-to-Lua focused matrix
        working-directory: harness
        env:
          MPP_HARNESS_CLIENTS: rust
          MPP_HARNESS_SERVERS: lua
          MPP_HARNESS_SCENARIOS: charge-basic,charge-split-ata
        run: |
          pnpm exec vitest run test/e2e.test.ts --reporter=default --reporter=json --outputFile=vitest-report.json
          node scripts/assert-run-count.mjs --report vitest-report.json --exact 2

      # Dual-protocol proof: one e2e run drives MPP charge scenarios
      # (typescript client) and x402 exact (rust-x402 client) against
      # the same Lua adapter binary. Mirrors the ruby workflow's
      # harness-ruby step. The dual-protocol Lua adapter at
      # harness/lua-server/server.lua reads either MPP_HARNESS_* or
      # X402_HARNESS_* env (or the PAY_KIT_HARNESS_PROTOCOL hint that
      # the matrix stamps when both namespaces are populated against
      # the same surfpool fixtures) and routes through resty.pay_kit.
      - name: Run PayKit harness smoke (mpp charge + x402 exact)
        working-directory: harness
        env:
          MPP_HARNESS_CLIENTS: typescript
          MPP_HARNESS_SERVERS: lua,typescript
          MPP_HARNESS_INTENTS: charge,x402-exact
          X402_HARNESS_CLIENTS: rust-x402
          X402_HARNESS_SERVERS: ""
        # The lua dual-protocol server is exercised via the "lua" title filter
        # (the matrix also enables the typescript / x402 servers this leg does not
        # build); assert-run-count pins the lua-server pair count.
        run: |
          pnpm exec vitest run test/e2e.test.ts --testNamePattern "lua" --testTimeout 180000 --reporter=default --reporter=json --outputFile=vitest-report.json
          node scripts/assert-run-count.mjs --report vitest-report.json --exact 10

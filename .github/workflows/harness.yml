name: Harness

# Build portable dependencies once, then native payment adapters once per OS.
# Language legs consume artifacts, not compiler caches. Conformance runners are
# separate from payment adapters and retain their own build/runtime setup.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build harness deps (once)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-harness
      - name: Run charge client GC regression
        working-directory: harness
        run: pnpm exec vitest run test/charge-client-gc.test.ts
      - name: Test native artifact build and dispatch contracts
        working-directory: harness
        run: >-
          pnpm exec vitest run
          test/artifacts.test.ts test/build-adapters.test.ts test/conformance-runners.test.ts test/adapter-identity.test.ts
          test/canonical-json.test.ts test/compute-budget-caps.test.ts test/intent-selection.test.ts
          test/process.test.ts test/x402-amount-base-units.test.ts test/x402-v1-exact.test.ts test/protocol-adversarial.test.ts
      - name: Upload @solana/mpp dist
        uses: actions/upload-artifact@v7
        with:
          name: mpp-dist
          path: typescript/packages/mpp/dist
          if-no-files-found: error
      - name: Upload @solana/pay-kit dist
        uses: actions/upload-artifact@v7
        with:
          name: pay-kit-dist
          path: typescript/packages/pay-kit/dist
          if-no-files-found: error

  build-native:
    name: Build native harness adapters (${{ matrix.runner }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          # Union of native adapters actually selected by the smoke steps below,
          # including test-name filters, rather than every default-enabled adapter.
          - runner: ubuntu-latest
            clients: rust,rust-x402,go-x402,kotlin,kotlin-x402
            servers: rust,rust-x402,go
            conformance: kotlin,go
          - runner: macos-latest
            clients: swift,swift-x402
            servers: rust,rust-x402
            conformance: swift
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-${{ runner.arch }}-harness-native-${{ hashFiles('rust/**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-harness-native-
      - uses: actions/setup-go@v6
        if: runner.os == 'Linux'
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: actions/setup-java@v5
        if: runner.os == 'Linux'
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        if: runner.os == 'Linux'
        with:
          gradle-version: "9.5.1"
      # Swift is supplied by the hosted macOS runner.
      - uses: ./.github/actions/setup-harness-leg
      - name: Build native adapters and conformance runners
        working-directory: harness
        env:
          CLIENTS: ${{ matrix.clients }}
          SERVERS: ${{ matrix.servers }}
          CONFORMANCE: ${{ matrix.conformance }}
        run: pnpm exec tsx build-adapters.ts --clients "$CLIENTS" --servers "$SERVERS" --conformance "$CONFORMANCE" --out ../.harness-artifacts
      - name: Package compiled harness artifacts
        run: tar -czf adapters.tar.gz -C .harness-artifacts .
      - uses: actions/upload-artifact@v7
        with:
          name: harness-adapters-${{ runner.os }}
          path: adapters.tar.gz
          if-no-files-found: error

  ts:
    name: "Harness: TypeScript (TypeScript/Rust client/server)"
    needs: [build, build-native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-harness-leg
        id: harness-setup
        with:
          native-artifact: harness-adapters-${{ runner.os }}
          pay-kit-dist: "true"
      # The TypeScript x402 runner imports the vendored @x402 packages from
      # the pay-kit workspace, so install it (the dist itself is prebuilt).
      - name: Install the TypeScript workspace
        working-directory: typescript
        run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-pkc
        with:
          cache-key: pkc-typescript
      - name: Run typescript offline conformance vectors (pkc)
        env:
          HARNESS_REQUIRE: "1"
        run: pkc run --sdk typescript --tier offline --require
      - name: Upload typescript offline builds for cross-verification
        uses: actions/upload-artifact@v7
        with:
          name: pkc-builds-typescript
          path: harness/results/typescript/builds
          if-no-files-found: error
      - name: Run typescript offline conformance (protocol + flows)
        working-directory: harness
        env:
          MPP_CONFORMANCE_LANGUAGES: typescript
          HARNESS_REQUIRE: "1"
        run: >-
          pnpm exec vitest run
          test/expectations.test.ts test/ci-coverage.test.ts test/interop-coverage.test.ts
          test/protocol-conformance.test.ts test/flow-conformance.test.ts
      - name: Check generated coverage tables
        working-directory: harness
        run: pnpm coverage:check && pnpm interop:check
      # Keep pairing coverage after test failures, but not failed setup or cancellation.
      - name: Run TypeScript end-to-end harness smoke
        if: ${{ !cancelled() && steps.harness-setup.outcome == 'success' }}
        working-directory: harness
        run: pnpm exec vitest run test/e2e.test.ts --testNamePattern "typescript client pays typescript server"
        env:
          MPP_HARNESS_CLIENTS: typescript
          MPP_HARNESS_SERVERS: typescript
      - name: Run Rust client harness smoke
        if: ${{ !cancelled() && steps.harness-setup.outcome == 'success' }}
        working-directory: harness
        run: pnpm exec vitest run test/e2e.test.ts --testNamePattern "rust client pays typescript server"
        env:
          MPP_HARNESS_CLIENTS: rust
          MPP_HARNESS_SERVERS: typescript
      - name: Run Rust server harness smoke
        if: ${{ !cancelled() && steps.harness-setup.outcome == 'success' }}
        working-directory: harness
        run: pnpm exec vitest run test/e2e.test.ts --testNamePattern "typescript client pays rust server"
        env:
          MPP_HARNESS_CLIENTS: typescript
          MPP_HARNESS_SERVERS: rust

  go:
    name: "Harness: Go (mpp charge + x402 exact)"
    needs: [build, build-native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The vector runner is a prebuilt artifact; the protocol runner uses `go run`.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: ./.github/actions/setup-harness-leg
        with:
          native-artifact: harness-adapters-${{ runner.os }}
      - uses: ./.github/actions/setup-pkc
        with:
          cache-key: pkc-go
      - name: Run go offline conformance vectors (pkc)
        env:
          HARNESS_REQUIRE: "1"
        run: pkc run --sdk go --tier offline --require
      - name: Upload go offline builds for cross-verification
        uses: actions/upload-artifact@v7
        with:
          name: pkc-builds-go
          path: harness/results/go/builds
          if-no-files-found: error
      - name: Run go offline conformance (protocol)
        working-directory: harness
        env:
          MPP_CONFORMANCE_LANGUAGES: go
          HARNESS_REQUIRE: "1"
        run: pnpm exec vitest run test/protocol-conformance.test.ts
      - name: Run Go PayKit harness matrix (mpp charge + x402 exact)
        working-directory: harness
        env:
          MPP_HARNESS_CLIENTS: typescript
          MPP_HARNESS_SERVERS: go
          MPP_HARNESS_INTENTS: charge,x402-exact
          MPP_HARNESS_SCENARIOS: charge-basic,charge-split-ata,charge-symbol-usdc-localnet,charge-token2022-split-ata,charge-split-ata-idempotent,charge-compute-budget-over-cap,charge-splits-too-many,charge-splits-sum-equals-amount,charge-network-mismatch,charge-cross-route-replay,x402-exact-basic
          X402_HARNESS_CLIENTS: rust-x402,go-x402
          X402_HARNESS_SERVERS: go
        run: pnpm exec vitest run test/e2e.test.ts --testTimeout 180000

  python:
    name: "Harness: Python"
    needs: [build, build-native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: astral-sh/setup-uv@v5
      - name: Install Python SDK
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - uses: ./.github/actions/setup-harness-leg
        with:
          native-artifact: harness-adapters-${{ runner.os }}
      - name: Sync Python uv environment
        working-directory: python
        run: uv sync --extra dev
      - uses: ./.github/actions/setup-pkc
        with:
          cache-key: pkc-python
      - name: Run python offline conformance vectors (pkc)
        env:
          HARNESS_REQUIRE: "1"
        run: pkc run --sdk python --tier offline --require
      - name: Upload python offline builds for cross-verification
        uses: actions/upload-artifact@v7
        with:
          name: pkc-builds-python
          path: harness/results/python/builds
          if-no-files-found: error
      - name: Run python offline conformance (protocol)
        working-directory: harness
        env:
          MPP_CONFORMANCE_LANGUAGES: python
          HARNESS_REQUIRE: "1"
        run: pnpm exec vitest run test/protocol-conformance.test.ts
      - name: Focused Python session harness
        working-directory: harness
        env:
          MPP_HARNESS_INTENTS: session
          MPP_HARNESS_SCENARIOS: session-basic
          MPP_HARNESS_CLIENTS: python-session
          MPP_HARNESS_SERVERS: python
        run: pnpm exec vitest run test/e2e.test.ts
      - name: Focused TS-to-Python harness
        working-directory: harness
        env:
          MPP_HARNESS_CLIENTS: typescript
          MPP_HARNESS_SERVERS: python
        run: pnpm exec vitest run test/e2e.test.ts
      - name: Focused Rust-to-Python harness
        working-directory: harness
        env:
          MPP_HARNESS_CLIENTS: rust
          MPP_HARNESS_SERVERS: python
        run: pnpm exec vitest run test/e2e.test.ts
      - name: Focused python-x402 -> rust/python x402 servers
        working-directory: harness
        env:
          MPP_HARNESS_INTENTS: x402-exact
          MPP_HARNESS_SCENARIOS: x402-exact-basic
          MPP_HARNESS_CLIENTS: python-x402
          MPP_HARNESS_SERVERS: rust-x402,python
          X402_HARNESS_CLIENTS: python-x402
          X402_HARNESS_SERVERS: rust-x402,python
        run: pnpm exec vitest run test/e2e.test.ts --testTimeout 180000

  ruby:
    name: "Harness: Ruby PayKit server (dual protocol)"
    needs: [build, build-native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ruby
      - uses: ./.github/actions/setup-harness-leg
        with:
          native-artifact: harness-adapters-${{ runner.os }}
      - uses: ./.github/actions/setup-pkc
        with:
          cache-key: pkc-ruby
      - name: Run ruby offline conformance vectors (pkc)
        env:
          HARNESS_REQUIRE: "1"
        run: pkc run --sdk ruby --tier offline --require
      - name: Run ruby offline conformance (protocol)
        working-directory: harness
        env:
          MPP_CONFORMANCE_LANGUAGES: ruby
          HARNESS_REQUIRE: "1"
        run: pnpm exec vitest run test/protocol-conformance.test.ts
      - name: Run harness smoke (mpp charge + x402 exact)
        working-directory: harness
        env:
          MPP_HARNESS_CLIENTS: typescript
          MPP_HARNESS_SERVERS: ruby,typescript
          MPP_HARNESS_INTENTS: charge,x402-exact
          X402_HARNESS_CLIENTS: rust-x402
          X402_HARNESS_SERVERS: ""
        run: pnpm exec vitest run test/e2e.test.ts --testNamePattern "ruby" --testTimeout 180000

  lua:
    name: "Harness: Lua focused matrix"
    needs: [build, build-native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install LuaJIT 2.1, LuaRocks, libsodium, openssl
        run: |
          # The hosted runner's unrelated Chrome apt index can briefly serve a
          # stale hash and block installation of Ubuntu-hosted Lua packages.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y luajit libluajit-5.1-dev luarocks libsodium-dev libssl-dev
          luajit -v
      - name: Cache rocks tree
        id: cache-rocks
        uses: actions/cache@v4
        with:
          path: lua/lua_modules
          key: ${{ runner.os }}-luarocks-runtime-v3-${{ hashFiles('lua/pay-kit-dev-1.rockspec', 'lua/.luacov', 'lua/.luacheckrc') }}
          restore-keys: ${{ runner.os }}-luarocks-runtime-v3-
      - name: Install runtime rocks
        if: steps.cache-rocks.outputs.cache-hit != 'true'
        working-directory: lua
        run: |
          mkdir -p lua_modules
          luarocks --lua-version=5.1 init --lua-versions 5.1 || true
          luarocks --lua-version=5.1 install --tree lua_modules luasocket
          luarocks --lua-version=5.1 install --tree lua_modules luasodium
          luarocks --lua-version=5.1 install --tree lua_modules luasec OPENSSL_DIR=/usr
          luarocks --lua-version=5.1 install --tree lua_modules lua-resty-openssl
          luarocks --lua-version=5.1 install --tree lua_modules lua-cjson
      - uses: ./.github/actions/setup-harness-leg
        with:
          native-artifact: harness-adapters-${{ runner.os }}
      - uses: ./.github/actions/setup-pkc
        with:
          cache-key: pkc-lua
      - name: Run lua offline conformance vectors (pkc)
        env:
          HARNESS_REQUIRE: "1"
        run: pkc run --sdk lua --tier offline --require
      - name: Run lua offline conformance (protocol)
        working-directory: harness
        env:
          MPP_CONFORMANCE_LANGUAGES: lua
          HARNESS_REQUIRE: "1"
        run: pnpm exec vitest run test/protocol-conformance.test.ts
      - name: TS-to-Lua focused matrix
        working-directory: harness
        env:
          MPP_HARNESS_CLIENTS: typescript
          MPP_HARNESS_SERVERS: lua
          MPP_HARNESS_SCENARIOS: charge-basic,charge-split-ata,charge-network-mismatch,charge-cross-route-replay
        run: pnpm exec vitest run test/e2e.test.ts --testNamePattern "typescript client pays lua server"
      - name: Rust-to-Lua focused matrix
        working-directory: harness
        env:
          MPP_HARNESS_CLIENTS: rust
          MPP_HARNESS_SERVERS: lua
          MPP_HARNESS_SCENARIOS: charge-basic,charge-split-ata
        run: pnpm exec vitest run test/e2e.test.ts --testNamePattern "rust client pays lua server"
      - name: Run PayKit harness smoke (mpp charge + x402 exact)
        working-directory: harness
        env:
          MPP_HARNESS_CLIENTS: typescript
          MPP_HARNESS_SERVERS: lua,typescript
          MPP_HARNESS_INTENTS: charge,x402-exact
          X402_HARNESS_CLIENTS: rust-x402
          X402_HARNESS_SERVERS: ""
        run: pnpm exec vitest run test/e2e.test.ts --testNamePattern "lua" --testTimeout 180000

  php:
    name: "Harness: PHP"
    needs: [build, build-native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - uses: ./.github/actions/setup-harness-leg
        with:
          native-artifact: harness-adapters-${{ runner.os }}
      - name: Install PHP harness dependencies
        working-directory: php
        run: composer install --no-interaction --no-progress
      - uses: ./.github/actions/setup-pkc
        with:
          cache-key: pkc-php
      - name: Run php offline conformance vectors (pkc)
        env:
          HARNESS_REQUIRE: "1"
        run: pkc run --sdk php --tier offline --require
      - name: Run php offline conformance (protocol)
        working-directory: harness
        env:
          MPP_CONFORMANCE_LANGUAGES: php
          HARNESS_REQUIRE: "1"
        run: pnpm exec vitest run test/protocol-conformance.test.ts
      - name: Run PHP server harness smoke
        working-directory: harness
        run: pnpm exec vitest run test/e2e.test.ts --testNamePattern "typescript client pays php server"
        env:
          MPP_HARNESS_CLIENTS: typescript
          MPP_HARNESS_SERVERS: php
          MPP_HARNESS_SCENARIOS: charge-basic,charge-split-ata,charge-network-mismatch,charge-cross-route-replay
      - name: Run Rust client PHP server harness smoke
        working-directory: harness
        run: pnpm exec vitest run test/e2e.test.ts --testNamePattern "rust client pays php server"
        env:
          MPP_HARNESS_CLIENTS: rust
          MPP_HARNESS_SERVERS: php
          MPP_HARNESS_SCENARIOS: charge-basic,charge-split-ata
      - name: Run PayKit harness smoke (mpp charge + x402 exact)
        working-directory: harness
        env:
          MPP_HARNESS_CLIENTS: typescript
          MPP_HARNESS_SERVERS: php,typescript
          MPP_HARNESS_INTENTS: charge,x402-exact
          X402_HARNESS_CLIENTS: rust-x402
          X402_HARNESS_SERVERS: ""
        run: pnpm exec vitest run test/e2e.test.ts --testNamePattern "php server" --testTimeout 180000

  swift:
    name: "Harness: Swift client to TypeScript + Rust servers"
    needs: [build, build-native]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-harness-leg
        with:
          native-artifact: harness-adapters-${{ runner.os }}
      - uses: ./.github/actions/setup-pkc
        with:
          cache-key: pkc-swift
      - name: Run swift offline conformance vectors (pkc)
        env:
          HARNESS_REQUIRE: "1"
        run: pkc run --sdk swift --tier offline --require
      - name: Upload swift offline builds for cross-verification
        uses: actions/upload-artifact@v7
        with:
          name: pkc-builds-swift
          path: harness/results/swift/builds
          if-no-files-found: error
      - name: Run Swift client harness smoke against TypeScript server
        working-directory: harness
        env:
          MPP_HARNESS_CLIENTS: swift
          MPP_HARNESS_SERVERS: typescript
        run: pnpm exec vitest run test/e2e.test.ts --testNamePattern "swift client pays typescript server"
      - name: Run Swift client harness smoke against Rust server
        working-directory: harness
        env:
          MPP_HARNESS_CLIENTS: swift
          MPP_HARNESS_SERVERS: rust
        run: pnpm exec vitest run test/e2e.test.ts --testNamePattern "swift client pays rust server"

  swift-x402:
    name: "Harness: Swift x402 client to Rust x402 server"
    needs: [build, build-native]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-harness-leg
        with:
          native-artifact: harness-adapters-${{ runner.os }}
      - name: Run Swift x402 client harness against Rust x402 server
        working-directory: harness
        env:
          MPP_HARNESS_CLIENTS: ""
          MPP_HARNESS_SERVERS: ""
          MPP_HARNESS_INTENTS: x402-exact
          MPP_HARNESS_SCENARIOS: x402-exact-basic
          X402_HARNESS_CLIENTS: swift-x402
          X402_HARNESS_SERVERS: rust-x402
        run: pnpm exec vitest run test/e2e.test.ts --testNamePattern "swift-x402 client pays rust-x402 server" --testTimeout 180000

  kotlin:
    name: "Harness: Kotlin client to TypeScript server"
    needs: [build, build-native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: ./.github/actions/setup-harness-leg
        with:
          native-artifact: harness-adapters-${{ runner.os }}
      - uses: ./.github/actions/setup-pkc
        with:
          cache-key: pkc-kotlin
      - name: Run kotlin offline conformance vectors (pkc)
        env:
          HARNESS_REQUIRE: "1"
        run: pkc run --sdk kotlin --tier offline --require
      - name: Run Kotlin client harness smoke
        working-directory: harness
        run: pnpm exec vitest run test/e2e.test.ts --testNamePattern "kotlin client pays typescript server" --testTimeout 180000
        env:
          MPP_HARNESS_CLIENTS: kotlin
          MPP_HARNESS_SERVERS: typescript

  kotlin-x402:
    name: "Harness: Kotlin x402 client to Rust x402 server"
    needs: [build, build-native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: ./.github/actions/setup-harness-leg
        with:
          native-artifact: harness-adapters-${{ runner.os }}
      - name: Run Kotlin x402 client to Rust x402 server harness
        working-directory: harness
        env:
          MPP_HARNESS_CLIENTS: ""
          MPP_HARNESS_SERVERS: ""
          MPP_HARNESS_INTENTS: x402-exact
          X402_HARNESS_CLIENTS: kotlin-x402
          X402_HARNESS_SERVERS: rust-x402
        run: pnpm exec vitest run test/e2e.test.ts --testNamePattern "kotlin-x402 client pays rust-x402 server" --testTimeout 180000

  # Real on-chain settlement gate: forks mainnet (surfpool 1.4) and executes the
  # deployed payment-channels program, so a green run proves settlement actually
  # lands on-chain (the byte-shape harness above cannot). Needs @solana/pay-kit
  # built (the on-chain suite imports it) and a mainnet RPC to fork from.
  rust-conformance:
    name: "Harness: Rust offline conformance"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # pkc req-lint reads the pinned spec repositories
          # (external/mpp-specs, typescript/external/x402).
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-${{ runner.arch }}-harness-conformance-${{ hashFiles('rust/**/Cargo.toml', 'rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-harness-conformance-
      - name: Conformance case registry (one positive-control test per case)
        working-directory: rust
        run: cargo test -q -p paykit-conformance
      - name: Vectors are filled from the registry (pkc fill --check)
        working-directory: rust
        run: cargo run -q -p paykit-conformance --bin pkc -- fill --check
      - name: Requirements lint (pkc req-lint)
        working-directory: rust
        # Prints sentence / mapped / unmapped counts; fails only when a vector
        # or RULINGS quote is missing from the pinned text or a mapped
        # requirement's text changed.
        run: cargo run -q -p paykit-conformance --bin pkc -- req-lint
      - uses: ./.github/actions/setup-harness-leg
      - name: Build Rust conformance runners
        working-directory: rust
        # Same feature sets as harness/protocol-runners/rust.json and
        # harness/runners/rust.json, so `cargo run` in the drivers reuses these.
        run: |
          cargo build -q -p solana-pay-kit --example protocol_runner
          cargo build -q -p solana-pay-kit --features mpp,x402,client,server,testkit --example vector_runner
          cargo build -q -p paykit-conformance --bin pkc
      - name: Run rust offline conformance vectors (pkc)
        working-directory: rust
        env:
          HARNESS_REQUIRE: "1"
        run: cargo run -q -p paykit-conformance --bin pkc -- run --sdk rust --tier offline --require
      - name: Upload rust offline builds for cross-verification
        uses: actions/upload-artifact@v7
        with:
          name: pkc-builds-rust
          path: harness/results/rust/builds
          if-no-files-found: error
      - name: Run rust offline conformance (protocol)
        working-directory: harness
        env:
          MPP_CONFORMANCE_LANGUAGES: rust
          HARNESS_REQUIRE: "1"
        run: pnpm exec vitest run test/protocol-conformance.test.ts

  # Offline cross-verification gate (DESIGN.md §3.9): every client's saved
  # builds, uploaded by its offline leg above, verified by every server SDK,
  # each cell reconciled against harness/expectations/<server>.toml
  # (`cross/<case>/<client>/<server>`). Builds arrive as artifacts rather
  # than being rebuilt here, because the Swift client only runs on macOS;
  # this job installs the server toolchains only. --require fails when a
  # promised client build is missing, so a dropped artifact cannot pass.
  cross:
    name: "Harness: offline cross-verification (every client x every server)"
    needs: [build, build-native, ts, go, python, swift, rust-conformance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ruby
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - name: Install LuaJIT 2.1, LuaRocks, libsodium, openssl
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y luajit libluajit-5.1-dev luarocks libsodium-dev libssl-dev
      - name: Cache rocks tree
        id: cache-rocks
        uses: actions/cache@v4
        with:
          path: lua/lua_modules
          key: ${{ runner.os }}-luarocks-runtime-v3-${{ hashFiles('lua/pay-kit-dev-1.rockspec', 'lua/.luacov', 'lua/.luacheckrc') }}
          restore-keys: ${{ runner.os }}-luarocks-runtime-v3-
      - name: Install runtime rocks
        if: steps.cache-rocks.outputs.cache-hit != 'true'
        working-directory: lua
        run: |
          mkdir -p lua_modules
          luarocks --lua-version=5.1 init --lua-versions 5.1 || true
          luarocks --lua-version=5.1 install --tree lua_modules luasocket
          luarocks --lua-version=5.1 install --tree lua_modules luasodium
          luarocks --lua-version=5.1 install --tree lua_modules luasec OPENSSL_DIR=/usr
          luarocks --lua-version=5.1 install --tree lua_modules lua-resty-openssl
          luarocks --lua-version=5.1 install --tree lua_modules lua-cjson
      - uses: ./.github/actions/setup-harness-leg
        with:
          native-artifact: harness-adapters-${{ runner.os }}
          pay-kit-dist: "true"
      - name: Install server SDK dependencies
        run: |
          (cd typescript && pnpm install --frozen-lockfile)
          (cd python && uv sync --extra dev)
          (cd php && composer install --no-interaction --no-progress)
      - uses: ./.github/actions/setup-pkc
        with:
          cache-key: pkc-cross
      - name: Build the Rust vector runner
        working-directory: rust
        run: cargo build -q -p solana-pay-kit --features mpp,x402,client,server,testkit --example vector_runner
      - name: Download every client's offline builds
        uses: actions/download-artifact@v7
        with:
          pattern: pkc-builds-*
          path: .pkc-builds
      - name: Place builds under harness/results/<sdk>/builds
        run: |
          set -euo pipefail
          for dir in .pkc-builds/pkc-builds-*; do
            sdk="${dir##*/pkc-builds-}"
            mkdir -p "harness/results/$sdk"
            mv "$dir" "harness/results/$sdk/builds"
          done
          ls harness/results
      - name: Cross-verify every build on every server (pkc)
        run: pkc run --cross --require --check

  onchain:
    name: "Harness: on-chain settlement (mainnet fork)"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: mpp-dist
          path: typescript/packages/mpp/dist
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - name: Build @solana/pay-kit against prebuilt MPP
        working-directory: typescript
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @solana/pay-kit build
      - name: Install harness
        working-directory: harness
        run: pnpm install --frozen-lockfile
      - name: Run on-chain settlement suite
        working-directory: harness
        env:
          # surfpool forks mainnet account state from this datasource RPC (the
          # same secret the rest of the surfpool CI uses); the suite itself talks
          # to the surfpool instance. The helper falls back to public mainnet when
          # the secret is unavailable (e.g. fork PRs).
          SURFPOOL_DATASOURCE_RPC_URL: ${{ secrets.SURFPOOL_DATASOURCE_RPC_URL }}
        run: pnpm test:onchain

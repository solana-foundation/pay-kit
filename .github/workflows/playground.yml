name: Playground

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  # Path filter: a PR that touches none of these skips the jobs below
  # (skipped jobs satisfy required checks); pushes and calls run them all.
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'playground/**'
              - 'typescript/**'
              - 'html/**'
              - 'harness/start-surfnet-proxy.mjs'
              - '.github/**'

  smoke:
    name: smoke
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: |
            typescript/pnpm-lock.yaml
            playground/pnpm-lock.yaml
      - name: Install playground dependencies
        working-directory: playground
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        working-directory: playground
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify playground renders
        working-directory: playground
        run: pnpm exec playwright test --config playwright.smoke.config.ts

  e2e:
    name: e2e
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: |
            typescript/pnpm-lock.yaml
            playground/pnpm-lock.yaml
      - name: Install Surfnet helper dependencies
        working-directory: harness
        run: pnpm install --frozen-lockfile
      - name: Start Surfnet
        env:
          # Fork mainnet, as `surfpool start` does locally: the local,
          # single-instance RPC gets the payment-channel and subscription
          # programs without the hosted load balancer's cross-request
          # blockhash races. A fork of the hosted sandbox (402.surfnet.dev)
          # intermittently drops token accounts the faucet sets with
          # cheatcodes, failing a random paid scenario with InvalidAccountData.
          # PLAYGROUND_FORK_RPC_URL overrides the datasource (e.g. a keyed RPC).
          SURFPOOL_REMOTE_RPC_URL: ${{ vars.PLAYGROUND_FORK_RPC_URL || 'https://api.mainnet-beta.solana.com' }}
        run: |
          node harness/start-surfnet-proxy.mjs > "$RUNNER_TEMP/surfnet.log" 2>&1 &
          surfnet_pid=$!
          # Forked startup can take longer than the offline payment-link jobs.
          deadline=$((SECONDS + 120))
          while (( SECONDS < deadline )); do
            if ! kill -0 "$surfnet_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/surfnet.log"
              exit 1
            fi
            if curl --max-time 2 -sf -X POST http://localhost:8899 \
              -H "Content-Type: application/json" \
              -d '{"jsonrpc":"2.0","id":1,"method":"getHealth","params":[]}' \
              | grep -q '"result":"ok"'; then
              cat "$RUNNER_TEMP/surfnet.log"
              exit 0
            fi
            sleep 1
          done
          echo "Surfnet did not become healthy in 120s; startup log:"
          cat "$RUNNER_TEMP/surfnet.log"
          exit 1
      # The credit-funded session card runs on the hook-enabled channel
      # program and the reference credit provider (payment-channels#112).
      - name: Credit-provider programs (cached by ref)
        id: credit-programs
        uses: ./.github/actions/build-credit-provider
      - name: Install branch TypeScript dependencies
        working-directory: typescript
        run: pnpm install --frozen-lockfile
      - name: Build branch SDK
        working-directory: typescript
        run: pnpm build
      - name: Install playground dependencies
        working-directory: playground
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        working-directory: playground
        run: pnpm exec playwright install --with-deps chromium
      - name: Run all playground payment patterns
        working-directory: playground
        run: pnpm test:e2e
        env:
          PLAYGROUND_DISABLE_SIDECAR: "1"
          RPC_URL: http://localhost:8899
          VITE_RPC_URL: http://localhost:8899
          PAYMENT_CHANNELS_V2_SO: ${{ steps.credit-programs.outputs.channel-so }}
          CREDIT_PROVIDER_SO: ${{ steps.credit-programs.outputs.provider-so }}
          # Fail, rather than skip, when the card is not enabled.
          PLAYGROUND_REQUIRE_CREDITS: "1"
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playground-playwright-report
          path: |
            playground/playwright-report/
            playground/test-results/
          if-no-files-found: ignore

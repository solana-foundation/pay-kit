name: Kotlin

permissions:
  contents: read

on:
  push:
    branches: [main]
  workflow_call:

jobs:
  test-kotlin:
    name: Kotlin tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          gradle-version: "9.5.1"
      - name: Run tests with coverage
        working-directory: kotlin
        # `gradle check` runs test + jacocoTestReport +
        # jacocoTestCoverageVerification so the 90 percent line-coverage
        # gate is enforced in CI (previous `gradle test jacocoTestReport`
        # generated the report without enforcing the gate).
        run: gradle check
      - name: Upload Kotlin coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kotlin-coverage
          path: |
            kotlin/build/reports/jacoco/test/jacocoTestReport.xml
            kotlin/build/reports/jacoco/test/html/
          if-no-files-found: ignore

  harness-kotlin:
    name: "Harness: Kotlin client to TypeScript server"
    needs: test-kotlin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          gradle-version: "9.5.1"
      - uses: ./.github/actions/setup-harness
      - name: Build the Kotlin conformance runner
        working-directory: harness/kotlin-conformance
        run: gradle installDist --no-daemon
      - name: Run Kotlin cross-SDK conformance vectors
        working-directory: harness
        env:
          MPP_CONFORMANCE_LANGUAGES: kotlin
        run: pnpm exec vitest run test/conformance.test.ts
      - name: Pre-warm Gradle for the Kotlin harness client
        working-directory: harness/kotlin-client
        run: gradle installDist --no-daemon
      # Selection is by the MPP_HARNESS_* env selectors alone; assert-run-count
      # pins the executed pair count so a title rename or selector typo that runs
      # zero payment tests fails loud instead of exiting green on a skip.
      - name: Run Kotlin client harness smoke
        working-directory: harness
        run: |
          pnpm exec vitest run test/e2e.test.ts --testTimeout 180000 --reporter=default --reporter=json --outputFile=vitest-report.json
          node scripts/assert-run-count.mjs --report vitest-report.json --exact 7
        env:
          MPP_HARNESS_CLIENTS: kotlin
          MPP_HARNESS_SERVERS: typescript

  harness-kotlin-x402:
    name: "Harness: Kotlin x402 client to Rust x402 server"
    needs: test-kotlin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          gradle-version: "9.5.1"
      - uses: ./.github/actions/setup-harness
        with:
          cargo-bins: "paykit-harness-bins:x402_harness_server"
          cargo-cache-key: kotlin-x402
      # Pre-warm the Kotlin x402 client install so the harness adapter
      # (harness/src/implementations.ts → kotlin-x402) can launch the
      # script at build/install/.../bin/. The kotlin SDK is consumed via
      # the composite build, so this also compiles the SDK.
      - name: Pre-warm Gradle for the Kotlin x402 harness client
        working-directory: harness/kotlin-x402-client
        run: gradle installDist --no-daemon
      # Real harness: the e2e harness boots an in-process Surfpool, funds
      # the client wallet + USDC ATA, starts the rust-x402 server, runs the
      # kotlin-x402 client against it for the x402-exact intent, and asserts
      # HTTP 200 plus the on-chain recipient balance delta. MPP charge
      # adapters are disabled so only the x402-exact matrix slice runs.
      - name: Run Kotlin x402 client to Rust x402 server harness
        working-directory: harness
        env:
          MPP_HARNESS_CLIENTS: ""
          MPP_HARNESS_SERVERS: ""
          MPP_HARNESS_INTENTS: x402-exact
          X402_HARNESS_CLIENTS: kotlin-x402
          X402_HARNESS_SERVERS: rust-x402
        # As with swift-x402: the x402-exact matrix also enables the default php /
        # go x402 servers this leg does not build, so the kotlin-x402 -> rust-x402
        # pair is selected by title; assert-run-count pins that single pair.
        run: |
          pnpm exec vitest run test/e2e.test.ts --testNamePattern "kotlin-x402 client pays rust-x402 server" --testTimeout 180000 --reporter=default --reporter=json --outputFile=vitest-report.json
          node scripts/assert-run-count.mjs --report vitest-report.json --exact 1

name: Kotlin

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  # Path filter: a PR that touches none of these skips the jobs below
  # (skipped jobs satisfy required checks); pushes and calls run them all.
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'kotlin/**'
              - '.github/**'

  test-kotlin:
    name: test
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.1"
      - name: Run tests with coverage
        working-directory: kotlin
        # `gradle check` runs test + jacocoTestReport +
        # jacocoTestCoverageVerification so the 90 percent line-coverage
        # gate is enforced in CI (previous `gradle test jacocoTestReport`
        # generated the report without enforcing the gate).
        run: gradle check
      - name: Upload Kotlin coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kotlin-coverage
          path: |
            kotlin/build/reports/jacoco/test/jacocoTestReport.xml
            kotlin/build/reports/jacoco/test/html/
          if-no-files-found: ignore

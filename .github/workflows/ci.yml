name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      run_typescript:
        description: Run TypeScript and Node-based core verification.
        required: false
        type: boolean
        default: true
      run_rust:
        description: Run Rust core verification.
        required: false
        type: boolean
        default: true
      run_harness:
        description: Run the broad cross-SDK harness verification.
        required: false
        type: boolean
        default: true

defaults:
  run:
    working-directory: typescript

jobs:
  audit:
    name: Audit
    if: ${{ github.event_name == 'push' || inputs.run_typescript || inputs.run_harness }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          package_json_file: package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --production

  lint:
    name: Lint & Format
    if: ${{ github.event_name == 'push' || inputs.run_typescript || inputs.run_harness }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          package_json_file: package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # @solana/pay-kit resolves @solana/mpp through its dist exports, so the
      # type-aware lint rules need the package built first.
      - run: pnpm --filter @solana/mpp build
      - run: pnpm lint
      - run: pnpm format:check
      # Repo-hygiene guards for two audit-class regressions no other gate
      # catches: audit finding IDs left in shipped source, and dependency
      # overrides stranded in package.json's pnpm field (ignored by pnpm v10).
      - name: Repo hygiene guards
        working-directory: .
        run: bash scripts/check-repo-hygiene.sh
      - name: Repo hygiene guard self-test
        working-directory: .
        run: bash scripts/check-repo-hygiene_test.sh
      # Exercise the publish-workflow least-privilege / release-gating guard on
      # every PR, not only on a publish dispatch: the guard's "real workflows
      # pass, reverted fixtures fail" proof otherwise ran only on a developer's
      # machine.
      - name: Publish workflow guard self-test
        working-directory: .
        run: bash scripts/check-publish-workflow-guards_test.sh

  typecheck:
    name: Typecheck
    if: ${{ github.event_name == 'push' || inputs.run_typescript || inputs.run_harness }}
    needs: build-html
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          package_json_file: package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - name: Download HTML assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: html-assets
      - run: pnpm install --frozen-lockfile
      # @solana/pay-kit resolves @solana/mpp through its dist exports.
      - run: pnpm --filter @solana/mpp build
      - run: pnpm typecheck

  test-ts:
    name: TypeScript tests
    if: ${{ github.event_name == 'push' || inputs.run_typescript || inputs.run_harness }}
    needs: build-html
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          package_json_file: package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - name: Download HTML assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: html-assets
      - run: pnpm install --frozen-lockfile

      # @solana/pay-kit's tests import @solana/mpp through its dist exports.
      - run: pnpm --filter @solana/mpp build

      # Run ALL tests (unit + surfpool integration) with coverage
      - name: Run tests with coverage
        run: pnpm vitest run --coverage --config vitest.config.ci.ts
        env:
          # Reliable RPC datasource for the embedded surfnet (see the Rust job).
          SURFPOOL_DATASOURCE_RPC_URL: ${{ secrets.SURFPOOL_DATASOURCE_RPC_URL }}

      - name: Upload TS coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ts-coverage
          path: typescript/coverage/coverage-summary.json

      - name: Upload TS surfpool report data
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: surfpool-reports-ts
          path: typescript/target/surfpool-reports/
          if-no-files-found: ignore

  typescript-conformance:
    name: TypeScript real verifier conformance
    if: ${{ github.event_name == 'push' || inputs.run_typescript }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: ./.github/actions/setup-harness
      - name: Run TypeScript cross-SDK conformance vectors
        working-directory: harness
        env:
          MPP_CONFORMANCE_LANGUAGES: typescript
        run: pnpm exec vitest run test/conformance.test.ts
      - name: Run TypeScript protocol conformance vectors
        working-directory: harness
        env:
          MPP_CONFORMANCE_LANGUAGES: typescript
        run: pnpm exec vitest run test/protocol-conformance.test.ts

  rust-conformance:
    name: Rust real verifier conformance
    if: ${{ github.event_name == 'push' || inputs.run_rust }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: ./.github/actions/setup-harness
      # Gate self-activation: this leg drives the REAL Rust verifier through the
      # conformance_runner / protocol_runner cargo examples, which land with the
      # rust hardening leaf of the #216 redelivery cascade. Until that leaf is in
      # this tree the subjects do not exist, so the gate reports itself pending
      # (loudly) instead of failing on a subject it cannot exercise. The harness
      # leaf seals the end state: it asserts these example files exist, so the
      # gate cannot silently stay off once the cascade lands.
      - name: Detect Rust conformance runner (gate activates with its subject)
        id: rust_runner
        run: |
          if [ -f rust/crates/kit/examples/conformance_runner.rs ] && [ -f rust/crates/kit/examples/protocol_runner.rs ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Rust conformance gate pending::conformance_runner/protocol_runner examples are not in this tree yet; the gate activates when the rust hardening leaf lands."
          fi
      - name: Build Rust conformance runner once
        if: steps.rust_runner.outputs.present == 'true'
        working-directory: rust
        run: |
          cargo build --locked -p solana-pay-kit --example conformance_runner --features x402,client
          cargo build --locked -p solana-pay-kit --example protocol_runner --features mpp
      - name: Run Rust cross-SDK conformance vectors
        if: steps.rust_runner.outputs.present == 'true'
        working-directory: harness
        env:
          MPP_CONFORMANCE_LANGUAGES: rust
        run: pnpm exec vitest run test/conformance.test.ts
      - name: Run Rust protocol conformance vectors
        if: steps.rust_runner.outputs.present == 'true'
        working-directory: harness
        env:
          MPP_CONFORMANCE_LANGUAGES: rust
        run: pnpm exec vitest run test/protocol-conformance.test.ts

  build-html:
    name: Build HTML payment link assets
    if: ${{ github.event_name == 'push' || inputs.run_typescript || inputs.run_rust || inputs.run_harness }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install and build
        working-directory: html
        # Frozen, script-free install: esbuild (used by the build via tsx)
        # resolves its platform binary from @esbuild/<platform> without a
        # postinstall script, so --ignore-scripts leaves the build working.
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Verify committed gen files are up to date
        working-directory: .
        run: |
          if ! git diff --quiet -- rust/crates/kit/src/mpp/server/html/ go/protocols/mpp/server/html/ lua/pay_kit/protocols/mpp/server/html_assets/ python/src/pay_kit/protocols/mpp/server/html/; then
            echo "::error::Generated files are out of date. Run 'just html-build' and commit the results."
            git diff --stat -- rust/crates/kit/src/mpp/server/html/ go/protocols/mpp/server/html/ lua/pay_kit/protocols/mpp/server/html_assets/ python/src/pay_kit/protocols/mpp/server/html/
            exit 1
          fi
      - name: Upload HTML build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: html-assets
          path: |
            html/dist/
            rust/crates/kit/src/mpp/server/html/
            go/protocols/mpp/server/html/
            lua/pay_kit/protocols/mpp/server/html_assets/
            python/src/pay_kit/protocols/mpp/server/html/
            typescript/packages/mpp/src/server/html-assets.gen.ts

  # Codama regen-diff gate: re-render every payment-channels client (Rust,
  # Go, TypeScript, Python) from the pinned IDL + pinned renderers and fail
  # if the committed trees differ. Catches hand-edits to generated code and
  # renderer/IDL drift that would silently desynchronize the SDKs' view of
  # the on-chain program.
  payment-channels-regen:
    name: Payment-channels generated clients in sync
    if: ${{ github.event_name == 'push' || inputs.run_typescript || inputs.run_rust || inputs.run_harness }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          package_json_file: skills/pay-sdk-implementation/codegen/package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          package-manager-cache: false
      - uses: taiki-e/install-action@c6d51ded7cde3c421f6cd6046cd601f2248f3710
        with:
          tool: just
      # The TS recipe formats the rendered client with the repo prettier.
      - name: Install typescript workspace deps
        working-directory: typescript
        run: pnpm install --frozen-lockfile
      - name: Regenerate payment-channels clients from the pinned IDL
        run: just payment-channels-sync
      - name: Verify committed generated clients match the renderer output
        run: |
          TREES=(
            idl/payment-channels.json
            rust/crates/kit/src/generated/payment_channels/
            typescript/packages/mpp/src/generated/payment-channels/
            go/protocols/programs/paymentchannels/
            python/src/solana_pay_kit/protocols/programs/paymentchannels/
          )
          if [ -n "$(git status --porcelain -- "${TREES[@]}")" ]; then
            echo "::error::Generated payment-channels clients are out of date or hand-edited. Run 'just payment-channels-sync' and commit the results."
            git status --porcelain -- "${TREES[@]}"
            git diff --stat -- "${TREES[@]}"
            exit 1
          fi

  test-rust:
    name: Rust tests
    if: ${{ github.event_name == 'push' || inputs.run_rust }}
    needs: build-html
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@c6d51ded7cde3c421f6cd6046cd601f2248f3710 # cargo-llvm-cov
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-rust-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-rust-
      - name: Download HTML assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: html-assets

      - name: Run tests with coverage
        working-directory: rust
        env:
          # Reliable RPC datasource for the embedded surfnet — without it the
          # surfpool integration tests clone from the public mainnet-beta RPC,
          # which rate-limits and crashes surfnet mid-test in CI.
          SURFPOOL_DATASOURCE_RPC_URL: ${{ secrets.SURFPOOL_DATASOURCE_RPC_URL }}
        # One instrumented run; the gate below enforces both aggregate AND
        # per-file line + region floors from its per-file data. Excluded: the
        # surfpool/litesvm integration tests (`paykit-integration-tests`), the
        # unpublished harness bins, the multi_delegate client (drives only the
        # on-chain program), the Codama-autogenerated clients under src/generated/
        # ("DO NOT EDIT"), and the test-only mock JSON-RPC server used to cover the
        # settlement broadcast paths. src/mpp/program/ and src/x402/ are BOTH
        # inside the floor now (x402 was previously excluded/under-covered); the
        # settle-family account layout is additionally pinned by
        # settle_family_account_layout_golden.
        run: cargo llvm-cov --locked -p solana-pay-kit -p paykit-integration-tests --ignore-filename-regex 'crates/integration-tests/|crates/harness-bins/|client/multi_delegate|src/generated/|x402/server/mock_rpc.rs' --json --output-path coverage.json

      # Library tests for the x402 module — a fast targeted run for the loose-402
      # challenge regression suite (`to_accepted_value_patches_loose_*`) that
      # catches resource servers emitting non-canonical Solana x402 `accepted`
      # blocks (missing `scheme`, bare network slug, missing `maxTimeoutSeconds`).
      - name: Run solana-pay-kit x402 library tests
        working-directory: rust
        run: cargo test --locked -p solana-pay-kit --lib x402 --features server,client

      # Gate self-activation: the mature coverage gate (scripts/check-rust-coverage.py,
      # with source-scope inventory + owned per-file exemptions + its own self-test)
      # lands with the rust/harness hardening leaves of the #216 redelivery cascade.
      # The inline floor this step used to carry is red against the pre-hardening
      # tree — a permanently red gate blocks every PR while protecting nothing — so
      # the step now runs the mature gate when its subject exists and reports itself
      # pending (loudly) until then. The harness leaf seals the end state by
      # asserting the script exists, so the floor cannot silently stay off.
      - name: Enforce Rust coverage floors (mpp + x402, line + region, aggregate + per-file)
        working-directory: rust
        run: |
          if [ -f ../scripts/check-rust-coverage.py ]; then
            python3 ../scripts/check-rust-coverage.py coverage.json --aggregate-floor 90 --per-file-floor 90
          else
            echo "::notice title=Rust coverage gate pending::scripts/check-rust-coverage.py is not in this tree yet; the coverage floor gate activates when the rust hardening leaf lands."
          fi

      - name: Rust format check
        working-directory: rust
        run: cargo fmt --check

      # Deny-warnings clippy over all targets and every kit feature except
      # litesvm-tests, which deliberately requires an undeclared
      # dev-dependency and therefore cannot build (see the feature's
      # comment in crates/kit/Cargo.toml) — the one reason this is not
      # simply --all-features.
      - name: Rust clippy (deny warnings)
        working-directory: rust
        run: |
          cargo clippy --locked -p solana-pay-kit --all-targets --features mpp,x402,server,client,axum,gcp_kms,confidential,worker,testkit,fetch,otel -- -D warnings
          cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Upload Rust coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-coverage
          path: rust/coverage.json

      - name: Upload Rust surfpool report data
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: surfpool-reports-rust
          path: rust/target/surfpool-reports/
          if-no-files-found: ignore

  # Go tests, lint, coverage, and harness live in the dedicated go.yml
  # workflow (called by the PR router or release gate). Kept out of
  # ci.yml so there is a single "Go tests" check rather than two.

  integration:
    name: Integration tests
    if: ${{ github.event_name == 'push' || inputs.run_typescript || inputs.run_harness }}
    needs: build-html
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          package_json_file: package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - name: Download HTML assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: html-assets
      - name: Install Surfnet helper dependencies
        working-directory: harness
        run: pnpm install --frozen-lockfile
      - name: Start Surfnet
        working-directory: .
        run: |
          node harness/start-surfnet-proxy.mjs &
          ready=0
          for i in $(seq 1 50); do
            if curl -sf -X POST http://localhost:8899 \
              -H "Content-Type: application/json" \
              -d '{"jsonrpc":"2.0","id":1,"method":"getHealth","params":[]}' \
              | grep -q '"result":"ok"'; then
              ready=1
              break
            fi
            sleep 0.2
          done
          test "$ready" -eq 1
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  test-payment-links-demo:
    name: "Payment links E2E: Playground (TypeScript)"
    if: ${{ github.event_name == 'push' || inputs.run_typescript || inputs.run_harness }}
    needs: build-html
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          package_json_file: package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - name: Download HTML assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: html-assets
      - name: Install Surfnet helper dependencies
        working-directory: harness
        run: pnpm install --frozen-lockfile
      - name: Start Surfnet
        working-directory: .
        run: |
          node harness/start-surfnet-proxy.mjs &
          ready=0
          for i in $(seq 1 50); do
            if curl -sf -X POST http://localhost:8899 \
              -H "Content-Type: application/json" \
              -d '{"jsonrpc":"2.0","id":1,"method":"getHealth","params":[]}' \
              | grep -q '"result":"ok"'; then
              ready=1
              break
            fi
            sleep 0.2
          done
          test "$ready" -eq 1
      - name: Install TypeScript dependencies
        working-directory: typescript
        run: pnpm install --frozen-lockfile
      - name: Build TypeScript SDK
        working-directory: typescript
        run: pnpm build
      - name: Install playground API dependencies
        working-directory: typescript/examples/playground-api
        run: pnpm install --frozen-lockfile
      - name: Install HTML dependencies & Playwright
        working-directory: html
        # Frozen, script-free install: the browser download runs via the
        # explicit `npx playwright install`, and esbuild resolves its platform
        # binary from @esbuild/<platform> without a postinstall script.
        run: npm ci --ignore-scripts && npx playwright install chromium
      - name: Start playground API
        working-directory: typescript/examples/playground-api
        run: npx tsx index.ts &
        env:
          NETWORK: localnet
          PLAYGROUND_DISABLE_SIDECAR: "1"
      - name: Wait for playground server
        working-directory: .
        run: |
          for i in $(seq 1 15); do
            curl -sf http://localhost:3000/api/v1/health && break
            sleep 1
          done
      - name: Run Playwright tests (Playground)
        working-directory: html
        run: npm run test:e2e:demo

  test-payment-links-rust:
    name: "Payment links E2E: Rust"
    if: ${{ github.event_name == 'push' || inputs.run_rust }}
    needs: build-html
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-rust-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-rust-
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          package_json_file: package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - name: Download HTML assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: html-assets
      - name: Install Surfnet helper dependencies
        working-directory: harness
        run: pnpm install --frozen-lockfile
      - name: Start Surfnet
        working-directory: .
        run: |
          node harness/start-surfnet-proxy.mjs &
          ready=0
          for i in $(seq 1 50); do
            if curl -sf -X POST http://localhost:8899 \
              -H "Content-Type: application/json" \
              -d '{"jsonrpc":"2.0","id":1,"method":"getHealth","params":[]}' \
              | grep -q '"result":"ok"'; then
              ready=1
              break
            fi
            sleep 0.2
          done
          test "$ready" -eq 1
      - name: Install HTML dependencies & Playwright
        working-directory: html
        # Frozen, script-free install: the browser download runs via the
        # explicit `npx playwright install`, and esbuild resolves its platform
        # binary from @esbuild/<platform> without a postinstall script.
        run: npm ci --ignore-scripts && npx playwright install chromium
      - name: Build Rust test server
        working-directory: rust
        run: cargo build --locked --example payment_link_server --features axum
      - name: Start Rust test server
        working-directory: rust
        run: cargo run --locked --example payment_link_server --features axum &
      - name: Wait for Rust server
        working-directory: .
        run: |
          for i in $(seq 1 15); do
            curl -sf http://localhost:3001/health && break
            sleep 1
          done
      - name: Run Playwright tests (Rust)
        working-directory: html
        run: npm run test:e2e:rust

  harness:
    name: "Harness: TypeScript harness"
    if: ${{ github.event_name == 'push' || inputs.run_harness }}
    needs: build-html
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Download HTML assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: html-assets
      - uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ruby
      - uses: ./.github/actions/setup-harness
        with:
          cargo-bins: "paykit-harness-bins:mpp_harness_client,mpp_harness_server"
          cargo-cache-key: ts
      # Gate self-activation: same subject rule as the rust-conformance job —
      # the runner examples arrive with the rust hardening leaf; until then the
      # Rust vector steps below report pending instead of failing on a missing
      # subject. The harness leaf asserts the examples exist in the end state.
      - name: Detect Rust conformance runner (gate activates with its subject)
        id: rust_runner
        run: |
          if [ -f rust/crates/kit/examples/conformance_runner.rs ] && [ -f rust/crates/kit/examples/protocol_runner.rs ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Rust conformance gate pending::conformance_runner/protocol_runner examples are not in this tree yet; the gate activates when the rust hardening leaf lands."
          fi
      - name: Build Rust conformance runner once
        if: steps.rust_runner.outputs.present == 'true'
        working-directory: rust
        run: |
          cargo build --locked -p solana-pay-kit --example conformance_runner --features x402,client
          cargo build --locked -p solana-pay-kit --example protocol_runner --features mpp
      # Always-on TypeScript conformance leg: the TS reference verifier in
      # harness/src/conformance/x402.ts is the oracle every other SDK's exact
      # verifier is pinned against, but no other workflow allowlists typescript,
      # so its x402 exact-reject fund-safety vectors never executed in CI. Run
      # them here on every push/PR so a drift or revert in the reference verifier
      # ships red.
      - name: Run TypeScript cross-SDK conformance vectors
        working-directory: harness
        env:
          MPP_CONFORMANCE_LANGUAGES: typescript
        run: pnpm exec vitest run test/conformance.test.ts
      # Cross-SDK conformance vectors for Rust: the REAL Rust structural exact
      # verifier (rust/crates/kit/src/x402/protocol/schemes/exact/verify.rs,
      # driven via the conformance_runner example ->
      # verify_exact_versioned_transaction) must execute the x402 exact-reject
      # fund-safety vectors, mirroring the go/ruby/python legs. This setup-harness
      # job already provisions the Rust stable toolchain + target cache (it builds
      # the cargo harness bins and runs the Rust e2e smoke below), so the example
      # compiles here without extra setup. Before this leg the only conformance
      # run in CI pinned MPP_CONFORMANCE_LANGUAGES=typescript, so the fund-safety
      # vectors -- including x402-exact-fee-payer-as-source-ata, the
      # fee-payer-owns-the-source-ATA drain guard (verify.rs:429-434) -- never
      # reached the Rust verifier and its guard could silently regress. RPC-free
      # and deterministic. A RED here is a real Rust verifier divergence -- fix it
      # in the x402 spine, do not skip.
      - name: Run Rust cross-SDK conformance vectors
        if: steps.rust_runner.outputs.present == 'true'
        working-directory: harness
        env:
          MPP_CONFORMANCE_LANGUAGES: rust
        run: pnpm exec vitest run test/conformance.test.ts
      # Cross-SDK mpp-PROTOCOL conformance through the real Rust protocol codec.
      # Known Rust divergences (empty-realm / empty-intent not rejected) are
      # tracked in KNOWN_RUNNER_DIVERGENCES[rust]; a RED is a NEW divergence.
      - name: Run Rust protocol conformance (canonical challenge/receipt vectors)
        if: steps.rust_runner.outputs.present == 'true'
        working-directory: harness
        env:
          MPP_CONFORMANCE_LANGUAGES: rust
        run: pnpm exec vitest run test/protocol-conformance.test.ts
      # protocol-conformance drives the canonical mpp-protocol vectors (challenge
      # WWW-Authenticate quoting, receipt parse, challenge parse) through the REAL
      # TS reference codec surface (@solana/mpp + mppx). It was CI-exempt, which hid
      # 6 real TS divergences (serialize quote/backslash truncation, missing CRLF /
      # empty-realm / empty-intent rejection, out-of-range receipt timestamps), all
      # now fixed at the @solana/mpp boundary. Pinned to typescript so the Node-only
      # job does not spawn absent uv/cargo/php runners; the in-process TS-reference
      # blocks run regardless of the pin. A RED here is a real canonical-protocol
      # divergence -- fix the codec at the boundary, do not skip.
      - name: Run TypeScript protocol conformance (canonical challenge/receipt vectors)
        working-directory: harness
        env:
          MPP_CONFORMANCE_LANGUAGES: typescript
        run: pnpm exec vitest run test/protocol-conformance.test.ts
      # Guard self-tests for the harness release-gate false-green killers
      # (assert-run-count run-count assertion, the on-chain gate, and the
      # passWithNoTests config). No other workflow runs the bare harness suite,
      # so a regression in the machinery that turns a zero-assertion run RED
      # would otherwise ship undetected.
      - name: Run harness gate self-tests
        working-directory: harness
        run: pnpm exec vitest run test/harness-gates.test.ts
      # The harness carries ~20 unit + defect-verifier suites that assert the
      # cross-SDK contract (x402 exact fund-safety defect vectors, session
      # voucher reject reasons, compute-budget caps, canonical bytes, the
      # enforced-coverage ledger, capability declarations) — but until now only
      # e2e / conformance / harness-gates ran by explicit path, so every one of
      # these guards was DEAD in CI: the safety net existed and never plugged in.
      # Run the self-contained suites on every push/PR. A RED here is the radar
      # catching a real SDK divergence (e.g. compute-budget-caps flags a verifier
      # that dropped a cap) — fix it in the owning SDK; do not skip the test.
      - name: Run harness unit + defect-verifier suites
        working-directory: harness
        run: |
          pnpm exec vitest run \
            test/x402-exact-defect-verify.test.ts \
            test/session-voucher-verify.test.ts \
            test/session-close-settle-verify.test.ts \
            test/coverage-shape.test.ts \
            test/vector-accounting.test.ts \
            test/regression-bank-coverage.test.ts \
            test/regression-bank.test.ts \
            test/compute-budget-caps.test.ts \
            test/canonical-json.test.ts \
            test/capabilities.test.ts \
            test/guards.test.ts \
            test/intent-selection.test.ts \
            test/adapter-identity.test.ts \
            test/x402-amount-base-units.test.ts \
            test/x402-v1-exact.test.ts \
            test/x402-upto-verify-open.test.ts \
            test/x402-upto-over-ceiling.test.ts \
            test/value-binding-verify.test.ts \
            test/boot-policy.test.ts \
            test/process.test.ts \
            test/flow-conformance.test.ts \
            test/ci-coverage-gate.test.ts \
            test/matrix-coverage-gate.test.ts
      # value-binding-verify drives the real @solana/mpp session verifier with
      # adversarial on-chain-binding vectors (unrelated-sig + inflated deposit +
      # recipients-vs-splits) — the integration radar for the fabricated-deposit
      # class. boot-policy asserts every SDK's server/adapter fails CLOSED when it
      # would default to an in-memory replay store off-localnet without the
      # PAY_KIT_ALLOW_INMEMORY_REPLAY_STORE opt-in; it self-skips any SDK whose
      # toolchain is absent in this Node job (Go/Python get full coverage in the
      # multi-toolchain harness.yml legs), so it degrades rather than false-greens.
      # Selection is by the MPP_HARNESS_* env selectors alone (the old free-text
      # --testNamePattern matched every one of these pairs, so it was redundant).
      # assert-run-count pins the executed pair count so a title rename or a
      # selector typo that runs fewer/zero payment tests fails loud.
      - name: Run Rust client harness smoke
        working-directory: harness
        run: |
          pnpm exec vitest run test/e2e.test.ts --reporter=default --reporter=json --outputFile=vitest-report.json
          node scripts/assert-run-count.mjs --report vitest-report.json --exact 7
        env:
          MPP_HARNESS_CLIENTS: rust
          MPP_HARNESS_SERVERS: typescript
      - name: Run Rust server harness smoke
        working-directory: harness
        run: |
          pnpm exec vitest run test/e2e.test.ts --reporter=default --reporter=json --outputFile=vitest-report.json
          node scripts/assert-run-count.mjs --report vitest-report.json --exact 11
        env:
          MPP_HARNESS_CLIENTS: typescript
          MPP_HARNESS_SERVERS: rust
      - name: Run Rust end-to-end harness smoke
        working-directory: harness
        run: |
          pnpm exec vitest run test/e2e.test.ts --reporter=default --reporter=json --outputFile=vitest-report.json
          node scripts/assert-run-count.mjs --report vitest-report.json --exact 5
        env:
          MPP_HARNESS_CLIENTS: rust
          MPP_HARNESS_SERVERS: rust
      - name: Run Ruby server harness smoke
        working-directory: harness
        run: |
          pnpm exec vitest run test/e2e.test.ts --reporter=default --reporter=json --outputFile=vitest-report.json
          node scripts/assert-run-count.mjs --report vitest-report.json --exact 14
        env:
          MPP_HARNESS_CLIENTS: typescript
          MPP_HARNESS_SERVERS: ruby
      - name: Run Rust client to Ruby server harness smoke
        working-directory: harness
        run: |
          pnpm exec vitest run test/e2e.test.ts --reporter=default --reporter=json --outputFile=vitest-report.json
          node scripts/assert-run-count.mjs --report vitest-report.json --exact 7
        env:
          MPP_HARNESS_CLIENTS: rust
          MPP_HARNESS_SERVERS: ruby

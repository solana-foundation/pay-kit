name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

defaults:
  run:
    working-directory: typescript

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          package_json_file: package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --production

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          package_json_file: package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # @solana/pay-kit resolves @solana/mpp through its dist exports, so the
      # type-aware lint rules need the package built first.
      - run: pnpm --filter @solana/mpp build
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    name: Typecheck
    needs: build-html
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          package_json_file: package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - name: Download HTML assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: html-assets
      - run: pnpm install --frozen-lockfile
      # @solana/pay-kit resolves @solana/mpp through its dist exports.
      - run: pnpm --filter @solana/mpp build
      - run: pnpm typecheck

  test-ts:
    name: TypeScript tests
    needs: build-html
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          package_json_file: package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - name: Download HTML assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: html-assets
      - run: pnpm install --frozen-lockfile

      # @solana/pay-kit's tests import @solana/mpp through its dist exports.
      - run: pnpm --filter @solana/mpp build

      # Run ALL tests (unit + surfpool integration) with coverage
      - name: Run tests with coverage
        run: pnpm vitest run --coverage --config vitest.config.ci.ts
        env:
          # Reliable RPC datasource for the embedded surfnet (see the Rust job).
          SURFPOOL_DATASOURCE_RPC_URL: ${{ secrets.SURFPOOL_DATASOURCE_RPC_URL }}

      - name: Upload TS coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ts-coverage
          path: typescript/coverage/coverage-summary.json

      - name: Upload TS surfpool report data
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: surfpool-reports-ts
          path: typescript/target/surfpool-reports/
          if-no-files-found: ignore

  build-html:
    name: Build HTML payment link assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install and build
        working-directory: html
        run: |
          npm install
          npm run build
      - name: Verify committed gen files are up to date
        working-directory: .
        run: |
          if ! git diff --quiet -- rust/crates/kit/src/mpp/server/html/ go/protocols/mpp/server/html/ lua/pay_kit/protocols/mpp/server/html_assets/ python/src/pay_kit/protocols/mpp/server/html/; then
            echo "::error::Generated files are out of date. Run 'just html-build' and commit the results."
            git diff --stat -- rust/crates/kit/src/mpp/server/html/ go/protocols/mpp/server/html/ lua/pay_kit/protocols/mpp/server/html_assets/ python/src/pay_kit/protocols/mpp/server/html/
            exit 1
          fi
      - name: Upload HTML build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: html-assets
          path: |
            html/dist/
            rust/crates/kit/src/mpp/server/html/
            go/protocols/mpp/server/html/
            lua/pay_kit/protocols/mpp/server/html_assets/
            python/src/pay_kit/protocols/mpp/server/html/
            typescript/packages/mpp/src/server/html-assets.gen.ts

  test-rust:
    name: Rust tests
    needs: build-html
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@c6d51ded7cde3c421f6cd6046cd601f2248f3710 # cargo-llvm-cov
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-rust-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-rust-
      - name: Download HTML assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: html-assets

      - name: Run tests with coverage
        working-directory: rust
        env:
          # Reliable RPC datasource for the embedded surfnet — without it the
          # surfpool integration tests clone from the public mainnet-beta RPC,
          # which rate-limits and crashes surfnet mid-test in CI.
          SURFPOOL_DATASOURCE_RPC_URL: ${{ secrets.SURFPOOL_DATASOURCE_RPC_URL }}
        # One instrumented run covers everything; two floors are enforced from
        # its per-file data below. Excluded from BOTH floors: the surfpool/litesvm
        # integration tests (`paykit-integration-tests`), the unpublished harness
        # bins, the multi_delegate client (drives only the on-chain program), and
        # the Codama-autogenerated clients under src/generated/ ("DO NOT EDIT",
        # not hand-tested). src/mpp/program/ (hand-written instruction-builder
        # wrappers) is now INSIDE the mpp floor — it is downstream SDK surface and
        # its account layout is additionally pinned by
        # settle_family_account_layout_golden.
        run: cargo llvm-cov -p solana-pay-kit -p paykit-integration-tests --ignore-filename-regex 'crates/integration-tests/|crates/harness-bins/|client/multi_delegate|src/generated/' --json --output-path coverage.json

      # Library tests for the x402 module — a fast targeted run for the loose-402
      # challenge regression suite (`to_accepted_value_patches_loose_*`) that
      # catches resource servers emitting non-canonical Solana x402 `accepted`
      # blocks (missing `scheme`, bare network slug, missing `maxTimeoutSeconds`).
      - name: Run solana-pay-kit x402 library tests
        working-directory: rust
        run: cargo test -p solana-pay-kit --lib x402

      - name: Enforce Rust coverage floors (mpp >=90, x402 >=75 ratchet)
        working-directory: rust
        run: |
          python3 - <<'PY'
          import json, sys
          with open('coverage.json') as f:
              files = json.load(f)['data'][0]['files']
          # x402 is materially under-covered today (server/batch_settlement ~37%,
          # server/upto ~63%), so it has its own ratchet floor rather than the 90%
          # mpp baseline. Both are gated so neither can silently regress; raise the
          # x402 floor as coverage improves (tracked).
          def pct(pred):
              tot = cov = 0
              for f in files:
                  if pred(f['filename']):
                      L = f['summary']['lines']; tot += L['count']; cov += L['covered']
              return (100.0 * cov / tot if tot else 100.0)
          mpp = pct(lambda n: '/src/x402/' not in n)
          x402 = pct(lambda n: '/src/x402/' in n)
          print(f"mpp line coverage: {mpp:.2f}% (floor 90.0)")
          print(f"x402 line coverage: {x402:.2f}% (floor 75.0)")
          failed = False
          if mpp < 90.0:
              print(f"FAIL: mpp {mpp:.2f}% < 90.0"); failed = True
          if x402 < 75.0:
              print(f"FAIL: x402 {x402:.2f}% < 75.0"); failed = True
          if failed:
              sys.exit(1)
          PY

      - name: Rust format check
        working-directory: rust
        run: cargo fmt --check

      - name: Upload Rust coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-coverage
          path: rust/coverage.json

      - name: Upload Rust surfpool report data
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: surfpool-reports-rust
          path: rust/target/surfpool-reports/
          if-no-files-found: ignore

  # Go tests, lint, coverage, and harness live in the dedicated go.yml
  # workflow (triggered on pull_request and workflow_call). Kept out of
  # ci.yml so there is a single "Go tests" check rather than two.

  integration:
    name: Integration tests
    needs: build-html
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          package_json_file: package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - name: Download HTML assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: html-assets
      - name: Install Surfnet helper dependencies
        working-directory: harness
        run: pnpm install --frozen-lockfile
      - name: Start Surfnet
        working-directory: .
        run: |
          node harness/start-surfnet-proxy.mjs &
          ready=0
          for i in $(seq 1 50); do
            if curl -sf -X POST http://localhost:8899 \
              -H "Content-Type: application/json" \
              -d '{"jsonrpc":"2.0","id":1,"method":"getHealth","params":[]}' \
              | grep -q '"result":"ok"'; then
              ready=1
              break
            fi
            sleep 0.2
          done
          test "$ready" -eq 1
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  test-payment-links-demo:
    name: "Payment links E2E: Playground (TypeScript)"
    needs: build-html
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          package_json_file: package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - name: Download HTML assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: html-assets
      - name: Install Surfnet helper dependencies
        working-directory: harness
        run: pnpm install --frozen-lockfile
      - name: Start Surfnet
        working-directory: .
        run: |
          node harness/start-surfnet-proxy.mjs &
          ready=0
          for i in $(seq 1 50); do
            if curl -sf -X POST http://localhost:8899 \
              -H "Content-Type: application/json" \
              -d '{"jsonrpc":"2.0","id":1,"method":"getHealth","params":[]}' \
              | grep -q '"result":"ok"'; then
              ready=1
              break
            fi
            sleep 0.2
          done
          test "$ready" -eq 1
      - name: Install TypeScript dependencies
        working-directory: typescript
        run: pnpm install --frozen-lockfile
      - name: Build TypeScript SDK
        working-directory: typescript
        run: pnpm build
      - name: Install playground API dependencies
        working-directory: typescript/examples/playground-api
        run: pnpm install --frozen-lockfile
      - name: Install HTML dependencies & Playwright
        working-directory: html
        run: npm install && npx playwright install chromium
      - name: Start playground API
        working-directory: typescript/examples/playground-api
        run: npx tsx index.ts &
        env:
          NETWORK: localnet
          PLAYGROUND_DISABLE_SIDECAR: "1"
      - name: Wait for playground server
        working-directory: .
        run: |
          for i in $(seq 1 15); do
            curl -sf http://localhost:3000/api/v1/health && break
            sleep 1
          done
      - name: Run Playwright tests (Playground)
        working-directory: html
        run: npm run test:e2e:demo

  test-payment-links-rust:
    name: "Payment links E2E: Rust"
    needs: build-html
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-rust-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-rust-
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          package_json_file: package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - name: Download HTML assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: html-assets
      - name: Install Surfnet helper dependencies
        working-directory: harness
        run: pnpm install --frozen-lockfile
      - name: Start Surfnet
        working-directory: .
        run: |
          node harness/start-surfnet-proxy.mjs &
          ready=0
          for i in $(seq 1 50); do
            if curl -sf -X POST http://localhost:8899 \
              -H "Content-Type: application/json" \
              -d '{"jsonrpc":"2.0","id":1,"method":"getHealth","params":[]}' \
              | grep -q '"result":"ok"'; then
              ready=1
              break
            fi
            sleep 0.2
          done
          test "$ready" -eq 1
      - name: Install HTML dependencies & Playwright
        working-directory: html
        run: npm install && npx playwright install chromium
      - name: Build Rust test server
        working-directory: rust
        run: cargo build --example payment_link_server --features axum
      - name: Start Rust test server
        working-directory: rust
        run: cargo run --example payment_link_server --features axum &
      - name: Wait for Rust server
        working-directory: .
        run: |
          for i in $(seq 1 15); do
            curl -sf http://localhost:3001/health && break
            sleep 1
          done
      - name: Run Playwright tests (Rust)
        working-directory: html
        run: npm run test:e2e:rust

  harness:
    name: "Harness: TypeScript harness"
    needs: build-html
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Download HTML assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: html-assets
      - uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ruby
      - uses: ./.github/actions/setup-harness
        with:
          cargo-bins: "paykit-harness-bins:mpp_harness_client,mpp_harness_server"
          cargo-cache-key: ts
      - name: Run Rust client harness smoke
        working-directory: harness
        run: pnpm exec vitest run test/e2e.test.ts --testNamePattern "rust client pays typescript server"
        env:
          MPP_HARNESS_CLIENTS: rust
          MPP_HARNESS_SERVERS: typescript
      - name: Run Rust server harness smoke
        working-directory: harness
        run: pnpm exec vitest run test/e2e.test.ts --testNamePattern "typescript client pays rust server"
        env:
          MPP_HARNESS_CLIENTS: typescript
          MPP_HARNESS_SERVERS: rust
      - name: Run Rust end-to-end harness smoke
        working-directory: harness
        run: pnpm exec vitest run test/e2e.test.ts --testNamePattern "rust client pays rust server"
        env:
          MPP_HARNESS_CLIENTS: rust
          MPP_HARNESS_SERVERS: rust
      - name: Run Ruby server harness smoke
        working-directory: harness
        run: pnpm exec vitest run test/e2e.test.ts --testNamePattern "typescript client pays ruby server"
        env:
          MPP_HARNESS_CLIENTS: typescript
          MPP_HARNESS_SERVERS: ruby
      - name: Run Rust client to Ruby server harness smoke
        working-directory: harness
        run: pnpm exec vitest run test/e2e.test.ts --testNamePattern "rust client pays ruby server"
        env:
          MPP_HARNESS_CLIENTS: rust
          MPP_HARNESS_SERVERS: ruby

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  # Cancel a pull-request run when a newer push supersedes it. Measured over
  # the last 810 pull-request runs, 119 of them kept running after a newer
  # push had already started, for 11.2 hours of runner time spent on commits
  # nobody was waiting on.
  #
  # Non-pull-request runs get a group of their own, keyed on run_id, rather
  # than sharing one keyed on the ref. A shared group would queue them against
  # each other, and a concurrency group only holds one pending run: a third
  # push landing while the first is still running evicts the second, which
  # would then report no result at all for that commit. `cancel-in-progress`
  # being false does not prevent that, it only protects the running run.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: typescript

jobs:
  # Which parts of the tree this pull request touches. Every other job in
  # this workflow gates on these outputs for pull_request events; pushes to
  # main and workflow_call runs are never filtered. A harness leg's filter
  # lists every language that participates in the leg, not just the server
  # language, so a cross-SDK change still runs the pairs it can break (#261).
  # Any change under .github/ invalidates every filter.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      ts: ${{ steps.filter.outputs.ts }}
      rust: ${{ steps.filter.outputs.rust }}
      linksdemo: ${{ steps.filter.outputs.linksdemo }}
      linksrust: ${{ steps.filter.outputs.linksrust }}
      harness: ${{ steps.filter.outputs.harness }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ts:
              - 'typescript/**'
              - 'html/**'
              - 'package.json'
              - '.node-version'
              - '.github/**'
            rust:
              - 'rust/**'
              - 'html/**'
              - '.github/**'
            linksdemo:
              - 'html/**'
              - 'typescript/**'
              - 'package.json'
              - '.node-version'
              - '.github/**'
            linksrust:
              - 'rust/**'
              - 'html/**'
              - 'typescript/**'
              - 'package.json'
              - '.node-version'
              - '.github/**'
            harness:
              - 'ruby/**'
              - 'harness/**'
              - 'typescript/**'
              - 'rust/**'
              - 'package.json'
              - '.node-version'
              - '.github/**'

  audit:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.ts == 'true'
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # npm retired the quick-audit endpoint pnpm still targets (HTTP 410,
      # "use the bulk advisory endpoint"); no pnpm release supports the bulk
      # endpoint yet. Treat only that specific failure as a warning so real
      # vulnerability findings keep failing the job. Drop this shim once
      # pnpm audit works against the bulk advisory endpoint.
      - name: Audit production dependencies
        run: |
          set -o pipefail
          if output=$(pnpm audit --production 2>&1); then
            echo "$output"
          else
            echo "$output"
            if echo "$output" | grep -q "This endpoint is being retired"; then
              echo "::warning::npm quick-audit endpoint retired (410); pnpm audit unavailable until pnpm supports the bulk advisory endpoint"
              exit 0
            fi
            exit 1
          fi

  lint:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.ts == 'true'
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # @solana/pay-kit resolves @solana/mpp through its dist exports, so the
      # type-aware lint rules need the package built first.
      - run: pnpm --filter @solana/mpp build
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    name: Typecheck
    needs: [changes, build-html]
    if: github.event_name != 'pull_request' || needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - name: Download HTML assets
        uses: actions/download-artifact@v7
        with:
          name: html-assets
      - run: pnpm install --frozen-lockfile
      # @solana/pay-kit resolves @solana/mpp through its dist exports.
      - run: pnpm --filter @solana/mpp build
      - run: pnpm typecheck

  test-ts:
    name: TypeScript tests
    needs: [changes, build-html]
    if: github.event_name != 'pull_request' || needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - name: Download HTML assets
        uses: actions/download-artifact@v7
        with:
          name: html-assets
      - run: pnpm install --frozen-lockfile

      # @solana/pay-kit's tests import @solana/mpp through its dist exports.
      - run: pnpm --filter @solana/mpp build

      # Run ALL tests (unit + surfpool integration) with coverage
      - name: Run tests with coverage
        run: pnpm vitest run --coverage --config vitest.config.ci.ts
        env:
          # Reliable RPC datasource for the embedded surfnet (see the Rust job).
          SURFPOOL_DATASOURCE_RPC_URL: ${{ secrets.SURFPOOL_DATASOURCE_RPC_URL }}

      - name: Upload TS coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ts-coverage
          path: typescript/coverage/coverage-summary.json

      - name: Upload TS surfpool report data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surfpool-reports-ts
          path: typescript/target/surfpool-reports/
          if-no-files-found: ignore

  build-html:
    name: Build HTML payment link assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install and build
        working-directory: html
        run: |
          npm install
          npm run build
      - name: Verify committed gen files are up to date
        working-directory: .
        run: |
          if ! git diff --quiet -- rust/crates/kit/src/mpp/server/html/ go/protocols/mpp/server/html/ lua/pay_kit/protocols/mpp/server/html_assets/ python/src/pay_kit/protocols/mpp/server/html/; then
            echo "::error::Generated files are out of date. Run 'just html-build' and commit the results."
            git diff --stat -- rust/crates/kit/src/mpp/server/html/ go/protocols/mpp/server/html/ lua/pay_kit/protocols/mpp/server/html_assets/ python/src/pay_kit/protocols/mpp/server/html/
            exit 1
          fi
      - name: Upload HTML build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: html-assets
          path: |
            html/dist/
            rust/crates/kit/src/mpp/server/html/
            go/protocols/mpp/server/html/
            lua/pay_kit/protocols/mpp/server/html_assets/
            python/src/pay_kit/protocols/mpp/server/html/
            typescript/packages/mpp/src/server/html-assets.gen.ts

  test-rust:
    name: Rust tests
    needs: [changes, build-html]
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      # See .github/actions/setup-harness/action.yml for why the key must not
      # hash only the gitignored lockfile: a constant key froze this cache at
      # its first save and cargo rebuilt all ~890 crates on every run.
      #
      # The `-cov` namespace is load-bearing: this job builds coverage-
      # instrumented artifacts under target/llvm-cov-target, while the E2E
      # job below builds plain ones. Under a shared key the shorter E2E job
      # wins the save race every time, this job restores artifacts it cannot
      # use, and the instrumented build never gets cached at all.
      - name: Compute cargo cache key
        id: cargo-key
        run: echo "rustc=$(rustc -V | tr -d ' ()')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-rust-cov-${{ steps.cargo-key.outputs.rustc }}-${{ hashFiles('rust/Cargo.lock', 'rust/**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-rust-cov-${{ steps.cargo-key.outputs.rustc }}-
      - name: Download HTML assets
        uses: actions/download-artifact@v7
        with:
          name: html-assets

      - name: Run tests with coverage
        working-directory: rust
        env:
          # Reliable RPC datasource for the embedded surfnet — without it the
          # surfpool integration tests clone from the public mainnet-beta RPC,
          # which rate-limits and crashes surfnet mid-test in CI.
          SURFPOOL_DATASOURCE_RPC_URL: ${{ secrets.SURFPOOL_DATASOURCE_RPC_URL }}
        # Lock to library scope: the inlined `mpp` module of solana-pay-kit
        # (x402 has its own coverage budget tracked separately), exclude
        # on-chain program adapters under src/mpp/program/ and the
        # Codama-autogenerated program clients under src/generated/
        # (instruction/account builders, "DO NOT EDIT" — not hand-tested,
        # same rationale as the src/mpp/program/ exclusion).
        # Reported coverage reflects the SDK surface downstream users link
        # against. The harness bins now live in the unpublished
        # `paykit-harness-bins` crate and the surfpool/litesvm integration
        # tests in `paykit-integration-tests`, so neither skews this number.
        run: cargo llvm-cov -p solana-pay-kit -p paykit-integration-tests --ignore-filename-regex 'crates/integration-tests/|crates/harness-bins/|src/mpp/program/|src/x402/|src/generated/' --json --output-path coverage.json

      # Library tests for the x402 module of solana-pay-kit. Separate from the
      # llvm-cov step above because x402 doesn't share mpp's 90% coverage floor
      # yet, but its tests still gate PRs — in particular the loose-402
      # challenge regression suite (`to_accepted_value_patches_loose_*`)
      # that catches resource servers emitting non-canonical Solana x402
      # `accepted` blocks (missing `scheme`, bare network slug, missing
      # `maxTimeoutSeconds`).
      - name: Run solana-pay-kit x402 library tests
        working-directory: rust
        run: cargo test -p solana-pay-kit --lib x402

      - name: Run Redis channel store integration test
        working-directory: rust
        env:
          PAY_KIT_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: >-
          cargo test -p solana-pay-kit --features redis-store --lib
          core::store::tests::redis_channel_store_roundtrip_and_atomic_watermark
          -- --exact

      - name: Enforce Rust coverage floor (>=90 cross-SDK baseline)
        working-directory: rust
        run: |
          python3 - <<'PY'
          import json, sys
          with open('coverage.json') as f:
              data = json.load(f)
          totals = data['data'][0]['totals']
          lines = totals['lines']
          pct = lines['percent']
          floor = 90.0
          print(f"Rust line coverage: {pct:.2f}% (floor {floor})")
          if pct < floor:
              print(f"FAIL: {pct:.2f}% < {floor}")
              sys.exit(1)
          PY

      - name: Rust format check
        working-directory: rust
        run: cargo fmt --check

      - name: Upload Rust coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          path: rust/coverage.json

      - name: Upload Rust surfpool report data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surfpool-reports-rust
          path: rust/target/surfpool-reports/
          if-no-files-found: ignore

  # Go tests, lint, coverage, and harness live in the dedicated go.yml
  # workflow (triggered on pull_request and workflow_call). Kept out of
  # ci.yml so there is a single "Go tests" check rather than two.

  integration:
    name: Integration tests
    needs: [changes, build-html]
    if: github.event_name != 'pull_request' || needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - name: Download HTML assets
        uses: actions/download-artifact@v7
        with:
          name: html-assets
      - name: Install Surfnet helper dependencies
        working-directory: harness
        run: pnpm install --frozen-lockfile
      - name: Start Surfnet
        working-directory: .
        run: |
          node harness/start-surfnet-proxy.mjs &
          ready=0
          for i in $(seq 1 50); do
            if curl -sf -X POST http://localhost:8899 \
              -H "Content-Type: application/json" \
              -d '{"jsonrpc":"2.0","id":1,"method":"getHealth","params":[]}' \
              | grep -q '"result":"ok"'; then
              ready=1
              break
            fi
            sleep 0.2
          done
          test "$ready" -eq 1
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  test-payment-links-demo:
    name: "Payment links E2E: Playground (TypeScript)"
    needs: [changes, build-html]
    if: github.event_name != 'pull_request' || needs.changes.outputs.linksdemo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - name: Download HTML assets
        uses: actions/download-artifact@v7
        with:
          name: html-assets
      - name: Install Surfnet helper dependencies
        working-directory: harness
        run: pnpm install --frozen-lockfile
      - name: Start Surfnet
        working-directory: .
        run: |
          node harness/start-surfnet-proxy.mjs &
          ready=0
          for i in $(seq 1 50); do
            if curl -sf -X POST http://localhost:8899 \
              -H "Content-Type: application/json" \
              -d '{"jsonrpc":"2.0","id":1,"method":"getHealth","params":[]}' \
              | grep -q '"result":"ok"'; then
              ready=1
              break
            fi
            sleep 0.2
          done
          test "$ready" -eq 1
      - name: Install TypeScript dependencies
        working-directory: typescript
        run: pnpm install --frozen-lockfile
      - name: Build TypeScript SDK
        working-directory: typescript
        run: pnpm build
      - name: Install playground API dependencies
        working-directory: typescript/examples/playground-api
        run: pnpm install --frozen-lockfile
      - name: Install HTML dependencies & Playwright
        working-directory: html
        run: npm install && npx playwright install chromium
      - name: Start playground API
        working-directory: typescript/examples/playground-api
        run: npx tsx index.ts &
        env:
          NETWORK: localnet
          PLAYGROUND_DISABLE_SIDECAR: "1"
      - name: Wait for playground server
        working-directory: .
        run: |
          for i in $(seq 1 15); do
            curl -sf http://localhost:3000/api/v1/health && break
            sleep 1
          done
      - name: Run Playwright tests (Playground)
        working-directory: html
        run: npm run test:e2e:demo

  test-payment-links-rust:
    name: "Payment links E2E: Rust"
    needs: [changes, build-html]
    if: github.event_name != 'pull_request' || needs.changes.outputs.linksrust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # Same key as the Rust tests job above, same rationale: a key hashing
      # only the gitignored lockfile is constant, so this cache was frozen and
      # the test server rebuilt ~490 crates per run.
      - name: Compute cargo cache key
        id: cargo-key
        run: echo "rustc=$(rustc -V | tr -d ' ()')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-rust-${{ steps.cargo-key.outputs.rustc }}-${{ hashFiles('rust/Cargo.lock', 'rust/**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-rust-${{ steps.cargo-key.outputs.rustc }}-
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - name: Download HTML assets
        uses: actions/download-artifact@v7
        with:
          name: html-assets
      - name: Install Surfnet helper dependencies
        working-directory: harness
        run: pnpm install --frozen-lockfile
      - name: Start Surfnet
        working-directory: .
        run: |
          node harness/start-surfnet-proxy.mjs &
          ready=0
          for i in $(seq 1 50); do
            if curl -sf -X POST http://localhost:8899 \
              -H "Content-Type: application/json" \
              -d '{"jsonrpc":"2.0","id":1,"method":"getHealth","params":[]}' \
              | grep -q '"result":"ok"'; then
              ready=1
              break
            fi
            sleep 0.2
          done
          test "$ready" -eq 1
      - name: Install HTML dependencies & Playwright
        working-directory: html
        run: npm install && npx playwright install chromium
      - name: Build Rust test server
        working-directory: rust
        run: cargo build --example payment_link_server --features axum
      - name: Start Rust test server
        working-directory: rust
        run: cargo run --example payment_link_server --features axum &
      - name: Wait for Rust server
        working-directory: .
        run: |
          for i in $(seq 1 15); do
            curl -sf http://localhost:3001/health && break
            sleep 1
          done
      - name: Run Playwright tests (Rust)
        working-directory: html
        run: npm run test:e2e:rust

  harness:
    name: "Harness: TypeScript harness"
    needs: [changes, build-html]
    if: github.event_name != 'pull_request' || needs.changes.outputs.harness == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download HTML assets
        uses: actions/download-artifact@v7
        with:
          name: html-assets
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ruby
      - uses: ./.github/actions/setup-harness
        with:
          cargo-bins: "paykit-harness-bins:mpp_harness_client,mpp_harness_server"
          cargo-cache-key: ts
      - name: Run Rust client harness smoke
        working-directory: harness
        run: pnpm exec vitest run test/e2e.test.ts --testNamePattern "rust client pays typescript server"
        env:
          MPP_HARNESS_CLIENTS: rust
          MPP_HARNESS_SERVERS: typescript
      - name: Run Rust server harness smoke
        working-directory: harness
        run: pnpm exec vitest run test/e2e.test.ts --testNamePattern "typescript client pays rust server"
        env:
          MPP_HARNESS_CLIENTS: typescript
          MPP_HARNESS_SERVERS: rust
      - name: Run Rust end-to-end harness smoke
        working-directory: harness
        run: pnpm exec vitest run test/e2e.test.ts --testNamePattern "rust client pays rust server"
        env:
          MPP_HARNESS_CLIENTS: rust
          MPP_HARNESS_SERVERS: rust
      - name: Run Ruby server harness smoke
        working-directory: harness
        run: pnpm exec vitest run test/e2e.test.ts --testNamePattern "typescript client pays ruby server"
        env:
          MPP_HARNESS_CLIENTS: typescript
          MPP_HARNESS_SERVERS: ruby
      - name: Run Rust client to Ruby server harness smoke
        working-directory: harness
        run: pnpm exec vitest run test/e2e.test.ts --testNamePattern "rust client pays ruby server"
        env:
          MPP_HARNESS_CLIENTS: rust
          MPP_HARNESS_SERVERS: ruby

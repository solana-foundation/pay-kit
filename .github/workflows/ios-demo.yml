name: iOS Demo

on:
  push:
    branches: [main]
    paths:
      - 'swift/Examples/iOSDemo/**'
      - 'swift/Sources/**'
      - '.github/workflows/ios-demo.yml'
  pull_request:
    paths:
      - 'swift/Examples/iOSDemo/**'
      - 'swift/Sources/**'
      - '.github/workflows/ios-demo.yml'
  workflow_call:

jobs:
  build-ios-demo:
    name: iOS demo build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Build iOSDemo for iOS Simulator
        working-directory: swift/Examples/iOSDemo
        run: |
          xcodebuild \
            -scheme iOSDemo \
            -project iOSDemo.xcodeproj \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

name: Go

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  # Path filter: a PR that touches none of these skips the jobs below
  # (skipped jobs satisfy required checks); pushes and calls run them all.
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'go/**'
              - 'html/**'
              - '.github/**'

  test-go:
    name: test
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Run tests with coverage
        working-directory: go
        env:
          GOCACHE: /tmp/go-build-cache
        run: |
          go test \
            github.com/solana-foundation/pay-kit/go/paycore \
            github.com/solana-foundation/pay-kit/go/paycore/solanatx \
            github.com/solana-foundation/pay-kit/go/paycore/signer \
            github.com/solana-foundation/pay-kit/go/paycore/paymentchannels \
            github.com/solana-foundation/pay-kit/go/paykit \
            github.com/solana-foundation/pay-kit/go/paykit/adapters/x402 \
            github.com/solana-foundation/pay-kit/go/paykit/adapters/mpp \
            github.com/solana-foundation/pay-kit/go/protocols/mpp \
            github.com/solana-foundation/pay-kit/go/protocols/mpp/core \
            github.com/solana-foundation/pay-kit/go/protocols/mpp/wire \
            github.com/solana-foundation/pay-kit/go/protocols/mpp/intents \
            github.com/solana-foundation/pay-kit/go/protocols/mpp/server \
            github.com/solana-foundation/pay-kit/go/protocols/mpp/client \
            github.com/solana-foundation/pay-kit/go/protocols/mpp/errorcodes \
            github.com/solana-foundation/pay-kit/go/protocols/x402 \
            github.com/solana-foundation/pay-kit/go/protocols/x402/client \
            -coverprofile=coverage.out \
            -covermode=atomic
          ./scripts/check_coverage.sh coverage.out 91
      - name: Run all Go packages
        working-directory: go
        env:
          GOCACHE: /tmp/go-build-cache
        run: go test ./...
      - name: Upload Go coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: go/coverage.out

  lint-go:
    name: lint
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: gofmt check
        working-directory: go
        run: |
          unformatted=$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt drift:"
            echo "$unformatted"
            exit 1
          fi
      - name: Docs snippets compile and boot
        working-directory: go
        run: ./scripts/check_snippets.sh
      - name: Playground snippet manifest in sync
        run: |
          node playground/scripts/gen-snippets.mjs
          git diff --exit-code playground/app/src/lib/snippets.gen.json
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          working-directory: go
          version: v2.12.2
          args: --timeout=5m
          skip-cache: true

name: Go

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test-go:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Run tests with coverage
        working-directory: go
        env:
          GOCACHE: /tmp/go-build-cache
        run: |
          go test \
            github.com/solana-foundation/pay-kit/go/paycore \
            github.com/solana-foundation/pay-kit/go/paycore/solanatx \
            github.com/solana-foundation/pay-kit/go/paycore/signer \
            github.com/solana-foundation/pay-kit/go/paycore/paymentchannels \
            github.com/solana-foundation/pay-kit/go/paykit \
            github.com/solana-foundation/pay-kit/go/paykit/adapters/x402 \
            github.com/solana-foundation/pay-kit/go/paykit/adapters/mpp \
            github.com/solana-foundation/pay-kit/go/protocols/mpp \
            github.com/solana-foundation/pay-kit/go/protocols/mpp/core \
            github.com/solana-foundation/pay-kit/go/protocols/mpp/wire \
            github.com/solana-foundation/pay-kit/go/protocols/mpp/intents \
            github.com/solana-foundation/pay-kit/go/protocols/mpp/server \
            github.com/solana-foundation/pay-kit/go/protocols/mpp/client \
            github.com/solana-foundation/pay-kit/go/protocols/mpp/errorcodes \
            github.com/solana-foundation/pay-kit/go/protocols/x402 \
            github.com/solana-foundation/pay-kit/go/protocols/x402/client \
            -coverprofile=coverage.out \
            -covermode=atomic
          # Args: <profile> <aggregate floor> <per-file floor>. The per-file
          # floor sits just under the current lowest shipped file so a single
          # weak file cannot hide behind inflated easy ones (mirrors the
          # Rust/TS per-file gates). Raise a file's coverage rather than
          # lowering this floor.
          ./scripts/check_coverage.sh coverage.out 91 75
      - name: Check coverage gate enforces the per-file floor
        working-directory: go
        run: ./scripts/check_coverage_test.sh
      # Run the whole suite under the race detector. Replay/TOCTOU data races
      # (concurrent claim/reserve/voucher paths, lock-map lifecycle) are the
      # single largest class of bug that escaped review, and `-race` is the
      # zero-false-positive detector for them — so it is mandatory here, not
      # optional. Verified race-clean on this tree.
      - name: Run all Go packages (race detector)
        working-directory: go
        env:
          GOCACHE: /tmp/go-build-cache
          CGO_ENABLED: '1'
        run: go test -race ./...
      - name: Upload Go coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: go-coverage
          path: go/coverage.out

  lint-go:
    name: Go lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: gofmt check
        working-directory: go
        run: |
          unformatted=$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt drift:"
            echo "$unformatted"
            exit 1
          fi
      - name: golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          working-directory: go
          version: v2.12.2
          args: --timeout=5m
          skip-cache: true
      # Enforce the Go 1.26 language/stdlib modernizers (go fix -inline=false)
      # on all non-generated source so newer idioms (any, min/max, new(expr),
      # range-over-int, slices/maps, SplitSeq, wg.Go) stay applied without
      # manual "use the newer API" review comments. The inline analyzer is
      # excluded (see go/scripts/check-go-fix.sh); generated codama clients are
      # excluded by their AUTOGENERATED header.
      - name: go fix modernization gate
        run: bash go/scripts/check-go-fix.sh

  harness-go:
    name: Go PayKit harness (mpp charge + x402 exact + x402 upto)
    needs: test-go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: ./.github/actions/setup-harness
        with:
          cargo-bins: "paykit-harness-bins:mpp_harness_client,x402_harness_client,x402_harness_upto_client,x402_harness_upto_server"
          cargo-cache-key: go
      # Cross-SDK conformance vectors for Go: the REAL Go structural exact
      # verifier (go/protocols/x402/verify.go, driven via
      # go/cmd/conformance/x402.go -> x402.VerifyExactTransaction) must execute
      # the x402 exact-reject fund-safety vectors, mirroring the ruby/python
      # legs. Without this leg the only conformance run in CI pinned
      # MPP_CONFORMANCE_LANGUAGES=typescript (ci.yml), so the fund-safety
      # vectors — including x402-exact-fee-payer-as-source-ata, the
      # fee-payer-owns-the-source-ATA drain guard (verify.go:209-217) — never
      # reached the Go verifier and its guard could silently regress. The
      # runner (harness/runners/go.json) launches `go run ./cmd/conformance`
      # from go/. RPC-free and deterministic. A RED here is a real Go verifier
      # divergence — fix it in go/protocols/x402, do not skip.
      - name: Run Go cross-SDK conformance vectors
        working-directory: harness
        env:
          MPP_CONFORMANCE_LANGUAGES: go
        run: pnpm exec vitest run test/conformance.test.ts
      # Cross-SDK mpp-PROTOCOL conformance: the canonical challenge / receipt /
      # base64url / challenge-id vectors (incl. the adversarial reject cases)
      # driven through the real Go protocol codec via the spawned runner. Known Go
      # divergences (CRLF-in-description, uppercase-method) are tracked in
      # KNOWN_RUNNER_DIVERGENCES[go]; a RED here is a NEW Go protocol divergence.
      - name: Run Go protocol conformance (canonical challenge/receipt vectors)
        working-directory: harness
        env:
          MPP_CONFORMANCE_LANGUAGES: go
        run: pnpm exec vitest run test/protocol-conformance.test.ts
      - name: Checkout payment channels program
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: Moonsong-Labs/solana-payment-channels
          ref: 0c07d5751c8972abf6a219570a3f39a72f46f879
          path: _payment-channels
          fetch-depth: 1
      # Pinned Agave release, fetched as a tarball and checksum-verified —
      # `curl https://release.anza.xyz/stable/install | sh` executed whatever
      # script and toolchain the mutable "stable" channel served that day.
      # Bump AGAVE_VERSION + AGAVE_SHA256 together to take upgrades.
      - name: Install Anza CLI
        run: |
          AGAVE_VERSION="v4.1.1"
          AGAVE_SHA256="a5c8e74b8ffa9ce906872b812849057c7fb21cf036ba08f219eb335e20fa4fb3"
          curl -sSfL -o /tmp/solana-release.tar.bz2 \
            "https://github.com/anza-xyz/agave/releases/download/${AGAVE_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          echo "${AGAVE_SHA256}  /tmp/solana-release.tar.bz2" | sha256sum -c -
          mkdir -p "$HOME/.local/share/solana/install"
          tar -xjf /tmp/solana-release.tar.bz2 -C "$HOME/.local/share/solana/install"
          echo "$HOME/.local/share/solana/install/solana-release/bin" >> "$GITHUB_PATH"
      - name: Patch payment channels localnet artifact
        working-directory: _payment-channels
        run: |
          old_program_id="CQAyft83tN1w2bRofB5PZ79eVDU2xZUVo43LU1qL4zRg"
          new_program_id="CHNLxYvVA28MJP9PrFuDXccuoGXAx7jBacfLEkahyGsX"
          sentinel_file="program/payment_channels/src/constants.rs"
          sentinel_prefix="    0xb0, 0x41, 0xd9, 0xd3, 0x37, 0xb7, 0x21, 0xbe, 0x57, 0x89, 0x4e, 0xb6, 0x9c, 0x3b, 0x68, 0x09,"
          sentinel_suffix="    0xa5, 0x3a, 0x0e, 0x2b, 0x6a, 0x23, 0x99, 0xfc, 0x7d, 0x5b, 0x7e, 0xda, 0x8c, 0xac, 0x89, 0xaa,"
          grep_args=(--exclude-dir=.git --exclude-dir=target)
          mapfile -t id_files < <(grep -RIl "${grep_args[@]}" "$old_program_id" .)
          if [ "${#id_files[@]}" -gt 0 ]; then
            sed -i "s/$old_program_id/$new_program_id/g" "${id_files[@]}"
          fi
          perl -0pi -e 's/const TREASURY_OWNER_SENTINEL: \[u8; 32\] = \[\n.*?\n\];/const TREASURY_OWNER_SENTINEL: [u8; 32] = [\n    0xb0, 0x41, 0xd9, 0xd3, 0x37, 0xb7, 0x21, 0xbe, 0x57, 0x89, 0x4e, 0xb6, 0x9c, 0x3b, 0x68, 0x09,\n    0xa5, 0x3a, 0x0e, 0x2b, 0x6a, 0x23, 0x99, 0xfc, 0x7d, 0x5b, 0x7e, 0xda, 0x8c, 0xac, 0x89, 0xaa,\n];/s' "$sentinel_file"
          if ! grep -R "${grep_args[@]}" "$new_program_id" . >/dev/null; then
            echo "::error::payment-channels program id patch did not write $new_program_id"
            exit 1
          fi
          if grep -R "${grep_args[@]}" "$old_program_id" . >/dev/null; then
            echo "::error::payment-channels program id patch left $old_program_id in the checkout"
            exit 1
          fi
          if ! grep -Fq "$sentinel_prefix" "$sentinel_file" || ! grep -Fq "$sentinel_suffix" "$sentinel_file"; then
            echo "::error::payment-channels treasury sentinel patch did not apply"
            exit 1
          fi
      - name: Build payment channels program
        working-directory: _payment-channels/program/payment_channels
        run: cargo build-sbf --tools-version v1.52 --arch v1
      - name: Build Go paykit harness server
        working-directory: harness/go-server
        run: go build -o paykit-server .
      - name: Run Go PayKit harness matrix (mpp charge + x402 exact + x402 upto)
        working-directory: harness
        env:
          # Only the go server runs in this job, so every generated pair
          # targets it: no testNamePattern filter and no skipped rows.
          MPP_HARNESS_CLIENTS: typescript
          MPP_HARNESS_SERVERS: go
          MPP_HARNESS_INTENTS: charge,x402-exact,x402-upto
          # selectHarnessScenarios reads MPP_HARNESS_SCENARIOS for the
          # whole active set (x402 included), so x402-exact-basic must be
          # listed here. Charge scenarios the go server is eligible for:
          # basic, splits (Token + Token-2022), symbol resolution,
          # idempotent replay store, compute-budget cap, over-split
          # rejection, sum-equals-amount, and the two L6 fault-matrix
          # codes (wrong_network / charge_request_mismatch); plus the
          # x402 exact scheme.
          MPP_HARNESS_SCENARIOS: charge-basic,charge-split-ata,charge-symbol-usdc-localnet,charge-token2022-split-ata,charge-split-ata-idempotent,charge-compute-budget-over-cap,charge-splits-too-many,charge-splits-sum-equals-amount,charge-network-mismatch,charge-cross-route-replay,x402-exact-basic,x402-upto-basic,x402-upto-zero-actual
          X402_HARNESS_CLIENTS: rust-x402,go-x402,rust-x402-upto,go-x402-upto
          # Pin x402-exact to the main Go server and x402-upto to the Go/Rust
          # payment-channel servers under test.
          X402_HARNESS_SERVERS: go,rust-x402-upto,go-x402-upto
          # x402-upto executes the canonical payment-channels program on the
          # embedded surfnet. Use a localnet SBF artifact because the mainnet
          # deployment currently uses BPF instructions unsupported by Surfnet.
          PAYMENT_CHANNELS_PROGRAM_SO: ../_payment-channels/target/deploy/payment_channels.so
          PAYMENT_CHANNELS_PROGRAM_ID: CHNLxYvVA28MJP9PrFuDXccuoGXAx7jBacfLEkahyGsX
          # Fallback datasource if the artifact path is intentionally omitted.
          SURFPOOL_DATASOURCE_RPC_URL: ${{ secrets.SURFPOOL_DATASOURCE_RPC_URL }}
        run: |
          pnpm exec vitest run test/e2e.test.ts --testTimeout 180000 --reporter=default --reporter=json --outputFile=vitest-report.json
          # Kill selector drift false greens: the selected charge + x402 exact +
          # x402 upto shard must execute exactly the current 18 settlement pair
          # tests. A missing x402-upto slice would otherwise still satisfy the
          # older 12-pair charge/exact floor.
          node scripts/assert-run-count.mjs --report vitest-report.json --exact 18

  playground-go:
    name: "Payment links E2E: Playground (Go)"
    needs: test-go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          package_json_file: package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - name: Install Surfnet helper dependencies
        working-directory: harness
        run: pnpm install --frozen-lockfile
      - name: Start Surfnet
        working-directory: .
        run: |
          node harness/start-surfnet-proxy.mjs &
          ready=0
          for i in $(seq 1 50); do
            if curl -sf -X POST http://localhost:8899 \
              -H "Content-Type: application/json" \
              -d '{"jsonrpc":"2.0","id":1,"method":"getHealth","params":[]}' \
              | grep -q '"result":"ok"'; then
              ready=1
              break
            fi
            sleep 0.2
          done
          test "$ready" -eq 1
      - name: Build Go playground API
        working-directory: go
        env:
          GOCACHE: /tmp/go-build-cache
        run: go build ./examples/playground-api
      - name: Start Go playground API
        working-directory: go
        env:
          GOCACHE: /tmp/go-build-cache
          PORT: "3002"
          NETWORK: localnet
          RPC_URL: http://localhost:8899
          MPP_SECRET_KEY: playground-ci-secret-padding-0123456789
        run: go run ./examples/playground-api &
      - name: Wait for playground server
        working-directory: .
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3002/api/v1/health && break
            sleep 1
          done
      - name: Install HTML dependencies & Playwright
        working-directory: html
        # Frozen, script-free install: the browser download runs via the
        # explicit `npx playwright install`, and esbuild resolves its platform
        # binary from @esbuild/<platform> without a postinstall script.
        run: npm ci --ignore-scripts && npx playwright install chromium
      - name: Run Playwright tests (Go playground)
        working-directory: html
        run: FORTUNE_PATH=/api/v1/fortune npm run test:e2e:go

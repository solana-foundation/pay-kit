name: Go

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test-go:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Run tests with coverage
        working-directory: go
        env:
          GOCACHE: /tmp/go-build-cache
        run: |
          go test \
            github.com/solana-foundation/pay-kit/go \
            github.com/solana-foundation/pay-kit/go/client \
            github.com/solana-foundation/pay-kit/go/errorcodes \
            github.com/solana-foundation/pay-kit/go/internal/utils \
            github.com/solana-foundation/pay-kit/go/paykit \
            github.com/solana-foundation/pay-kit/go/paykit/signer \
            github.com/solana-foundation/pay-kit/go/protocol \
            github.com/solana-foundation/pay-kit/go/protocol/core \
            github.com/solana-foundation/pay-kit/go/protocol/intents \
            github.com/solana-foundation/pay-kit/go/server \
            -coverprofile=coverage.out \
            -covermode=atomic
          ./scripts/check_coverage.sh coverage.out 90
      - name: Run all Go packages
        working-directory: go
        env:
          GOCACHE: /tmp/go-build-cache
        run: go test ./...
      - name: Upload Go coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: go/coverage.out

  lint-go:
    name: Go lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: gofmt check
        working-directory: go
        run: |
          unformatted=$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt drift:"
            echo "$unformatted"
            exit 1
          fi
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          working-directory: go
          version: v2.12.2
          args: --timeout=5m
          skip-cache: true

  interop-go-paykit:
    name: Go PayKit interop (mpp charge + x402 exact)
    needs: test-go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-go-paykit-interop-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-go-paykit-interop-
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - name: Install TypeScript workspace
        working-directory: typescript
        run: pnpm install --frozen-lockfile
      - name: Build TypeScript package
        working-directory: typescript
        run: pnpm --filter @solana/mpp build
      - name: Build Rust interop client
        working-directory: rust
        run: cargo build -p solana-mpp --bin interop_client
      - name: Build Rust x402 interop client
        working-directory: rust
        run: cargo build -p solana-x402 --bin interop_client
      - name: Install interop harness
        working-directory: harness
        run: pnpm install --frozen-lockfile
      - name: Typecheck interop harness
        working-directory: harness
        run: pnpm typecheck
      - name: Build Go paykit harness server
        working-directory: harness/go-paykit-server
        run: go build -o paykit-server .
      - name: Run Go PayKit interop smoke (mpp charge + x402 exact)
        working-directory: harness
        env:
          MPP_INTEROP_CLIENTS: typescript
          MPP_INTEROP_SERVERS: go-paykit,typescript
          MPP_INTEROP_INTENTS: charge,x402-exact
          MPP_INTEROP_SCENARIOS: charge-basic
          X402_INTEROP_CLIENTS: rust-x402
          X402_INTEROP_SERVERS: ""
          X402_INTEROP_SCENARIOS: x402-exact-basic
        run: pnpm exec vitest run test/e2e.test.ts --testNamePattern "go-paykit server" --testTimeout 180000

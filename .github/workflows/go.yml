name: Go

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test-go:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Run tests with coverage
        working-directory: go
        env:
          GOCACHE: /tmp/go-build-cache
        run: |
          go test \
            github.com/solana-foundation/pay-kit/go/paycore \
            github.com/solana-foundation/pay-kit/go/paycore/solanatx \
            github.com/solana-foundation/pay-kit/go/paycore/signer \
            github.com/solana-foundation/pay-kit/go/paycore/paymentchannels \
            github.com/solana-foundation/pay-kit/go/paykit \
            github.com/solana-foundation/pay-kit/go/protocols/mpp \
            github.com/solana-foundation/pay-kit/go/protocols/mpp/core \
            github.com/solana-foundation/pay-kit/go/protocols/mpp/wire \
            github.com/solana-foundation/pay-kit/go/protocols/mpp/intents \
            github.com/solana-foundation/pay-kit/go/protocols/mpp/server \
            github.com/solana-foundation/pay-kit/go/protocols/mpp/client \
            github.com/solana-foundation/pay-kit/go/protocols/mpp/errorcodes \
            github.com/solana-foundation/pay-kit/go/protocols/x402 \
            github.com/solana-foundation/pay-kit/go/protocols/x402/client \
            -coverprofile=coverage.out \
            -covermode=atomic
          ./scripts/check_coverage.sh coverage.out 91
      - name: Run all Go packages
        working-directory: go
        env:
          GOCACHE: /tmp/go-build-cache
        run: go test ./...
      - name: Upload Go coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: go/coverage.out

  lint-go:
    name: Go lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: gofmt check
        working-directory: go
        run: |
          unformatted=$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt drift:"
            echo "$unformatted"
            exit 1
          fi
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          working-directory: go
          version: v2.12.2
          args: --timeout=5m
          skip-cache: true

  harness-go:
    name: Go PayKit harness (mpp charge + x402 exact)
    needs: test-go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-go-harness-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-go-harness-
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - name: Install TypeScript workspace
        working-directory: typescript
        run: pnpm install --frozen-lockfile
      - name: Build TypeScript package
        working-directory: typescript
        run: pnpm --filter @solana/mpp build
      - name: Build Rust harness client
        working-directory: rust
        run: cargo build -p solana-mpp --bin harness_client
      - name: Build Rust x402 harness client
        working-directory: rust
        run: cargo build -p solana-x402 --bin harness_client
      - name: Install harness
        working-directory: harness
        run: pnpm install --frozen-lockfile
      - name: Typecheck harness
        working-directory: harness
        run: pnpm typecheck
      - name: Build Go paykit harness server
        working-directory: harness/go-server
        run: go build -o paykit-server .
      - name: Run Go PayKit harness matrix (mpp charge + x402 exact)
        working-directory: harness
        env:
          # Only the go server runs in this job, so every generated pair
          # targets it: no testNamePattern filter and no skipped rows.
          MPP_HARNESS_CLIENTS: typescript
          MPP_HARNESS_SERVERS: go
          MPP_HARNESS_INTENTS: charge,x402-exact
          # selectHarnessScenarios reads MPP_HARNESS_SCENARIOS for the
          # whole active set (x402 included), so x402-exact-basic must be
          # listed here. Charge scenarios the go server is eligible for:
          # basic, splits (Token + Token-2022), symbol resolution,
          # idempotent replay store, compute-budget cap, over-split
          # rejection, sum-equals-amount, and the two L6 fault-matrix
          # codes (wrong_network / charge_request_mismatch); plus the
          # x402 exact scheme.
          MPP_HARNESS_SCENARIOS: charge-basic,charge-split-ata,charge-symbol-usdc-localnet,charge-token2022-split-ata,charge-split-ata-idempotent,charge-compute-budget-over-cap,charge-splits-too-many,charge-splits-sum-equals-amount,charge-network-mismatch,charge-cross-route-replay,x402-exact-basic
          X402_HARNESS_CLIENTS: rust-x402,go-x402
          # Pin the x402 server set to the main go server (the rust-x402 /
          # ts-x402 server fixtures default on; exclude them so the only
          # x402 server is the go paykit server under test).
          X402_HARNESS_SERVERS: go
        run: pnpm exec vitest run test/e2e.test.ts --testTimeout 180000

  playground-go:
    name: "Payment links E2E: Playground (Go)"
    needs: test-go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - name: Install Surfnet helper dependencies
        working-directory: harness
        run: pnpm install --frozen-lockfile
      - name: Start Surfnet
        working-directory: .
        run: |
          node harness/start-surfnet-proxy.mjs &
          ready=0
          for i in $(seq 1 50); do
            if curl -sf -X POST http://localhost:8899 \
              -H "Content-Type: application/json" \
              -d '{"jsonrpc":"2.0","id":1,"method":"getHealth","params":[]}' \
              | grep -q '"result":"ok"'; then
              ready=1
              break
            fi
            sleep 0.2
          done
          test "$ready" -eq 1
      - name: Build Go playground API
        working-directory: go
        env:
          GOCACHE: /tmp/go-build-cache
        run: go build ./examples/playground-api
      - name: Start Go playground API
        working-directory: go
        env:
          GOCACHE: /tmp/go-build-cache
          PORT: "3002"
          NETWORK: localnet
          RPC_URL: http://localhost:8899
          MPP_SECRET_KEY: playground-ci-secret-padding-0123456789
        run: go run ./examples/playground-api &
      - name: Wait for playground server
        working-directory: .
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3002/api/v1/health && break
            sleep 1
          done
      - name: Install HTML dependencies & Playwright
        working-directory: html
        run: npm install && npx playwright install chromium
      - name: Run Playwright tests (Go playground)
        working-directory: html
        run: FORTUNE_PATH=/api/v1/fortune npm run test:e2e:go
